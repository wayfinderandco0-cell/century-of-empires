name: V267 original SOUTH river eastward terrain candidate (isolated)
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - scripts/rebuild_v267_south_river_east.py
      - .github/workflows/v267-south-river-east-art.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v267-south-river-east-art
  cancel-in-progress: false
jobs:
  build-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and real mobile-browser tools
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Build original SOUTH river terrain registration, opt-in only
        run: python scripts/rebuild_v267_south_river_east.py
      - name: Capture actual Chromium and WebKit iPhone-size comparison and march
        run: |
          python - <<'PY'
          from pathlib import Path
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          out=Path('art-reviews/v267-river-east-phone')
          out.mkdir(parents=True,exist_ok=True)
          server=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler)
          Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}/v267-three-octagon-original-art-prototype.html'
          with sync_playwright() as pw:
            for engine in ('chromium','webkit'):
              browser=getattr(pw,engine).launch(headless=True)
              images=[]
              for mode in ('default','river'):
                context=browser.new_context(viewport={'width':390,'height':844},
                  device_scale_factor=2,is_mobile=True,has_touch=True)
                page=context.new_page();errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                url=base+('?southArt=river' if mode=='river' else '')
                page.goto(url,wait_until='load')
                page.wait_for_function('window.COE && COE.originalMatreiLoaded && COE.sourceRegistered',timeout=90000)
                assert page.evaluate('COE.nodes')==100
                assert page.evaluate('COE.westSouthConnected')
                assert all(s['pass'] and s['gap']==0 for s in page.evaluate('COE.roadSeams'))
                page.evaluate('COE.focusJoin("south")')
                page.wait_for_timeout(250)
                shot=out/f'{engine}-{mode}-actual-iphone.png'
                page.screenshot(path=str(shot));images.append(Image.open(shot).convert('RGB'))
                if mode=='river':
                  page.evaluate('COE.focusJoin("west")')
                  page.touchscreen.tap(195,422)
                  assert page.evaluate('COE.moving'), 'touch march did not begin'
                  page.evaluate('COE.halt()')
                  assert page.evaluate('COE.marchWestToSouth()')
                  route=page.evaluate('COE.route')
                  assert len(route)==53 and [1536,478] in route and [2002,1024] in route
                  assert page.evaluate('COE.stepToEnd()')==[2806,1629]
                assert not errors,errors
                context.close()
                print(engine,mode,'actual 390x844 DPR2 scene and V123 route passed')
              sheet=Image.new('RGB',(images[0].width*2,images[0].height+55),'#191c19')
              sheet.paste(images[0],(0,55));sheet.paste(images[1],(images[0].width,55))
              draw=ImageDraw.Draw(sheet)
              draw.text((15,18),'DEFAULT SOUTH - current',fill='white')
              draw.text((images[0].width+15,18),'RIVER EAST - UNAPPROVED',fill='white')
              sheet.save(out/f'{engine}-same-camera-before-after.jpg',quality=88)
              browser.close()
          server.shutdown()
          PY
      - name: Protect Matrei, graph, engine, sprites and saves
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines())
          names={s[3:] for s in changed}
          allowed={'v267-three-octagon-original-art-prototype.html',
            'art-reviews/v267-original-source/south-river-east-contact-unapproved.webp',
            'art-reviews/v267-south-river-east-contact-review.md'}
          unexpected={p for p in names if p not in allowed and not p.startswith('art-reviews/v267-river-east-phone/')}
          assert not unexpected,unexpected
          assert 'v267-three-octagon-original-art-prototype.html' in names
          assert 'art-reviews/v267-original-source/south-river-east-contact-unapproved.webp' in names
          print('Only isolated preview, original photographic candidate and evidence changed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-south-river-east-actual-mobile-art-review
          path: |
            art-reviews/v267-original-source/south-river-east-contact-unapproved.webp
            art-reviews/v267-south-river-east-contact-review.md
            art-reviews/v267-river-east-phone/
          retention-days: 14
      - name: Commit candidate and actual screenshots on SAME isolated branch
        run: |
          git config user.name "century-of-empires-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "Branch advanced; artifact preserved, no stale push."
            exit 0
          fi
          git add v267-three-octagon-original-art-prototype.html \
            art-reviews/v267-original-source/south-river-east-contact-unapproved.webp \
            art-reviews/v267-south-river-east-contact-review.md \
            art-reviews/v267-river-east-phone/
          if git diff --cached --quiet; then
            echo "No art change; no version-only commit."
          else
            git commit -m "Register SOUTH river east with native terrain and real phone review"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
