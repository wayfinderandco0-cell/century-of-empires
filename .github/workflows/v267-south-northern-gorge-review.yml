name: V267 SOUTH native forest-shoulder artwork — real mobile review
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - scripts/compose_v267_south_forest_swap.py
      - .github/workflows/v267-south-northern-gorge-review.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: v267-south-northern-gorge-review
  cancel-in-progress: false
jobs:
  render-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photographic tools and mobile browser engines
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Compose relocated native SOUTH forest and meadow on SAME isolated candidate
        run: python scripts/compose_v267_south_forest_swap.py
      - name: Capture actual phone-size visual evidence and test original V123 movement
        run: |
          python - <<'PY'
          from pathlib import Path
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from PIL import Image,ImageDraw
          from playwright.sync_api import sync_playwright
          out=Path('art-reviews/v267-forest-shoulder-phone')
          out.mkdir(parents=True,exist_ok=True)
          server=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler)
          Thread(target=server.serve_forever,daemon=True).start()
          url=f'http://127.0.0.1:{server.server_port}/v267-three-octagon-original-art-prototype.html'
          with sync_playwright() as pw:
            for engine in ('webkit','chromium'):
              browser=getattr(pw,engine).launch(headless=True)
              shots={}
              for mode in ('default','forest'):
                ctx=browser.new_context(viewport={'width':390,'height':844},
                  device_scale_factor=2,is_mobile=True,has_touch=True)
                page=ctx.new_page()
                errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto(url+'?southArt='+mode,wait_until='load')
                page.wait_for_function(
                  'window.COE && COE.originalMatreiLoaded && COE.sourceRegistered',
                  timeout=90000)
                assert page.evaluate('COE.nodes')==100
                assert page.evaluate('COE.westSouthConnected')
                assert all(s['pass'] and s['gap']==0 for s in page.evaluate('COE.roadSeams'))
                page.wait_for_timeout(850)
                page.evaluate('COE.focusJoin("south")')
                page.wait_for_timeout(500)
                page.evaluate('COE.focusJoin("south")')
                page.wait_for_timeout(350)
                path=out/f'{engine}-{mode}-road-actual-iphone.png'
                page.screenshot(path=str(path))
                shots[(mode,'road')]=Image.open(path).convert('RGB')
                page.mouse.move(350,390)
                page.mouse.down()
                page.mouse.move(40,390,steps=18)
                page.mouse.up()
                page.wait_for_timeout(500)
                path=out/f'{engine}-{mode}-river-actual-iphone.png'
                page.screenshot(path=str(path))
                shots[(mode,'river')]=Image.open(path).convert('RGB')
                if mode=='forest':
                  page.evaluate('COE.focusJoin("west")')
                  page.touchscreen.tap(195,422)
                  assert page.evaluate('COE.moving')
                  page.evaluate('COE.halt()')
                  assert page.evaluate('COE.marchWestToSouth()')
                  route=page.evaluate('COE.route')
                  assert len(route)==53 and [1536,478] in route and [2002,1024] in route
                  assert page.evaluate('COE.stepToEnd()')==[2806,1629]
                assert not errors,errors
                ctx.close()
              for camera in ('road','river'):
                sheet=Image.new('RGB',(1560,1740),'#1c211d')
                sheet.paste(shots[('default',camera)],(0,52))
                sheet.paste(shots[('forest',camera)],(780,52))
                d=ImageDraw.Draw(sheet)
                d.text((12,18),'BEFORE: current SOUTH - UNAPPROVED',fill='white')
                d.text((792,18),'AFTER: native SOUTH forest shoulder - UNAPPROVED',fill='white')
                sheet.save(out/f'{engine}-{camera}-actual-before-after.webp',
                           format='WEBP',quality=86,method=6)
              browser.close()
          server.shutdown()
          print('Actual WebKit/Chromium DPR2 screenshots and V123 march passed; artwork requires eyes-on visual approval')
          PY
      - name: Preserve compact REAL WebKit screenshot for eyes-on inspection
        run: |
          python - <<'PY'
          import base64,io
          from pathlib import Path
          from PIL import Image
          folder=Path('art-reviews/v267-forest-shoulder-phone')
          for view in ('river','road'):
              image=Image.open(folder/f'webkit-{view}-actual-before-after.webp').convert('RGB')
              image.thumbnail((760,850),Image.Resampling.LANCZOS)
              buf=io.BytesIO()
              image.save(buf,'JPEG',quality=48,optimize=True)
              (folder/f'webkit-{view}-review-thumbnail.jpg.b64').write_text(
                  base64.b64encode(buf.getvalue()).decode('ascii'))
              print(view,'real phone comparison thumbnail',image.size,len(buf.getvalue()))
          PY
      - name: Guard original V121/V123/V94, sprites and saves
        run: |
          python - <<'PY'
          import subprocess
          changed={x[3:] for x in subprocess.check_output(
            ['git','status','--porcelain','-uall'],text=True).splitlines()}
          allowed={'v267-three-octagon-original-art-prototype.html',
            'art-reviews/v267-original-source/south-forest-shoulder-recomposed-unapproved.webp',
            'art-reviews/v267-south-forest-shoulder-review.md'}
          bad={p for p in changed if p not in allowed and
            not p.startswith('art-reviews/v267-forest-shoulder-phone/')}
          assert not bad,bad
          assert 'art-reviews/v267-original-source/south-forest-shoulder-recomposed-unapproved.webp' in changed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-forest-shoulder-actual-phone
          path: |
            art-reviews/v267-original-source/south-forest-shoulder-recomposed-unapproved.webp
            art-reviews/v267-south-forest-shoulder-review.md
            art-reviews/v267-forest-shoulder-phone/
          retention-days: 14
      - name: Commit original source art and actual screenshots on SAME branch
        run: |
          git config user.name "century-of-empires-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "Branch advanced; preserve artifact without stale push."
            exit 0
          fi
          git add v267-three-octagon-original-art-prototype.html \
            art-reviews/v267-original-source/south-forest-shoulder-recomposed-unapproved.webp \
            art-reviews/v267-south-forest-shoulder-review.md \
            art-reviews/v267-forest-shoulder-phone/
          if git diff --cached --quiet; then
            echo "No new artwork; skip commit."
          else
            git commit -m "Recompose SOUTH native forest shoulder with actual mobile evidence"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
