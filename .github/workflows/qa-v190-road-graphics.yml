name: V190 Road Graphics and Terrain Parity QA
on:
  push:
    branches: [main]
    paths:
      - 'v190-alpine-road-graphics-trial.html'
      - 'scripts/qa_v190_road_graphics.py'
      - 'scripts/qa_v190_three_center_art.py'
      - '.github/workflows/qa-v190-road-graphics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v190-road-art-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium webkit
      - run: python scripts/qa_v190_road_graphics.py
      - run: python scripts/qa_v190_three_center_art.py --capture --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v190-mobile-graphics-and-road-alignment
          path: |
            qa/v190-road-graphics/
            qa/v190-three-centers/
