name: V267 new road-free countryside art raster and WebKit review
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - terrain-grid/tools/build-v267-forest-meadow-01.js
      - terrain-grid/v267-countryside-original/forest-meadow-01.svg
      - v267-countryside-01-review.html
      - .github/workflows/v267-countryside-original-art.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v267-countryside-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  countryside-original-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: terrain-v267-three-original-art-prototype-20261028
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG rasterizer and real mobile WebKit
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow playwright
          python -m playwright install --with-deps webkit
      - name: Confirm source is reproducible and baseline files are untouched
        run: |
          node terrain-grid/tools/build-v267-forest-meadow-01.js > /tmp/countryside-regenerated.svg
          cmp /tmp/countryside-regenerated.svg terrain-grid/v267-countryside-original/forest-meadow-01.svg
          sha256sum terrain-grid/art/matrei-v121-original.webp terrain-grid/v123-atlas.js index.html art-reviews/v267-original-source/west-unified-native-border-unapproved.webp art-reviews/v267-original-source/south-unified-native-border-unapproved.webp > /tmp/approved-before.sha
      - name: Render actual 1536x1024 original-art candidate WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          root=Path('terrain-grid/v267-countryside-original')
          png=root/'forest-meadow-01.png'
          cairosvg.svg2png(url=str(root/'forest-meadow-01.svg'),write_to=str(png),output_width=1536,output_height=1024)
          with Image.open(png) as im:
            assert im.size==(1536,1024)
            im.convert('RGB').save(root/'forest-meadow-01.webp','WEBP',quality=93,method=6)
          png.unlink()
          with Image.open(root/'forest-meadow-01.webp') as im:
            assert im.size==(1536,1024)
            assert im.getbbox()
          print('New original vector source rasterized to full-resolution WebP; quality not approved.')
          PY
      - name: Actual 390x844 mobile WebKit screenshot and pinch/zoom checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/countryside-http.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('terrain-grid/v267-countryside-original/actual-webkit-iphone-forest-meadow-01.png')
          with sync_playwright() as p:
            browser=p.webkit.launch()
            page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
            page.goto('http://127.0.0.1:8765/v267-countryside-01-review.html',wait_until='domcontentloaded',timeout=60000)
            page.locator('#scene img').evaluate('(img)=>img.decode()')
            assert page.locator('#scene img').evaluate('(img)=>img.naturalWidth')==1536
            page.locator('#plus').click()
            assert 'scale(1.25)' in page.locator('#scene').get_attribute('style')
            page.locator('#fit').click()
            page.screenshot(path=str(out),full_page=True)
            assert out.stat().st_size>20000
            browser.close()
          print('Actual WebKit candidate art load and zoom PASS; visual match and gameplay not certified.')
          PY
      - name: Confirm original art and gameplay sources unchanged
        run: |
          sha256sum terrain-grid/art/matrei-v121-original.webp terrain-grid/v123-atlas.js index.html art-reviews/v267-original-source/west-unified-native-border-unapproved.webp art-reviews/v267-original-source/south-unified-native-border-unapproved.webp > /tmp/approved-after.sha
          diff -u /tmp/approved-before.sha /tmp/approved-after.sha
      - name: Commit actual raster art and iPhone screenshot to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-grid/v267-countryside-original/forest-meadow-01.webp terrain-grid/v267-countryside-original/actual-webkit-iphone-forest-meadow-01.png
          if ! git diff --cached --quiet; then
            git commit -m "Rasterize original forest-meadow candidate and capture real iPhone WebKit"
            git pull --rebase origin terrain-v267-three-original-art-prototype-20261028
            git push origin HEAD:terrain-v267-three-original-art-prototype-20261028
          fi
