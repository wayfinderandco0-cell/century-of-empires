name: Octagon 1 Independent Source-Art Review
on:
  push:
    branches: [octagon-1-raw-art-review-20261022]
    paths:
      - "scripts/audit_octagon_1_source_art.py"
      - "tests/test_octagon_1_source_art.py"
      - ".github/workflows/qa-octagon-1-raw-art.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  raw-source-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pillow
      - run: python -m unittest discover -s tests -p 'test_octagon_1_source_art.py' -v
      - run: python scripts/audit_octagon_1_source_art.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octagon-1-original-jpeg-review
          path: qa/octagon-1-raw-art/
