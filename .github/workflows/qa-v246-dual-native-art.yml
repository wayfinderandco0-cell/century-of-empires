name: V246 Dual Native Road Art Review (PRODUCTION RED)
on:
  push:
    branches: [terrain-v246-dual-native-cartway-pair-gate-20261027]
  workflow_dispatch:
jobs:
  dual-native-art:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-pixel image geometry dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy opencv-python-headless
      - name: Compile new dual-image auditor and inherited V245 warp
        run: python -m py_compile scripts/v246_dual_native_art_review.py scripts/test_v246_dual_native_art_review.py scripts/v245_south_2d_native_warp.py
      - name: Run real-pixel synthetic WEST and SOUTH registration and negative controls
        run: V246_SYNTHETIC_OUT=qa/v246-synthetic-NOT-GAME-ART PYTHONPATH=scripts python -m unittest -v test_v246_dual_native_art_review
      - name: Recheck immutable V123 route and V245 vertical-entry regression
        run: |
          PYTHONPATH=scripts python -m unittest -v test_v243_road_conditioning test_v245_south_2d_native_warp
      - name: Upload exact-route screenshots (synthetic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v246-dual-native-source-geometry-NOT-GAME-ART
          path: qa/v246-synthetic-NOT-GAME-ART/
          if-no-files-found: warn
      - name: PRODUCTION RED — no independently licensed photo-grade accepted pair
        run: |
          echo "ART RED: synthetic source tests do not establish historic geography, verified road banks, V203, four-browser artwork or user approval."
          exit 1
