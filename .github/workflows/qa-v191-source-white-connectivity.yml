name: V191 source white-region connectivity — NOT GAME ART
on:
  push:
    branches: [terrain-v191-source-white-connectivity-20261025]
    paths:
      - 'scripts/v191_south_nodata_components.py'
      - 'scripts/test_v191_south_nodata_components.py'
      - '.github/workflows/qa-v191-source-white-connectivity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  modern-source-evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Preserve 32 inherited source tests and run six new region tests
        run: |
          python scripts/test_v184_matrei_brenner_overview.py
          python scripts/test_v185_south_tyrol_probe.py
          python scripts/test_v186_south_border_candidates.py
          python scripts/test_v187_crossborder_seam_audit.py
          python -m unittest discover -s scripts -p 'test_v191_south_nodata_components.py' -v
      - name: Restore original verified Austrian 60-tile modern source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run download 40193742019 -R "$GITHUB_REPOSITORY" \
            -n v184-60tile-modern-geographic-overview-NOT-GAME-ART \
            -D qa/v184-matrei-brenner-overview; then
            python scripts/v184_matrei_brenner_overview.py --download
          fi
          python scripts/v184_matrei_brenner_overview.py --verify
      - name: Restore original verified South Tyrol candidate overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run download 40202212082 -R "$GITHUB_REPOSITORY" \
            -n v186-south-border-candidates-NOT-GAME-ART \
            -D qa/v186-south-border-candidates; then
            python scripts/v186_south_border_candidates.py --fetch
          fi
          python scripts/v186_south_border_candidates.py --verify
      - name: Measure component connectivity without editing source or game art
        run: |
          python scripts/v191_south_nodata_components.py
          python scripts/v191_south_nodata_components.py --verify
          python - <<'PY'
          import json
          report=json.load(open('qa/v191-white-component-review/white-component-review-NOT-GAME.json'))
          assert report['candidatePixels'] == 138560
          assert sum(group['pixels'] for group in report['classification'].values()) == 138560
          assert report['southEdgeConnectedIsNotBorderOrNoDataProof']
          assert report['edgeConnectedSnowOrCloudStillPossible']
          assert all(report[k] is False for k in (
            'geographicSourceCoverageApproved','snowExcluded','historicalRoadsVerified',
            'bridgeBanksVerified','v123RoadsGeoregistered','periodArtComplete',
            'gameArtCoverageApproved','physicalIPhoneApproved','productionApproved'))
          print('SOURCE-ONLY classification:', report['classification'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v191-white-component-review-NOT-GAME-ART
          path: qa/v191-white-component-review/
          retention-days: 7
