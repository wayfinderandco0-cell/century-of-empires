name: V267 SOUTH natural photographic apron (isolated, unapproved)
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - scripts/rebuild_v267_south_natural_apron.py
      - .github/workflows/v267-south-natural-apron.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v267-south-natural-apron
  cancel-in-progress: false
jobs:
  build-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photographic art and actual-browser tools
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Rebuild SOUTH terrain and natural Matrei join
        run: python scripts/rebuild_v267_south_natural_apron.py
      - name: Render real three-octagon phone screenshots (not synthetic)
        run: python scripts/v267_clean_visual_review.py
      - name: Verify actual-art Chromium and WebKit portrait/landscape movement
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          html=Path('v267-three-octagon-original-art-prototype.html').read_text()
          out=Path('art-reviews/v267-apron-mobile');out.mkdir(exist_ok=True)
          with sync_playwright() as pw:
            for engine in ('chromium','webkit'):
              browser=getattr(pw,engine).launch(headless=True)
              for orientation,(w,h) in {'portrait':(390,844),'landscape':(844,390)}.items():
                ctx=browser.new_context(viewport={'width':w,'height':h},device_scale_factor=2,is_mobile=True,has_touch=True)
                page=ctx.new_page();errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                page.set_content(html,wait_until='load')
                page.wait_for_function('window.COE && COE.originalMatreiLoaded && COE.sourceRegistered',timeout=90000)
                assert page.evaluate('COE.nodes')==100
                assert page.evaluate('COE.uniqueWorldNodes')==98
                assert page.evaluate('COE.westSouthConnected')
                assert all(s['pass'] and s['gap']==0 for s in page.evaluate('COE.roadSeams'))
                page.evaluate('COE.focusJoin("west")');page.wait_for_timeout(100)
                page.touchscreen.tap(w/2,h/2)
                assert page.evaluate('COE.moving'),(engine,orientation,'touch march')
                page.evaluate('COE.halt()')
                assert page.evaluate('COE.marchWestToSouth()')
                route=page.evaluate('COE.route')
                assert len(route)==53 and [1536,478] in route and [2002,1024] in route
                assert page.evaluate('COE.stepToEnd()')==[2806,1629]
                page.evaluate('COE.focusJoin("south")');page.wait_for_timeout(150)
                page.screenshot(path=str(out/f'{engine}-{orientation}-actual-south-join.png'))
                assert not errors,errors
                print(engine,orientation,'actual art loaded, touch march, 53-node route, both seams OK')
                ctx.close()
              browser.close()
          PY
      - name: Assert changed paths cannot affect engine or V121/V123
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'v267-three-octagon-original-art-prototype.html',
            'art-reviews/v267-original-source/south-northern-apron-unapproved.jpg',
            'art-reviews/v267-south-northern-apron-review.md',
            'art-reviews/v267-road-scene-current.jpg',
            'art-reviews/v267-road-scene-current.json'
          }
          changed=set(subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines())
          names={s[3:] for s in changed}
          print('Changed paths:',sorted(names))
          assert names <= allowed,(names-allowed)
          if names: print('Art and screenshot changes staged for review')
          else: print('Already integrated; verification only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-south-natural-apron-real-phone-review
          path: |
            art-reviews/v267-road-scene-current.jpg
            art-reviews/v267-road-scene-current.json
            art-reviews/v267-original-source/south-northern-apron-unapproved.jpg
            art-reviews/v267-south-northern-apron-review.md
            art-reviews/v267-apron-mobile/
          retention-days: 14
      - name: Commit ONLY review art if branch has not advanced
        run: |
          git config user.name "century-of-empires-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "Branch advanced; preserve artifact, do not push stale work."
            exit 0
          fi
          git add v267-three-octagon-original-art-prototype.html \
            art-reviews/v267-original-source/south-northern-apron-unapproved.jpg \
            art-reviews/v267-south-northern-apron-review.md \
            art-reviews/v267-road-scene-current.jpg \
            art-reviews/v267-road-scene-current.json
          if ! git diff --cached --name-only | grep -qx 'v267-three-octagon-original-art-prototype.html'; then
            echo "No new art; do not create screenshot-only commit."
          else
            git commit -m "Rebuild natural SOUTH/Matrei photographic seam and preserve actual phone views"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
