name: V194 Weathered Cartway Pixel and Mobile QA
on:
  push:
    branches: ['terrain-v194-weathered-cartway-verges-20261025']
    paths:
      - 'v192-weathered-cartways-graphics-test.html'
      - 'scripts/qa_v194_cartway_pigment.py'
      - 'scripts/qa_v192_cartways.py'
      - 'scripts/qa_v192_terrain_parity.py'
      - 'scripts/qa_v193_camera_coverage.py'
      - '.github/workflows/qa-v194-weathered-cartways.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v194-pixel-and-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium webkit
      - run: python scripts/qa_v194_cartway_pigment.py
      - run: python scripts/qa_v192_cartways.py
      - run: python scripts/qa_v192_terrain_parity.py --capture --enforce
      - run: python scripts/qa_v193_camera_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v194-weathered-cartway-mobile-evidence
          path: |
            qa/v194-cartway-material/
            qa/v192-road-graphics/
            qa/v192-three-centers/
            qa/v193-camera-coverage/
