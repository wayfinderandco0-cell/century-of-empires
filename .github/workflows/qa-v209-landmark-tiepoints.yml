name: V209 V123/Modern-Source Landmark Intake (NO REGISTRATION)
on:
  push:
    branches: ['terrain-v209-landmark-tiepoint-intake-20261026']
    paths:
      - 'scripts/v209_landmark_tiepoint_intake.py'
      - 'scripts/test_v209_landmark_tiepoint_intake.py'
      - 'terrain-grid/v209-unverified-tiepoints.json'
      - '.github/workflows/qa-v209-landmark-tiepoints.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-landmark-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Retain V208 and inherited source identity gates
        run: |
          python scripts/test_v204_contiguous_matrei_sources.py
          python scripts/test_v205_adjacent_forest_materials.py
          python scripts/test_v206_audited_natural_cover.py
          python scripts/test_v207_conservative_modern_masks.py
          python scripts/test_v208_source_game_frame_audit.py
      - name: Test genuine V123 polygon and EPSG3857 source landmark candidate math
        run: python scripts/test_v209_landmark_tiepoint_intake.py
      - name: Export truthful empty-evidence report
        run: python scripts/v209_landmark_tiepoint_intake.py --report qa/v209-landmark-intake/report.json
      - name: Confirm no unverified geographic registration can pass
        run: |
          set +e
          python scripts/v209_landmark_tiepoint_intake.py --report qa/v209-landmark-intake/report.json --require-registered
          result=$?
          set -e
          test "$result" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v209-actual-three-cell-landmark-evidence-deficit-NOT-APPROVED
          path: qa/v209-landmark-intake/
          retention-days: 7
