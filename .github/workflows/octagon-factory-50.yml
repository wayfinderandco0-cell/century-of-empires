              assert not c['gameplayEnabled'] and not c['historicallyVerified']
          print('PASS: 27 real photo derivatives, 28 native joins, 2 blocked joins, 8 road-free inlays, zero playable')
          PY
      - name: Review native game 27-cell coverage and close-up in actual mobile WebKit
