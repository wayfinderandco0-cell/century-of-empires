name: Octagon 1 Road Authoring QA
on:
  push:
    branches: [octagon-1-road-authoring, octagon-1-fork-bank-route, octagon-1-source-asset-gate-20261022, octagon-1-art-review-clean-20261022]
    paths:
      - "octagon-1-road-authoring.html"
      - "terrain-grid/octagon-1-v119-source.jpg"
      - "scripts/octagon_1_corridor_gate.js"
      - "scripts/qa_octagon_1_road.py"
      - ".github/workflows/qa-octagon-1-road.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mobile-browser-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python scripts/qa_octagon_1_road.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octagon-1-source-first-qa
          path: qa/octagon-1/
