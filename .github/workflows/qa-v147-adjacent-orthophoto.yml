name: V147 adjacent official orthophoto source mosaic
on:
  push:
    branches: [terrain-v147-orthophoto-adjacent-mosaic-20261023]
    paths:
      - 'scripts/v146_orthophoto_sample.py'
      - 'scripts/v147_orthophoto_mosaic.py'
      - 'scripts/test_v147_orthophoto_mosaic.py'
      - 'terrain-v102/manifest.json'
      - '.github/workflows/qa-v147-adjacent-orthophoto.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-geographic-mosaic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.0.0
      - name: V146 source and V147 adjacent seam/geometry tests
        run: |
          python scripts/test_v146_orthophoto_sample.py -v
          python scripts/test_v147_orthophoto_mosaic.py -v
      - name: Download nine genuine adjacent modern source tiles and stitch 1:1
        run: python scripts/v147_orthophoto_mosaic.py --download --output qa/v147-orthophoto-mosaic
      - name: Revalidate downloaded image hashes, bounds and seams
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0,'scripts')
          from v147_orthophoto_mosaic import validate_grid,assemble
          d=pathlib.Path('qa/v147-orthophoto-mosaic')
          m=json.loads((d/'manifest.json').read_text())
          validate_grid(m)
          image, seams=assemble(m,d)
          assert image.size==(768,768)
          assert len(seams)==12
          assert all(s['meanRgbChannelDelta']>=0 for s in seams)
          assert not m['gameRouteGeoregistered'] and not m['productionApproved']
          print('V147: 9 official tiles verified, 12 adjacent edges measured, 0 game-road certification')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-attributed-geographic-mosaic-not-game-art
          path: qa/v147-orthophoto-mosaic/
          if-no-files-found: warn
          retention-days: 14
