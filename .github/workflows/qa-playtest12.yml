name: 12-Province iPhone Gameplay QA
on:
  push:
    branches: [main]
    paths:
      - 'playtest-12.html'
      - 'scripts/qa_playtest12.py'
      - '.github/workflows/qa-playtest12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test twelve-province gameplay in iPhone-size browsers
        run: python scripts/qa_playtest12.py
      - name: Upload before and after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest12-mobile-screenshots
          path: qa/playtest12/
