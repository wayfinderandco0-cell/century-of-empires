name: V232 Cartway Ground Clearance Preflight (ART RED)
on:
  push:
    branches: ['terrain-v232-route-ground-clearance-preflight-20261027']
  workflow_dispatch:
concurrency:
  group: v232-road-ground-preflight
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-art-ground-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image and provenance dependencies
        run: python -m pip install pillow numpy requests opencv-python-headless
      - name: V232 immutable V123 route, open-ground, forest and rock negative controls
        run: python -m unittest discover -s scripts -p 'test_v232_route_ground_preflight.py' -v
      - name: Generate both pinned CC0 source-art images from V231 for semantic rejection
        run: python scripts/build_v231_cc0_oblique_art.py
      - name: Inspect actual 1536x1024 source pixels against original V123 road footprints
        run: |
          python scripts/v232_route_ground_preflight.py \
            --west terrain-v231/assets/west-austrian-natural-cover-v231.webp \
            --south terrain-v231/assets/south-austrian-natural-cover-v231.webp \
            --output qa/v232-road-ground
      - name: Preserve diagnostic image overlays and machine-readable metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v232-actual-source-route-obstructions-ART-NOT-APPROVED
          path: |
            qa/v232-road-ground/
          retention-days: 7
      - name: Keep art gate RED if both original cartways cannot be grounded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('qa/v232-road-ground/report.json').read_text())
          assert r['productionApproved'] is False
          assert r['humanVisualApproval'] is False
          assert r['sourceRegisteredToV123'] is False
          if not r['bothGroundGatesPass']:
              raise SystemExit('RED by design: do not run expensive four-browser art QA on unsuitable source images')
          raise SystemExit('RED: semantic preflight alone never establishes physical route, V203, or user approval')
          PY
