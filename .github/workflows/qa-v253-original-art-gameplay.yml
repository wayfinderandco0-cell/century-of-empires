name: V253 Original-Source Real Gameplay Browser QA (ART RED)
on:
  push:
    branches: ['terrain-v253-original-art-four-browser-playtest-20261027']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v253-original-source-real-gameplay
  cancel-in-progress: true
jobs:
  actual-browser-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and image dependencies (free)
        run: |
          python -m pip install pillow numpy playwright
          python -m playwright install --with-deps chromium webkit
      - name: Preserve immutable game/route and pinned-source regressions
        run: |
          node scripts/test_v249_pinned_source_art_review.js
          node scripts/test_v248_native_cartway_review.js
          node scripts/test_v242_photo_art_import.js
          python -m py_compile scripts/qa_v253_original_art_playtest.py
      - name: Real original-source game-renderer four-browser screenshots
        run: python scripts/qa_v253_original_art_playtest.py
      - name: Strict V203 landscape diagnostics (never approval)
        continue-on-error: true
        run: python scripts/qa_v203_canopy_structure.py --screenshots qa/v253-original-art-playtest --output qa/v253-strict-v203 --enforce
      - name: Preserve screenshot evidence and actual repository source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v253-actual-gameplay-source-and-screenshots-UNAPPROVED
          path: |
            qa/v253-original-art-playtest/
            qa/v253-strict-v203/
            v249-pinned-source-art-review.html
            v121-octagon-1-painted-road.html
            terrain-grid/
            terrain-v224/
            scripts/qa_v253_original_art_playtest.py
          retention-days: 14
      - name: Production art gate remains RED pending independent source and user acceptance
        if: always()
        run: |
          echo "Browser operation is not human visual approval or verified 1780 geographic art."
          echo "WEST/SOUTH sources are REJECTED; source tiepoints, bridge banks, V203 and user approval missing."
          exit 1
