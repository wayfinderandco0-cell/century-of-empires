name: Build isolated V97 high-resolution Alpine terrain

on:
  push:
    branches: [terrain-v97-brenner]
    paths:
      - scripts/build_v97_brenner.py
      - .github/workflows/build-v97-brenner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install terrain processing dependencies
        run: python -m pip install --disable-pip-version-check "numpy<3" "rasterio>=1.3,<2" Pillow
      - name: Download measured topography and woodland and render preview assets
        run: python -u scripts/build_v97_brenner.py
      - name: Check both raster data and file sizes
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          from pathlib import Path
          d=Path('terrain-v97')
          m=json.loads((d/'manifest.json').read_text())
          data=json.loads((d/'brenner-data.json').read_text())
          assert m['imageSize']==[1552,1782]
          assert Image.open(d/'brenner-relief.webp').size==(1552,1782)
          assert len(data['elevationM'])==260*300 and len(data['treeGrid'])==260*300
          assert m['coverage']['elevation']>=0.98 and m['coverage']['landCover']>=0.98
          print('HIGH-RESOLUTION BREN NER ASSETS VALIDATED')
          PY
      - name: Commit generated assets to isolated branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-v97/
          if ! git diff --cached --quiet; then
            git commit -m "V97: measured Brenner elevation and forest preview assets"
            git push origin HEAD:terrain-v97-brenner
          fi
