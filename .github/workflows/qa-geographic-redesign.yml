name: Geography-first Alpine map iPhone QA
on:
  push:
    branches: [map-geographic-redesign-matrei-20261110]
    paths:
      - 'geo-redesign/**'
      - '.github/workflows/qa-geographic-redesign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geography:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identical display and routing geometry
        run: node geo-redesign/test-road-graph.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test real browser rendering, march, pan and zoom at iPhone size
        run: python geo-redesign/browser_qa.py
      - name: Verify playable external HTTPS branch preview in Chromium
        env:
          COE_PREVIEW_URL: https://wayfinderandco0-cell.github.io/century-of-empires/geo-preview/index.html
          COE_QA_TAG: hosted
          COE_BROWSERS: chromium
        run: python geo-redesign/browser_qa.py
      - name: Preserve visual evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-brenner-mobile-screenshots
          path: qa/geo-redesign/
          if-no-files-found: warn