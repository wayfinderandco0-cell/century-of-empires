name: V272 Candidate Alpine Atlas Mobile QA
on:
  push:
    branches: [main]
    paths:
      - 'v272-original-scene-candidates.html'
      - 'scripts/qa_v272_candidate_atlas.py'
      - '.github/workflows/qa-v272-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v272-mobile-landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps webkit
      - run: python scripts/qa_v272_candidate_atlas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v272-iphone-alpine-scenes
          path: qa/v272-candidate-atlas/
