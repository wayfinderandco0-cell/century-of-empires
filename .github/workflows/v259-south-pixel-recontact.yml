name: V259 SOUTH Physical Road Pixel Recontact (PRODUCTION RED)
on:
  push:
    branches:
      - terrain-v259-offline-real-renderer-road-recontact-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-geometry-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry libraries
        run: python -m pip install numpy scipy opencv-python-headless
      - name: Compile and run V259 synthetic tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/v259_south_pixel_recontact.py scripts/test_v259_south_pixel_recontact.py scripts/qa_v259_offline_real_renderer.py
          python scripts/test_v259_south_pixel_recontact.py -v
      - name: Fail closed on protected game files
        run: |
          set -euo pipefail
          git cat-file -e b29bbf06^{commit}
          git diff --name-only b29bbf06 HEAD > /tmp/v259-changed
          if grep -E '^(index\.html|v94-|v121-octagon-1-painted-road\.html|terrain-grid/v12[13]-|campaign|saves|assets/sprites)' /tmp/v259-changed; then
            echo "PROTECTED GAME FILE CHANGED"; exit 1
          fi
          echo "Protected files unchanged. Exact original images NOT hosted in CI."
  offline-browser-harness-fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Chromium and WebKit
        run: |
          python -m pip install pillow numpy playwright
          python -m playwright install --with-deps chromium webkit
      - name: Real V249 renderer in-memory, FOUR configs with REJECTED fixtures
        run: |
          python scripts/qa_v259_offline_real_renderer.py --west terrain-v224/assets/west.webp --south terrain-v224/assets/south.webp --out qa/v259-offline-fixture-UNAPPROVED
      - name: Strict V203 on fixture screenshots (diagnostic, never approval)
        continue-on-error: true
        run: |
          mkdir -p qa/v259-v203-input
          for engine in chromium webkit; do
            for orientation in portrait landscape; do
              for tile in west matrei south; do
                cp "qa/v259-offline-fixture-UNAPPROVED/$engine-$orientation-$tile-RAW-UNAPPROVED.png" "qa/v259-v203-input/$engine-$orientation-$tile-close.png"
              done
            done
          done
          python scripts/qa_v203_canopy_structure.py --screenshots qa/v259-v203-input --output qa/v259-v203-report --enforce
      - name: Preserve actual browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v259-offline-renderer-FOUR-BROWSER-FIXTURE-ONLY-ART-RED
          path: |
            qa/v259-offline-fixture-UNAPPROVED/
            qa/v259-v203-report/
          retention-days: 14
  production-art-approval:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Exact-art WebKit, V203, geodesy, bridge banks, user approval remain RED
        run: |
          echo "Fixture browser QA is NOT four-browser validation of the original V259 image pair."
          echo "Do not promote WEST/SOUTH art without strict V203 and explicit user acceptance."
          exit 1
