name: Integrated historical world atlas iPhone QA
on:
  push:
    branches:
      - fix-integrated-world-atlas-20261117
  pull_request:
    paths:
      - 'index.html'
      - 'historical-data/**'
      - 'scripts/qa_integrated_world.py'
      - '.github/workflows/qa-integrated-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-atlas-in-game:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebKit and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test world overview inside actual campaign
        run: python scripts/qa_integrated_world.py
      - name: Upload full-map and Europe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-atlas-mobile
          path: qa/integrated-world/
