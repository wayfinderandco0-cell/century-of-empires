name: V200 authentic source-site relief audit (NOT GAME art)
on:
  push:
    branches:
      - terrain-v200-source-relief-biome-audit-20261025
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v200-source-context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local image reader only
        run: python -m pip install pillow
      - name: Preserve original V121 painting and V123 road graph
        run: |
          test "$(git hash-object v121-octagon-1-painted-road.html)" = "4c6aa5cda9e7c359b6d2a49d5b5fe8a597346382"
          test "$(git hash-object terrain-grid/v123-atlas.js)" = "09f04b4062e24fbacbb645307462cdddce2b2aa3"
      - name: Run ten fail-closed source geography/period approval tests
        run: python scripts/test_v200_source_relief_audit.py
      - name: Preserve existing V178 source-to-atlas geographic regression
        run: node scripts/test_v178_geographic_crosswalk.js
      - name: Download exact independently verified V199 source metadata
        uses: actions/download-artifact@v4
        with:
          run-id: 40244811341
          name: v199-nine-real-clean-source-crops-NOT-GAME-ART
          github-token: ${{ github.token }}
          path: qa
      - name: Pin source artifact SHA and create geographic relief review
        run: python scripts/v200_source_relief_audit.py
      - name: Recompute and reject unsafe output status
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('qa/v200-source-biome-audit/manifest.json')
          m=json.loads(p.read_text())
          assert m['version']==200 and len(m['sites'])==9
          assert m['v97DataResolutionInsufficientForRoadOrBridgeSurvey']
          for key in ('v121PhotoRegistered','v123RoadsRegistered','periodSafe',
                      'historicalRoadsVerified','bridgeBanksVerified','gameArtApproved',
                      'physicalIPhoneApproved','productionApproved'):
              assert m[key] is False, key
          print('SOURCE map only; all game/road/visual/production flags FALSE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v200-geographic-source-relief-review-NOT-GAME
          path: qa/v200-source-biome-audit/
          if-no-files-found: warn
          retention-days: 7
