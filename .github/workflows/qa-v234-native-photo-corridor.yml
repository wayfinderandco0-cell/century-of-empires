name: V234 Native Photo Corridor Search (ART RED)
on:
  push:
    branches:
      - terrain-v234-native-photo-corridor-search-20261027
  workflow_dispatch:
jobs:
  native-source-art:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless requests
      - name: Compile and test source-native solver
        run: |
          python -m py_compile scripts/v234_native_corridor_crop.py scripts/v234_fetch_cc0_sources.py scripts/test_v234_native_corridor_crop.py
          python scripts/test_v234_native_corridor_crop.py
      - name: Fetch original pinned CC0 source photographs
        run: python scripts/v234_fetch_cc0_sources.py terrain-v234/originals
      - name: Analyze both entire high-resolution originals against immutable V123
        run: |
          python scripts/v234_native_corridor_crop.py --west terrain-v234/originals/west.jpg --south terrain-v234/originals/south.jpg --manifest terrain-v234/originals/source-manifest.json --output terrain-v234/review
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('terrain-v234/review/v234-report.json').read_text())
          for t in ('west','south'):
              s=r['tiles'][t]
              print(t, s['status'], s['nativeCrop'], s['topCandidates'][0]['ground'])
          print('Both source-native ground gates:',r['bothNecessaryGroundGatesPass'])
          print('Human visual approval:',r['humanVisualApproval'])
          PY
      - name: Upload original-pixel candidate/rejection images and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v234-source-native-review
          path: |
            terrain-v234/review/
            terrain-v234/originals/source-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed - no historical registration, V203 or user approval
        run: |
          echo 'ART RED: source-native ground clearance alone cannot approve visual quality, 1780 geography, bridge banks or user acceptance.'
          exit 1
