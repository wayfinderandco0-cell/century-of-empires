const currentMonth=()=>Math.max(0,(game.year-1780)*12+game.month);
function treaty(k){
if(!game.treaties)game.treaties={};
return game.treaties[k]||(game.treaties[k]={war:game.diplomacy?.[k]==='War',alliance:false,access:false,trade:false,pactUntil:0,truceUntil:0,trust:50,cooldownUntil:0,pending:null});
}
function pactRemaining(k){return Math.max(0,treaty(k).pactUntil-currentMonth())}
function truceRemaining(k){return Math.max(0,treaty(k).truceUntil-currentMonth())}
function relation(k){const t=treaty(k);return t.war?'War':t.alliance?'Allied':pactRemaining(k)?'Non-aggression pact':truceRemaining(k)?'Truce':'Neutral'}
function isAllied(a,b){return a!==b&&(a===game.player||b===game.player)&&treaty(a===game.player?b:a).alliance}
function protectedPair(a,b){if(a===b)return true;if(a!==game.player&&b!==game.player)return false;const k=a===game.player?b:a;return isAllied(a,b)||pactRemaining(k)>0||truceRemaining(k)>0}
function atWar(a,b){if(a===b||protectedPair(a,b))return false;if(a!==game.player&&b!==game.player)return true;return treaty(a===game.player?b:a).war}
function canPass(a,b){return a===b||isAllied(a,b)||(a===game.player&&b!==game.player&&treaty(b).access)}
function dipTypeName(type){return ({alliance:'Military alliance',access:'Military access',trade:'Trade agreement',pact:'Non-aggression pact',peace:'Peace treaty'})[type]||type}
function beginRequest(k,type,term){
const t=treaty(k),now=currentMonth();
if(t.pending){toast('Wait for the existing negotiation');return}
if(now<t.cooldownUntil){toast('Envoys can return in '+(t.cooldownUntil-now)+' months');return}
if(type==='peace'?!t.war:t.war){toast('Proposal unavailable with this war status');return}
if(type==='pact'&&pactRemaining(k)){toast('A pact is already active');return}
if(type==='alliance'&&t.alliance||type==='access'&&(t.access||t.alliance)||type==='trade'&&t.trade){toast('Agreement is already in force');return}
const duration=type==='pact'?([12,24,36].includes(term)?term:12):0;
t.pending={type,duration,responseAt:now+1};
line('Envoys request '+dipTypeName(type).toLowerCase()+(duration?' for '+duration+' months':'')+' from '+FACTIONS[k].full+'.');
toast('Request sent. Response next month.');renderAll();
}
function acceptChance(k,type,duration){
const t=treaty(k),base={alliance:28,access:55,trade:70,pact:66,peace:58}[type]||35;
const affinity=(t.trust-50)*.6+(t.trade&&type==='alliance'?17:0)+(t.access&&type==='alliance'?8:0)+(t.alliance&&type==='trade'?12:0);
return Math.max(8,Math.min(94,base+affinity+(type==='pact'&&duration===36?-14:type==='pact'&&duration===24?-7:0)));
}
function ceaseHostilities(k){
for(const b of [...game.battles]){
const a=game.armies.find(x=>x.id===b.attackId),d=game.armies.find(x=>x.id===b.defendId);
if(a&&d&&[a.owner,d.owner].includes(game.player)&&[a.owner,d.owner].includes(k)){
a.battle=null;d.battle=null;game.battles=game.battles.filter(x=>x!==b)
}}
for(const a of game.armies){if(a.route?.length&&((a.owner===game.player&&owner(a.route[a.route.length-1])===k)||(a.owner===k&&owner(a.route[a.route.length-1])===game.player))){a.route=[];a.edgeTotal=0;a.edgeRemaining=0}}
}
function processTreatyTerms(){
const now=currentMonth();
for(const k of Object.keys(game.treaties||{})){
const t=treaty(k);
if(t.pactUntil&&now>=t.pactUntil){t.pactUntil=0;line('Non-aggression pact with '+FACTIONS[k].full+' expired.')}
if(t.truceUntil&&now>=t.truceUntil){t.truceUntil=0;line('Truce with '+FACTIONS[k].full+' expired.')}
const p=t.pending;if(!p||p.responseAt>now)continue;t.pending=null;
if(Math.random()*100>=acceptChance(k,p.type,p.duration)){t.trust=Math.max(0,t.trust-4);t.cooldownUntil=now+5;line(FACTIONS[k].full+' rejects '+dipTypeName(p.type).toLowerCase()+'. Envoys may return in five months.');continue}
t.trust=Math.min(100,t.trust+7);
if(p.type==='alliance'){t.alliance=true;t.access=true}
if(p.type==='access')t.access=true;
if(p.type==='trade')t.trade=true;
if(p.type==='pact')t.pactUntil=now+p.duration;
if(p.type==='peace'){t.war=false;game.diplomacy[k]='Neutral';t.truceUntil=now+6;ceaseHostilities(k)}
line(FACTIONS[k].full+' accepts '+dipTypeName(p.type).toLowerCase()+(p.type==='pact'?' for '+p.duration+' months':'')+'.');
}
}
function endAgreement(k,type){
const t=treaty(k);
if(type==='alliance'&&t.alliance){t.alliance=false;t.access=false;t.truceUntil=currentMonth()+6;t.trust=Math.max(0,t.trust-20);line('Alliance with '+FACTIONS[k].full+' ended. Six-month truce applies.')}
if(type==='trade'&&t.trade){t.trade=false;t.trust=Math.max(0,t.trust-4);line('Trade agreement with '+FACTIONS[k].full+' ended.')}
if(type==='access'&&t.access&&!t.alliance){
if(game.armies.some(a=>a.owner===game.player&&activeArmy(a)&&owner(a.at)===k)){toast('Withdraw your armies before cancelling military access');return}
t.access=false;line('Military access through '+FACTIONS[k].full+' cancelled.')}
renderAll();
}
function declareWar(k){
const t=treaty(k);if(t.war)return;
if(pactRemaining(k)){toast('Cannot attack: pact has '+pactRemaining(k)+' months remaining');return}
if(truceRemaining(k)){toast('Truce has '+truceRemaining(k)+' months remaining');return}
if(t.alliance){toast('End the alliance before declaring war');return}
if(!confirm('Declare war on '+FACTIONS[k].full+'? Trade and access agreements will end.'))return;
t.war=true;t.trade=false;t.access=false;t.pending=null;t.trust=Math.max(0,t.trust-35);
game.diplomacy[k]='War';line(FACTIONS[game.player].full+' declares war on '+FACTIONS[k].full+'.');renderAll();
}
function handleAction(e){
const b=e.target.closest('[data-act]');if(!b||!game)return;
const action=b.dataset.act,id=b.dataset.id,kind=b.dataset.kind;
if(action==='save'){save();toast('Campaign saved locally')}
if(action==='focusProvince'){focus(id);showPanel('map')}
if(action==='selectLocalArmy'){const a=friendlyAt(id);if(a){selectedArmy=a.id;showPanel('armies')}else toast('No available army stationed here')}
if(action==='inspectArmy'){selectedArmy=id;renderPanel()}
if(action==='focusArmy'){const a=mobileArmy(id);if(a){focus(a.at);showPanel('map')}}
if(action==='recruit')recruit(kind);
if(action==='build')build(kind);
if(action==='order'){orderArmy=id;showPanel('map');updateOrderBanner()}
if(action==='recall'){const a=mobileArmy(id);if(a?.route.length){a.route=[a.at];a.edgeRemaining=0;a.edgeTotal=0;a.battle=null;line('Army order recalled.');renderAll()}}
if(action==='force'){let a=mobileArmy(id);if(a){a.forced=!a.forced;line((a.forced?'Forced':'Normal')+' march for troops at '+byId[a.at].name);renderAll()}}
if(action==='retreat')retreat(id);
if(action==='relation'){if(relation(id)==='War'){game.diplomacy[id]='Neutral';line('Peace offered to '+FACTIONS[id].full+'.')}else{if(!confirm('Declare war on '+FACTIONS[id].full+'?'))return;game.diplomacy[id]='War';line('War declared on '+FACTIONS[id].full+'.')}renderAll()}
save();
}
function recruit(kind){
const p=prov(selectedProvince);if(p.owner!==game.player)return;const costs={inf:[40,12,8],cav:[55,10,5],art:[65,8,3]},c=costs[kind];if(!c)return;
if(game.resources.money[game.player]<c[0]||game.resources.manpower[game.player]<c[1]){toast('Not enough gold or manpower');return}
game.resources.money[game.player]-=c[0];game.resources.manpower[game.player]-=c[1];
let a=friendlyAt(p.id);if(!a){a={id:'a'+(++game.nextId),owner:game.player,at:p.id,units:{inf:0,cav:0,art:0},morale:100,route:[],edgeRemaining:0,edgeTotal:0,forced:false,battle:null,origin:null};game.armies.push(a)}
a.units[kind]+=c[2];line(c[2]+' '+({inf:'infantry',cav:'cavalry',art:'artillery'}[kind])+' recruited in '+byId[p.id].name);renderAll();
}
function build(kind){
const p=prov(selectedProvince);if(p.owner!==game.player)return;const cost={fort:65,farm:45,market:55}[kind];if(cost===undefined)return;if(p[kind]>=3){toast('Maximum building level reached');return}
if(game.resources.money[game.player]<cost){toast('Insufficient gold');return}game.resources.money[game.player]-=cost;p[kind]++;line(byId[p.id].name+': '+kind+' improved to level '+p[kind]);renderAll();
}
function neighbors(from,to){const queue=[[from]],visited=new Set([from]);while(queue.length){const path=queue.shift(),last=path[path.length-1];if(last===to)return path.slice(1);for(const next of connected[last]||[]){if(visited.has(next))continue;if(owner(next)!==game.player&&next!==to)continue;visited.add(next);queue.push(path.concat(next))}}return null}
function dispatch(a,to){
if(!a||!activeArmy(a)||a.owner!==game.player)return;
if(a.at===to){toast('Army is already at this province');return}
if(a.battle){toast('Retreat before issuing another order');return}
const enemy=owner(to)!==game.player;
if(enemy&&relation(owner(to))!=='War'){toast('Declare war in Diplomacy before attacking');showPanel('diplomacy');return}
const route=neighbors(a.at,to);if(!route){toast('No route through friendly provinces. Attack adjacent territory first.');return}
a.route=route;a.origin=a.at;a.edgeRemaining=0;a.edgeTotal=0;orderArmy=null;line('Orders issued: '+byId[a.at].name+' → '+byId[to].name+'.');updateOrderBanner();renderAll();toast('March orders issued');
}
function updateOrderBanner(){const a=mobileArmy(orderArmy);$('orderBanner').classList.toggle('show',!!a);if(a)$('orderText').textContent='Select a destination for '+total(a)+' troops · '+byId[a.at].name}
function retreat(id){const a=mobileArmy(id);if(!a||!a.battle)return;const battle=game.battles.find(b=>b.attackId===id||b.defendId===id);if(!battle)return;
const out=a.origin&&owner(a.origin)===game.player?a.origin:(connected[a.at]||[]).find(p=>owner(p)===game.player);
if(!out){toast('No friendly retreat route');return}a.battle=null;a.route=[out];a.edgeRemaining=0;a.edgeTotal=0;a.morale=Math.max(20,a.morale-15);game.battles=game.battles.filter(b=>b!==battle);const other=mobileArmy(battle.attackId===id?battle.defendId:battle.attackId);if(other)other.battle=null;line('Retreat ordered from '+byId[a.at].name);renderAll();
}
function edgeDuration(a,next){const base=Math.hypot(byId[a.at].x-byId[next].x,byId[a.at].y-byId[next].y);return Math.max(1,Math.ceil(base/(a.forced?205:145)))}
function arrival(a,to){
a.at=to;a.edgeRemaining=0;a.edgeTotal=0;a.route.shift();
if(owner(to)!==a.owner){a.route=[];startBattle(a,to)}
}
function startBattle(a,to){
let defender=at(to).filter(q=>q.owner===owner(to)&&q.id!==a.id&&q.battle===null).sort((x,y)=>total(y)-total(x))[0];
if(!defender){prov(to).owner=a.owner;line(FACTIONS[a.owner].name+' takes '+byId[to].name+' without resistance.');return}
if(game.battles.some(b=>b.province===to)){a.battle='support';return}
a.battle=to;defender.battle=to;game.battles.push({province:to,attackId:a.id,defendId:defender.id,months:0});line('Battle begins in '+byId[to].name+' between '+FACTIONS[a.owner].name+' and '+FACTIONS[defender.owner].name+'.');
}
function losses(a,amount){let n=Math.min(total(a),Math.max(1,Math.round(amount)));for(const key of ['inf','cav','art']){const kill=Math.min(a.units[key],n);a.units[key]-=kill;n-=kill;if(!n)break}}
function resolveBattles(){
for(const b of [...game.battles]){
const atk=mobileArmy(b.attackId),def=mobileArmy(b.defendId);if(!atk||!def){finishBattle(b,atk&&total(atk)>0);continue}
b.months++;const terrain=TERRAIN[byId[b.province].terrain][1];const fort=prov(b.province).fort;const atkPower=total(atk)*(atk.morale/100)*(FACTIONS[atk.owner].atk||1);
const defPower=total(def)*(def.morale/100)*(FACTIONS[def.owner].def||1)*terrain*(1+fort*.25);
const atkLoss=Math.max(1,Math.ceil(defPower*.13)),defLoss=Math.max(1,Math.ceil(atkPower*.13));
losses(atk,atkLoss);losses(def,defLoss);atk.morale=Math.max(20,atk.morale-5);def.morale=Math.max(20,def.morale-5);
if(b.months>=2&&(total(atk)===0||total(def)===0||b.months>=8))finishBattle(b,total(atk)>total(def));
}
}
function finishBattle(b,attackerWins){
const atk=game.armies.find(a=>a.id===b.attackId),def=game.armies.find(a=>a.id===b.defendId);
if(attackerWins&&atk&&total(atk)>0){prov(b.province).owner=atk.owner;line(FACTIONS[atk.owner].name+' wins '+byId[b.province].name+' after '+b.months+' months of battle.');if(def)def.units={inf:0,cav:0,art:0}}
else{line('Defenders hold '+byId[b.province].name+' after '+b.months+' months of battle.');if(atk)atk.units={inf:0,cav:0,art:0}}
if(atk)atk.battle=null;if(def)def.battle=null;game.battles=game.battles.filter(x=>x!==b);
}
function advanceMonth(silent){
if(game.ended)return;
game.month++;if(game.month===12){game.month=0;game.year++}
if(game.year>=1880){game.ended=true;line('The Century of Empires ends. '+FACTIONS[game.player].full+' holds '+game.provinces.filter(p=>p.owner===game.player).length+' provinces.');return}
for(const k of Object.keys(FACTIONS)){const lands=game.provinces.filter(p=>p.owner===k);game.resources.money[k]=Math.min(99999,game.resources.money[k]+Math.max(0,lands.reduce((n,p)=>n+8+p.market*5,0)-game.armies.filter(a=>a.owner===k).reduce((n,a)=>n+Math.ceil(total(a)/10),0)));game.resources.manpower[k]=Math.min(9999,game.resources.manpower[k]+lands.reduce((n,p)=>n+2+p.farm*2,0))}
resolveBattles();
for(const a of game.armies){if(!activeArmy(a)||a.battle||!a.route.length)continue;if(a.edgeRemaining<=0){a.edgeTotal=edgeDuration(a,a.route[0]);a.edgeRemaining=a.edgeTotal}a.edgeRemaining--;if(a.edgeRemaining<=0)arrival(a,a.route[0]);if(a.forced){a.morale=Math.max(40,a.morale-3)}else{a.morale=Math.min(100,a.morale+1)}}
if(game.month%3===0){runAI();if(game.caretaker)runCaretaker();}
if(!silent&&game.month===0)line('The year '+game.year+' begins. A new era for Europe.');
}
function runAI(){
for(const k of Object.keys(FACTIONS)){if(k===game.player)continue;
const armies=game.armies.filter(a=>a.owner===k&&activeArmy(a)&&!a.route.length&&!a.battle);if(!armies.length)continue;
if(game.resources.money[k]>90&&game.resources.manpower[k]>15){const a=armies[Math.floor(Math.random()*armies.length)];a.units.inf+=3;game.resources.money[k]-=35;game.resources.manpower[k]-=10}
if(Math.random()<.22){const candidate=armies.filter(a=>(connected[a.at]||[]).some(id=>owner(id)!==k&&total(a)>at(id).filter(o=>o.owner===owner(id)).reduce((n,o)=>n+total(o),0)*1.5+4)).sort((a,b)=>total(b)-total(a))[0];
if(candidate){const targets=(connected[candidate.at]||[]).filter(id=>owner(id)!==k&&total(candidate)>at(id).filter(o=>o.owner===owner(id)).reduce((n,o)=>n+total(o),0)*1.5+4);
if(targets.length){const to=targets[Math.floor(Math.random()*targets.length)];candidate.origin=candidate.at;candidate.route=[to];candidate.edgeTotal=0;candidate.edgeRemaining=0;line(FACTIONS[k].name+' launches a campaign toward '+byId[to].name+'.')}}}
}}
function runCaretaker(){
const k=game.player;if(game.resources.money[k]<45||game.resources.manpower[k]<10)return;
const threatened=game.provinces.filter(p=>p.owner===k&&(connected[p.id]||[]).some(id=>owner(id)!==k&&at(id).some(a=>a.owner!==k&&total(a)>7)));
if(!threatened.length)return;
const place=threatened.sort((a,b)=>at(a.id).filter(x=>x.owner===k).reduce((n,x)=>n+total(x),0)-at(b.id).filter(x=>x.owner===k).reduce((n,x)=>n+total(x),0))[0];
let army=at(place.id).find(a=>a.owner===k&&!a.route.length&&!a.battle);
if(!army){army={id:'a'+(++game.nextId),owner:k,at:place.id,units:{inf:0,cav:0,art:0},morale:100,route:[],edgeRemaining:0,edgeTotal:0,forced:false,battle:null,origin:null};game.armies.push(army)}
army.units.inf+=5;game.resources.money[k]-=40;game.resources.manpower[k]-=10;line('Defensive caretaker reinforces '+byId[place.id].name+' during your absence.');
}
function catchUp(){
if(!game)return;const age=Math.max(0,Date.now()-game.lastTick);const elapsed=Math.min(36,Math.floor(age/MONTH_MS));for(let i=0;i<elapsed;i++)advanceMonth(true);game.lastTick=Date.now()-(age%MONTH_MS);
}
function tick(){
if(!game||game.ended)return;
if(Date.now()-game.lastTick>36*MONTH_MS){game.caretaker=Date.now()-game.lastSeen>=72*3600e3;catchUp();game.caretaker=false;renderAll();save();return}
let n=0;while(Date.now()-game.lastTick>=MONTH_MS&&n<4){game.lastTick+=MONTH_MS;advanceMonth(false);n++}
if(n){renderAll();save()}
if(Date.now()-lastDraw>110){updateArmyMarkers();lastDraw=Date.now()}
}
function pct(){return game?Math.max(0,Math.min(1,(Date.now()-game.lastTick)/MONTH_MS)):0}
function setView(){
const w=Math.max(330,Math.min(1420,view.w)),h=w*875/1420;
view.w=w;view.cx=Math.max(w/2,Math.min(1420-w/2,view.cx));view.cy=Math.max(h/2,Math.min(875-h/2,view.cy));
$('map').setAttribute('viewBox',[view.cx-w/2,view.cy-h/2,w,h].map(n=>n.toFixed(2)).join(' '));
}
function zoom(f){view.w*=f;setView()}
function focus(id){const b=byId[id];if(b){view.cx=b.x;view.cy=b.y;view.w=Math.min(view.w,850);setView()}}
function down(e){
if(e.pointerType==='mouse'&&e.button!==0)return;
e.currentTarget.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pointers.size===1)gesture={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy,w:view.w,dragged:false};
else if(pointers.size===2){const pp=[...pointers.values()];gesture={distance:Math.hypot(pp[0].x-pp[1].x,pp[0].y-pp[1].y),w:view.w,cx:view.cx,cy:view.cy,dragged:true};suppressUntil=Date.now()+500}
}
function move(e){
if(!pointers.has(e.pointerId))return;
pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
const pp=[...pointers.values()],r=$('map').getBoundingClientRect();if(!gesture)return;
if(pp.length===2){const d=Math.hypot(pp[0].x-pp[1].x,pp[0].y-pp[1].y);view.w=gesture.w*gesture.distance/Math.max(10,d);view.cx=gesture.cx;view.cy=gesture.cy;setView();return}
if(pp.length===1&&gesture.x!==undefined){const scale=Math.max(r.width/view.w,r.height/(view.w*875/1420));const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>5){gesture.dragged=true;suppressUntil=Date.now()+350;$('map').classList.add('dragging')}view.cx=gesture.cx-dx/scale;view.cy=gesture.cy-dy/scale;setView()}
}
function up(e){pointers.delete(e.pointerId);$('map').classList.remove('dragging');if(!pointers.size)gesture=null;else{let p=[...pointers.values()][0];gesture={x:p.x,y:p.y,cx:view.cx,cy:view.cy,w:view.w,dragged:false}}}
function mapClick(e){
if(!game||Date.now()<suppressUntil)return;
const armyEl=e.target.closest('[data-army]');const region=e.target.closest('[data-zone]');const id=armyEl?.getAttribute('data-army'),pid=region?.getAttribute('data-zone');
if(id){const a=mobileArmy(id);if(a&&a.owner===game.player){selectedArmy=a.id;selectedProvince=a.at;renderAll();showPanel('armies')}else if(a){selectedProvince=a.at;renderAll();showPanel('province')}return}
if(!pid)return;
if(orderArmy){dispatch(mobileArmy(orderArmy),pid);return}
selectedProvince=pid;selectedArmy=null;renderAll();showPanel('province');
}
function renderAll(){
if(!game)return;
$('dateVal').textContent=when();$('goldVal').textContent=fmt(game.resources.money[game.player]);$('mpVal').textContent=fmt(game.resources.manpower[game.player]);$('armyVal').textContent=mine().length;
for(const p of game.provinces){const path=document.querySelector('#territories [data-zone="'+p.id+'"]');if(path){path.style.setProperty('--nation',colors[p.owner]);path.classList.toggle('selected',p.id===selectedProvince)}}
renderRoads();renderArmies();if(panel!=='map')renderPanel();updateOrderBanner();
}
function renderRoads(){
const roads=$('roads');if(roads.childNodes.length)return;
const frag=document.createDocumentFragment();for(const [x,y] of LINKS){const a=byId[x],b=byId[y];if(!a||!b)continue;const sea=Math.hypot(a.x-b.x,a.y-b.y)>190;
frag.appendChild(node('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:sea?'#284957':'#3e3a32','stroke-width':sea?0.55:0.85,'stroke-opacity':sea?.35:.54,'stroke-dasharray':sea?'3 7':''}))}
roads.replaceChildren(frag);
}
function renderArmies(){
$('provinces').replaceChildren();
const labels=node('g',{'pointer-events':'none'}),figures=node('g');
for(const b of bases){
const p=prov(b.id);const g=node('g');
g.appendChild(node('circle',{cx:b.x,cy:b.y,r:p.fort?4.6:2.3,fill:'#151f22',stroke:'#f2ead9','stroke-width':.7}));
const t=node('text',{x:b.x+6,y:b.y-6,fill:'#252522','font-size':9.5,'font-weight':600,'paint-order':'stroke',stroke:'#efe4ca','stroke-width':2.5,'stroke-linejoin':'round'});
t.textContent=b.name;g.appendChild(t);
if(p.fort){const mark=node('path',{d:'M'+(b.x-4)+' '+(b.y-6)+' h8 v-4 l-2 -3 h-4 l-2 3 z',fill:'#34332c',stroke:'#eee4c8','stroke-width':.75});g.appendChild(mark)}
labels.appendChild(g);
const flag=node('g',{transform:'translate('+(b.x+4)+' '+(b.y+5)+')'});flag.appendChild(node('path',{d:'M0 0V-17',stroke:'#222728','stroke-width':1.3}));flag.appendChild(node('use',{href:'#flag-'+p.owner,x:0,y:-17,width:17,height:11}));labels.appendChild(flag);
}
$('provinces').appendChild(labels);
for(const a of game.armies.filter(activeArmy)){
const pos=positionOf(a);
const g=node('g',{'data-army':a.id,class:'army-token',transform:'translate('+pos.x+' '+pos.y+')'});
const mineColor=a.owner===game.player;g.appendChild(node('circle',{cx:0,cy:0,r:16,fill:'#101f25','fill-opacity':.01,'pointer-events':'all'}));
g.appendChild(node('path',{d:'M-4 5 L-3 -4 L0 -7 L3 -4 L4 5 M-5 0H5 M-3 5L-6 10 M3 5L6 10',fill:'none',stroke:'#222527','stroke-width':3.2,'stroke-linecap':'round'}));
g.appendChild(node('circle',{cx:0,cy:-10,r:3,fill:'#373930',stroke:'#e2d8bd','stroke-width':.8}));
g.appendChild(node('rect',{x:-10.5,y:-25,width:21,height:11,rx:5.5,fill:mineColor?'#34473d':'#2d3540',stroke:mineColor?'#e0c58a':'#d5d2bf','stroke-width':.8}));
const t=node('text',{x:0,y:-17,'text-anchor':'middle','font-size':8.6,'font-weight':700,fill:'#fff0cd'});t.textContent=total(a);g.appendChild(t);
g.appendChild(node('rect',{x:-11,y:11,width:22,height:2.4,rx:1.2,fill:'#2a2826'}));
g.appendChild(node('rect',{x:-11,y:11,width:22*a.morale/100,height:2.4,rx:1.2,fill:a.morale<50?'#d27d68':'#79b293'}));
if(a.battle){g.appendChild(node('circle',{cx:11,cy:-3,r:5.3,fill:'#aa4a43',stroke:'#ffcca9','stroke-width':.7}));const sword=node('text',{x:11,y:-1,'text-anchor':'middle','font-size':7,fill:'#fff'});sword.textContent='⚔';g.appendChild(sword)}
figures.appendChild(g);
}
$('provinces').appendChild(figures);
drawRoutes();
}
function positionOf(a){
const b=byId[a.at];if(!b)return{x:0,y:0};if(a.route.length&&a.edgeTotal>0){const next=byId[a.route[0]];const progress=Math.max(0,Math.min(1,1-(a.edgeRemaining-pct())/a.edgeTotal));if(next)return{x:b.x+(next.x-b.x)*progress,y:b.y+(next.y-b.y)*progress}}
return{x:b.x,y:b.y};
}
function updateArmyMarkers(){
if(!game)return;
for(const el of document.querySelectorAll('.army-token')){const a=mobileArmy(el.getAttribute('data-army'));if(a){const p=positionOf(a);el.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+')')}}
}
function drawRoutes(){
const routes=$('routes');routes.replaceChildren();
for(const a of game.armies.filter(a=>a.route.length&&activeArmy(a))){const p=positionOf(a);let x=p.x,y=p.y;for(const id of a.route){const q=byId[id];if(!q)continue;routes.appendChild(node('line',{x1:x,y1:y,x2:q.x,y2:q.y,stroke:a.owner===game.player?'#a95240':'#6a6964','stroke-width':a.owner===game.player?1.2:.75,'stroke-dasharray':a.owner===game.player?'6 4':'4 5','stroke-opacity':a.owner===game.player?.95:.4}));x=q.x;y=q.y}if(a.owner===game.player){const q=byId[a.route[0]];if(q){const angle=Math.atan2(q.y-p.y,q.x-p.x),tx=q.x-Math.cos(angle)*6,ty=q.y-Math.sin(angle)*6;routes.appendChild(node('path',{d:'M'+tx+' '+ty+' l'+(-6*Math.cos(angle-.6))+' '+(-6*Math.sin(angle-.6))+' m'+(6*Math.cos(angle-.6))+' '+(6*Math.sin(angle-.6))+' l'+(-6*Math.cos(angle+.6))+' '+(-6*Math.sin(angle+.6)),stroke:'#a95240','stroke-width':1.2,fill:'none'}))}}}
}
boot();
})();

</script></body></html>
