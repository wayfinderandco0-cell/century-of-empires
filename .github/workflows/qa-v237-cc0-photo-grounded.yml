name: V237 Distinct CC0 Photo-Grounded Alpine Candidate (PRODUCTION RED)
on:
  push:
    branches: ['terrain-v237-cc0-photo-ground-candidate-20261027']
  workflow_dispatch:
concurrency:
  group: v237-cc0-grounded
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cc0-photo-ground-and-conditional-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and four-browser review dependencies
        run: |
          python -m pip install pillow numpy opencv-python-headless requests playwright
          python -m playwright install --with-deps chromium webkit
      - name: Verify source and graph invariants plus synthetic positive/negative controls
        run: |
          python -m py_compile scripts/v237_build_photo_grounded.py scripts/test_v237_photo_grounded.py
          python scripts/test_v237_photo_grounded.py
          node scripts/test_v236_authored_alpine.js
      - name: Download SHA1-pinned distinct CC0 sources and generate source-native image evidence
        run: python scripts/v237_build_photo_grounded.py
      - name: Necessary original-pixel road ground gates (do not equate with acceptance)
        id: ground
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open('qa/v237-photo-grounded/report.json'))
          passed=r['bothNecessaryGroundGatesPass']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('pass='+str(passed).lower()+'\n')
          print('Source-ground gate:',passed,'PRODUCTION: RED')
          PY
      - name: Four Chromium/WebKit phone layouts ONLY if both source-ground gates pass
        if: steps.ground.outputs.pass == 'true'
        run: python scripts/qa_v237_photo_grounded.py
      - name: Unchanged strict V203 photographic microstructure (diagnostic only)
        if: steps.ground.outputs.pass == 'true'
        continue-on-error: true
        run: python scripts/qa_v203_canopy_structure.py --screenshots qa/v237-authored-alpine --output qa/v237-strict-v203 --enforce
      - name: Publish source-photo diagnostics and conditional actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v237-cc0-photo-source-and-mobile-UNAPPROVED
          path: |
            qa/v237-photo-grounded/
            qa/v237-authored-alpine/
            qa/v237-strict-v203/
            terrain-v237/generated/*.webp
            v237-photo-grounded-playtest.html
          retention-days: 14
      - name: Production remains RED until geographic registration, bridge banks, V203 and user approval
        if: always()
        run: |
          echo "Photographic source and license do not establish historic 1780 roads."
          echo "Original V209 tiepoints, banks, visual quality and user acceptance unverified."
          exit 1
