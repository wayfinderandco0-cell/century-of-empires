function badge(s){const cls=s==='Paid'||s==='Active'||s==='Present'?'green':s==='Open'||s==='Trial'?'amber':s==='Absent'?'red':'blue';return `<span class="pill ${cls}">${esc(s)}</span>`}

const NAV={owner:[['overview','grid','Overview'],['students','users','Students'],['classes','calendar','Classes'],['attendance','check','Attendance'],['billing','credit','Billing'],['messages','mail','Messages'],['insights','chart','Insights'],['settings','gear','Settings']],instructor:[['today','calendar','My classes'],['roll','check','Attendance'],['roster','users','Student roster']],parent:[['family','home','Family home'],['schedule','calendar','Class schedule'],['payments','credit','Tuition'],['updates','bell','Studio updates']]};
const MOBILE={owner:['overview','students','classes','billing'],instructor:['today','roll','roster'],parent:['family','schedule','payments','updates']};
function pageTitle(){return NAV[role]?.find(([key])=>key===route)?.[2]||'Overview';}
function layout(){const nav=NAV[role]||NAV.owner;return `<div class="platform"><aside class="sidebar">${brand()}<div class="side-category">${role==='owner'?'Studio management':role==='parent'?'Family portal':'Instructor workspace'}</div><nav aria-label="Workspace navigation">${nav.map(([id,ic,title])=>`<button type="button" class="side-item ${route===id?'active':''}" data-route="${id}">${icon(ic)} ${title}</button>`).join('')}</nav><div class="side-bottom"><button class="side-item" data-action="marketing">${icon('home')} Public website</button><button class="side-item" data-action="reset">${icon('rotate')} Reset demo data</button><div class="side-footer">Independent V1 preview<br/>No production connectivity</div></div></aside><div class="workspace"><header class="workspace-top"><div><div class="crumbs">Dance Manager Next / ${esc(role)} </div><div class="crumbs"><b>${esc(pageTitle())}</b></div></div><div class="top-actions"><select class="role-switch" id="role-select" aria-label="Switch demonstration role"><option value="owner" ${role==='owner'?'selected':''}>Studio owner</option><option value="instructor" ${role==='instructor'?'selected':''}>Instructor</option><option value="parent" ${role==='parent'?'selected':''}>Parent</option><option value="marketing">Public website</option></select><span class="avatar">DM</span></div></header><main class="main">${content()}${metaNote()}</main></div><nav class="mobile-tabs" aria-label="Mobile navigation">${nav.filter(([id])=>MOBILE[role].includes(id)).map(([id,ic,title])=>`<button class="mobile-tab ${route===id?'active':''}" data-route="${id}">${icon(ic)}<span>${title}</span></button>`).join('')}${role==='owner'?`<button type="button" class="mobile-tab" data-action="mobile-more">${icon('menu')}<span>More</span></button>`:''}</nav></div>`}
function head(title,desc,action){return `<div class="page-title-row"><div><h1>${title}</h1><p>${desc}</p></div>${action||''}</div>`}
function stat(title,value,ic,desc){return `<div class="stat-card"><div class="stat-line"><span>${title}</span><span class="stat-icon">${icon(ic)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${desc}</div></div>`}
function panel(title,subtitle,body,action=''){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div><div class="panel-body">${body}</div></section>`}
function classRow(c){return `<div class="class-row"><div class="time-chip">${esc(to12(c.start))}<br><span style="font-weight:500">${esc(c.day.slice(0,3))}</span></div><div class="class-info"><strong>${esc(c.name)}</strong><small>${esc(c.instructor)} · ${esc(c.room)}</small></div><div class="class-count">${classEnrollCount(c)}/${esc(c.capacity)}</div></div>`}
function to12(t){const [h,m]=(t||'16:00').split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function ownerOverview(){const s=summary();return `${head('Good afternoon, Studio Team','Here’s what’s happening across your fictional studio today.',button(`${icon('plus')} Add student`,'add-student'))}<div class="stats-grid">${stat('Active students',s.active, 'users','Current sample roster')}${stat('Scheduled classes',db.classes.length,'calendar','Weekly classes')}${stat('Collected invoices',USD(s.paid),'credit','Fictional transactions')}${stat('Open balances',USD(s.open),'dollar','Not real receivables')}</div><div class="dashboard-grid"><div style="display:grid;gap:18px">${panel('Weekly class schedule','Your recurring class lineup',db.classes.slice(0,5).map(classRow).join(''),button('All classes '+icon('arrow'),'show-classes','btn-quiet btn-small'))}${panel('Tuition summary','Sample billing data',`<div class="revenue-chart">${[42,54,50,66,78,70,90].map((n,i)=>`<div class="revenue-month"><span class="bar" style="height:${n}%"></span><small>${['Apr','May','Jun','Jul','Aug','Sep','Oct'][i]}</small></div>`).join('')}</div><p class="fineprint" style="margin-top:23px">Illustrative chart only; not connected to any studio financials.</p>`)}</div><div style="display:grid;align-content:start;gap:18px">${panel('Quick actions','Common tasks',`<div class="quick-links"><button class="quick-link" data-action="add-student">${icon('plus')} New student</button><button class="quick-link" data-action="add-class">${icon('calendar')} Add class</button><button class="quick-link" data-action="add-invoice">${icon('credit')} New invoice</button></div>`)}${panel('Recent activity','Local demo actions',`<ul class="activity-list">${db.activity.map(a=>`<li><span class="activity-dot"></span><div><b>${esc(a.text)}</b><small>${esc(a.stamp)}</small></div></li>`).join('')}</ul>`)}${panel('Important reminder','This is a concept only',`<div class="highlight">${icon('info')} Role switching is a preview, not secure login. No information goes to the live Dance Manager system.</div>`)}</div></div>`}
function students(){return `${head('Students & families','Manage fictional student records and enrollment status.',button(`${icon('plus')} Add student`,'add-student'))}<section class="panel"><div class="table-controls"><label class="search-wrap">${icon('search')}<input id="student-search" aria-label="Search students" placeholder="Search students or guardians" autocomplete="off"/></label><span class="pill blue" id="student-count">${db.students.length} students</span></div><div class="scroll-x"><table><thead><tr><th>Student</th><th>Level</th><th>Guardian</th><th>Status</th><th>Age</th></tr></thead><tbody id="student-list">${db.students.map((s,i)=>`<tr data-student-search="${esc((s.name+' '+s.guardian+' '+s.level).toLowerCase())}"><td><div class="student-profile"><span class="student-avatar v${i%4+1}">${esc(initials(s.name))}</span><div><strong>${esc(s.name)}</strong><div class="fineprint">#${esc(s.id)}</div></div></div></td><td>${esc(s.level)}</td><td>${esc(s.guardian)}</td><td>${badge(s.status)}</td><td>${esc(s.age)}</td></tr>`).join('')}</tbody></table></div></section>`}

function attendance(){const id=db.classes[0]?.id;return `${head('Attendance','Mark fictional students present or absent; changes save locally.',button('Switch to instructor view','instructor','btn-outline'))}<div class="split-2">${panel('Choose a class','Select a class to review attendance.',`<div class="form-field"><label class="label" for="attendance-class">Class</label><select id="attendance-class">${db.classes.map(c=>`<option value="${esc(c.id)}" ${c.id===id?'selected':''}>${esc(c.name)} · ${esc(c.day)}</option>`).join('')}</select></div><div id="attendance-block">${attendanceBody(id)}</div>`)}${panel('How attendance works','A quick instructor workflow',`<div class="highlight">${icon('info')} Choose a class, then tap Present or Absent. This demo only changes local example records.</div><p class="small muted">A production version would also need historical records, absence notifications, permissions, and audit logging.</p>`)}</div>`}
function attendanceBody(id){const c=db.classes.find(c=>c.id===id);if(!c)return '<div class="empty">No class selected.</div>';if(!c.enrolled.length)return '<div class="empty">No enrolled students in this sample class.</div>';return `<div class="attendance-list">${c.enrolled.map((s,i)=>{const st=db.students.find(x=>x.id===s);if(!st)return '';const status=db.attendance[id]?.[s]||'';return `<div class="attendance-person"><div class="student-profile"><span class="student-avatar v${i%4+1}">${esc(initials(st.name))}</span><strong>${esc(st.name)}</strong></div><div class="attendance-buttons"><button data-action="mark:${id}:${s}:present" class="${status==='present'?'present':''}" aria-label="Mark ${esc(st.name)} present">✓</button><button data-action="mark:${id}:${s}:absent" class="${status==='absent'?'absent':''}" aria-label="Mark ${esc(st.name)} absent">✕</button></div></div>`}).join('')}</div><div class="fineprint">${esc(c.name)} · ${classEnrollCount(c)} enrolled. Attendance saved in this browser only.</div>`}

function parentPayments(){const invoices=db.invoices.filter(i=>i.studentId==='s1');return `${head('Tuition & payments','Your fictional family balance.')}${panel('Family invoices','No real money can be paid from this demo.',invoices.map(i=>`<div class="enroll-card"><div><strong>${esc(i.label)}</strong><div class="note">Due ${prettyDate(i.due)} · ${esc(i.id)}</div></div><div style="text-align:right"><strong>${USD(i.amount)}</strong><div style="margin:5px 0">${badge(i.status)}</div></div></div>`).join('')+`<div class="safe-notice">This preview has no payment processor. The “Pay” functionality will be developed only after secure integration and approval.</div>`)}`}
function parentUpdates(){return `${head('Studio announcements','Updates from the fictional dance studio.')}${panel('Latest news','Preview only',db.announcements.map(a=>`<div class="message-entry">${icon('bell')}<div><strong>${esc(a.title)}</strong> <span class="pill blue">${esc(a.kind)}</span><p>${esc(a.body)}</p><span class="fineprint">${esc(a.date)}</span></div></div>`).join(''))}`}
function content(){if(role==='owner')return ({overview:ownerOverview,students,classes,attendance,billing,messages,insights,settings}[route]||ownerOverview)();if(role==='instructor')return ({today:instructorToday,roll:attendance,roster:instructorRoster}[route]||instructorToday)();return ({family,parent:family,schedule:parentSchedule,payments:parentPayments,updates:parentUpdates}[route]||family)()}
function demoBanner(){return `<div class="demo-banner">${icon('shield')} PRIVATE INDEPENDENT PROTOTYPE · Fictional data · Original Dance Manager website untouched</div>`}
function render(){document.querySelector('#app').innerHTML=demoBanner()+(role==='marketing'?marketing():layout())+`<button class="chat-trigger" data-action="chat-toggle">${icon('chat')} ${chatOpen?'Close assistant':'Ask a question'}</button>`+(chatOpen?chatPanel():'');renderModal();}
function navigate(r,p){role=r;route=p||({marketing:'home',owner:'overview',instructor:'today',parent:'family'}[r]);mobileMenu=false;chatOpen=false;modal='';render();window.scrollTo({top:0,behavior:'instant'});}
function toast(msg){const root=document.querySelector('#toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>{if(root)root.innerHTML='';},3200)}
function modalForm(title,body,kind){modal={title,body,kind};renderModal();}
function renderModal(){const root=document.querySelector('#modal-root');if(!modal){root.innerHTML='';return;}root.innerHTML=`<div class="modal-scrim" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${esc(modal.title)}</h2><button type="button" class="icon-button" aria-label="Close dialog" data-action="close-modal">${icon('x')}</button></div><div class="modal-body">${modal.body}</div></section></div>`;}
const field=(id,label,placeholder='',type='text',req='required',value='')=>`<div class="form-field"><label class="label" for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" ${req} placeholder="${esc(placeholder)}" value="${esc(value)}" /></div>`;
const footer=(submit='Save example')=>`<div class="modal-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${submit}</button></div>`;
function openStudent(){modalForm('Add a fictional student',`<div class="safe-notice">Use sample details only. This is not a secure storage system.</div><form id="student-form"><div class="form-grid">${field('student-name','Student name','e.g. Demo Student')}${field('student-age','Age','9','number','required min="2" max="99"')}</div><div class="form-grid">${field('student-guardian','Guardian name','e.g. Demo Guardian')}${field('student-level','Dance level','e.g. Ballet I')}</div>${footer('Add to demo roster')}</form>`,'student');}

function openInvoice(){modalForm('Create a fictional invoice',`<div class="safe-notice">A real payment cannot be collected in this prototype.</div><form id="invoice-form"><div class="form-field"><label class="label" for="invoice-student">Student</label><select id="invoice-student" name="invoice-student">${db.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div><div class="form-grid">${field('invoice-amount','Amount (USD)','95','number','required min="1" max="100000"')}${field('invoice-due','Due date','','date','required','2026-10-31')}</div>${field('invoice-label','Description','November tuition')}${footer('Save demo invoice')}</form>`,'invoice');}
function openMessage(){modalForm('Compose a studio announcement',`<div class="safe-notice">This only adds an announcement to the local demo; it does not send a message.</div><form id="message-form">${field('message-title','Announcement title','e.g. Saturday rehearsal')}<div class="form-field"><label class="label" for="message-body">Message</label><textarea id="message-body" name="message-body" required maxlength="1000" placeholder="Write a studio announcement..."></textarea></div>${footer('Save mock announcement')}</form>`,'message');}
function openRoster(id){const c=db.classes.find(c=>c.id===id);if(!c)return;modalForm(`${c.name} — roster`,`<p class="small muted">${esc(c.day)} · ${esc(to12(c.start))} · ${esc(c.instructor)} · ${esc(c.room)}</p><div style="margin:15px 0">${c.enrolled.length?c.enrolled.map((sid,i)=>`<div class="class-row"><span class="student-avatar v${i%4+1}">${esc(initials(studentName(sid)))}</span><div class="class-info"><strong>${esc(studentName(sid))}</strong></div></div>`).join(''):'<div class="empty">No students currently assigned.</div>'}</div><div class="safe-notice">All rosters contain fictional students. Editing enrollment will come in a later version.</div><div class="modal-footer">${button('Close','close-modal','btn-outline')}</div>`,'roster')}
function chatPanel(){return `<section class="chat-pane" aria-label="Demo help chat"><header class="chat-head"><div><b>Dance Manager Assistant</b><small>Scripted demo · Not live AI</small></div><button class="icon-button" data-action="chat-toggle" aria-label="Close chat" style="background:#ffffff20;color:white;border:0">${icon('x')}</button></header><div class="chat-messages" id="chat-messages">${chatMessages.map(m=>`<div class="bubble ${m.from==='you'?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="chat-quick">${['Features','Parent portal','Pricing','Mobile app'].map(q=>`<button type="button" data-chat-quick="${esc(q)}">${q}</button>`).join('')}</div><form id="chat-form" class="chat-input"><label class="screen-reader" for="chat-question">Ask a question</label><input id="chat-question" name="question" placeholder="Ask about Dance Manager..." maxlength="240" required autocomplete="off"/><button type="submit" aria-label="Send question">${icon('arrow')}</button></form></section>`}
function chatReply(q){const s=q.toLowerCase();if(/cost|price|pricing|fee|month|trial/.test(s))return 'Official pricing and fees must be confirmed by the product owner. This independent V1 prototype intentionally does not publish an unverified plan or price.';if(/parent|family|guardian|portal|register/.test(s))return 'The intended family experience includes classes, invoices, updates, and enrollment requests. Switch to the Parent view to try fictional workflows.';if(/app|iphone|android|phone|mobile|install/.test(s))return 'This is a mobile-friendly progressive web app prototype. Once hosted on a separate HTTPS site, it can be added to a phone home screen. Native app-store releases remain future work.';if(/bill|payment|tuition|invoice|credit/.test(s))return 'The prototype lets studio owners create fictional invoices and mark them paid as a simulation. No charges, cards, or real payments are processed.';if(/class|attendance|teacher|instructor|schedule/.test(s))return 'You can browse sample classes, view rosters, and mark attendance. Switch between Studio owner and Instructor using the role menu.';if(/demo|feature|software|works/.test(s))return 'Try the Studio owner, Instructor, and Parent demo views. Students, classes, messages and sample billing all operate locally in your browser.';if(/contact|support|sales|email|schedule a demo/.test(s))return 'The public page includes a local demo-inquiry form. It does not send email. A production version will need a verified booking and support workflow.';return 'I can explain the sample class schedule, student records, tuition simulation, parent portal, mobile app plans, or pricing status. This is a scripted demo, not a live AI service.'}
function askChat(q){q=(q||'').trim().slice(0,240);if(!q)return;chatMessages.push({from:'you',text:q},{from:'bot',text:chatReply(q)});const c=document.querySelector('.chat-pane');if(c){c.outerHTML=chatPanel();document.querySelector('#chat-messages')?.scrollTo(0,999999);}else render();}
function doAction(action){if(action==='mobile-more'){modalForm('More studio tools',`<div class="more-menu">${NAV.owner.filter(([id])=>!MOBILE.owner.includes(id)).map(([id,ic,title])=>`<button type="button" class="more-link" data-route="${id}">${icon(ic)} <span>${title}</span> ${icon('chevron')}</button>`).join('')}<button type="button" class="more-link" data-action="marketing">${icon('home')} <span>Public website</span> ${icon('chevron')}</button><button type="button" class="more-link" data-action="reset">${icon('rotate')} <span>Reset demo data</span> ${icon('chevron')}</button></div>`, 'more');return}if(action==='toggle-menu'){mobileMenu=!mobileMenu;render();return}if(action==='close-menu'){mobileMenu=false;return}if(action==='owner'||action==='instructor'||action==='parent'||action==='marketing'){navigate(action);return}if(action==='reset'){if(window.confirm('Reset only this prototype’s fictional sample data?')){db=sample();save();render();toast('Fictional demo data restored.')}return}if(action==='chat-toggle'){chatOpen=!chatOpen;render();return}if(action==='add-student'){openStudent();return}if(action==='add-class'){openClass();return}if(action==='add-invoice'){openInvoice();return}if(action==='new-message'){openMessage();return}if(action==='close-modal'){modal='';renderModal();return}if(action==='show-classes'){role='owner';route='classes';render();return}if(action==='show-roll'){role='instructor';route='roll';render();return}if(action==='show-schedule'){role='parent';route='schedule';render();return}if(action==='show-updates'){role='parent';route='updates';render();return}if(action.startsWith('roster-')){openRoster(action.substring(7));return}if(action.startsWith('mark:')){const [,cid,sid,status]=action.split(':');if(db.classes.find(c=>c.id===cid)?.enrolled.includes(sid)){db.attendance[cid]??={};db.attendance[cid][sid]=status;save();const sel=document.querySelector('#attendance-class');if(sel?.value===cid){const b=document.querySelector('#attendance-block');if(b)b.innerHTML=attendanceBody(cid)}toast(`Marked ${studentName(sid)} ${status} (demo).`)}return}if(action.startsWith('pay-')){const inv=db.invoices.find(i=>i.id===action.slice(4));if(inv&&inv.status==='Open'){inv.status='Paid';track(`Marked ${inv.label} paid — simulated`);render();toast('Invoice marked paid in demo. No money transferred.')}return}if(action.startsWith('request-')){const c=db.classes.find(x=>x.id===action.slice(8));if(c){db.enrollmentRequests.push({classId:c.id,studentId:'s1'});track(`Sample enrollment request for ${c.name}`);toast(`Mock request recorded for ${c.name}. Not sent.`)}return}}
document.addEventListener('click',e=>{const quick=e.target.closest('[data-chat-quick]');if(quick){askChat(quick.dataset.chatQuick);return}const r=e.target.closest('[data-route]');if(r){route=r.dataset.route;modal='';render();window.scrollTo({top:0,behavior:'instant'});return}const a=e.target.closest('[data-action]');if(a){if(a.classList.contains('modal-scrim')&&e.target!==a)return;if(a.tagName==='A'){mobileMenu=false;return}doAction(a.dataset.action)}});
document.addEventListener('change',e=>{if(e.target.id==='role-select'){navigate(e.target.value);return}if(e.target.id==='attendance-class'){const b=document.querySelector('#attendance-block');if(b)b.innerHTML=attendanceBody(e.target.value)}});
document.addEventListener('input',e=>{if(e.target.id==='student-search'){const q=e.target.value.toLowerCase().trim();let shown=0;document.querySelectorAll('#student-list tr').forEach(row=>{const visible=row.dataset.studentSearch.includes(q);row.hidden=!visible;if(visible)shown++});const label=document.querySelector('#student-count');if(label)label.textContent=`${shown} students`}});
document.addEventListener('submit',e=>{const form=e.target;if(!['student-form','class-form','invoice-form','message-form','lead-form','chat-form'].includes(form.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());if(form.id==='chat-form'){askChat(data.question);return}if(form.id==='student-form'){const name=(data['student-name']||'').trim(),age=Number(data['student-age']);if(!name||!Number.isFinite(age)||age<2||age>99)return toast('Please check the student name and age.');db.students.push({id:'s'+Date.now(),name,age,level:(data['student-level']||'').trim(),guardian:(data['student-guardian']||'').trim(),email:'demo@example.test',status:'Active'});track(`Added fictional student: ${name}`);modal='';render();toast('Student added to demo roster.');return}if(form.id==='class-form'){const name=(data['class-name']||'').trim(),capacity=Number(data['class-capacity']),duration=Number(data['class-duration']);if(!name||!(capacity>=1&&capacity<=300)||!(duration>=15&&duration<=240))return toast('Check class details.');db.classes.push({id:'c'+Date.now(),name,day:data['class-day'],start:data['class-start'],duration,instructor:(data['class-instructor']||'').trim()||'Demo Teacher',room:(data['class-room']||'').trim()||'Studio A',capacity,enrolled:[]});track(`Added demo class: ${name}`);modal='';render();toast('Class added to demo schedule.');return}if(form.id==='invoice-form'){const amount=Number(data['invoice-amount']);if(!(amount>0&&amount<=100000)||!data['invoice-due'])return toast('Please enter a valid amount and due date.');db.invoices.unshift({id:'i'+Date.now(),studentId:data['invoice-student'],amount,due:data['invoice-due'],status:'Open',label:(data['invoice-label']||'Tuition').trim()});track('Created a fictional tuition invoice');modal='';render();toast('Demo invoice created.');return}if(form.id==='message-form'){if(!data['message-title']?.trim()||!data['message-body']?.trim())return;db.announcements.unshift({id:'a'+Date.now(),title:data['message-title'].trim(),body:data['message-body'].trim(),date:'Just now',kind:'Studio update'});track('Saved a mock studio announcement');modal='';render();toast('Announcement preview saved. Nothing sent.');return}if(form.id==='lead-form'){if(!data.name?.trim()||!data.studio?.trim())return;db.leads.push({name:data.name.trim(),studio:data.studio.trim(),message:(data.message||'').trim()});track(`Mock inquiry from ${data.studio}`);render();toast('Inquiry saved locally. No email was sent.');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';renderModal()}});
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
if(new URLSearchParams(location.search).get('app')==='1'){role='owner';route='overview'}
render();

function dancerCards(){
 const listed=db.students.filter(s=>profile(s.id).listed),all=db.students.length;
 return head('Dancer spotlight','NFL-style player cards for your studio. Cards are visible only inside this fictional demo.',button(icon('plus')+' Edit profiles','manage-roster','btn-outline'))+
 '<div class="dm-spotlight-hero"><div><span class="dm-mini-label">DANCER HALL OF FAME</span><h2>The talent behind every performance.</h2><p>Celebrate specialties, personal stories, competition history and trophies without losing the practical student record behind the scenes.</p><div class="dm-hero-buttons">'+button('Manage listed dancers','manage-roster','btn-light')+button('Plan competitions','show-competitions','btn-outline')+'</div></div><div class="dm-hero-trophy">'+icon('trophy')+'</div></div>'+
 '<div class="dm-simple-stats"><div><strong>'+listed.length+'</strong><span>Featured dancer cards</span></div><div><strong>'+db.awards.length+'</strong><span>Recorded achievements</span></div><div><strong>'+db.competitions.length+'</strong><span>Tracked competitions</span></div></div>'+
 '<div class="dm-section-line"><h2>Our studio roster</h2><span class="pill blue">'+listed.length+' of '+all+' featured</span></div>'+
 '<div class="dm-player-grid">'+(listed.length?listed.map((s,i)=>dancerCard(s,i)).join(''):'<div class="empty">No dancer cards are currently listed. Choose “Manage listed dancers” to turn some on.</div>')+'</div>'+
 '<div class="safe-notice dm-privacy">'+icon('shield')+' Privacy first: “featured” controls this private demo roster, not a public directory. In production, public child profiles and images must require verified guardian permission and limited, revocable sharing. Do not enter real children’s details here.</div>';
}
function eventFormat(e){return prettyDate(e.date)+' · '+esc(e.city);}
function competitionPlanner(){
 const upcoming=[...db.competitions].filter(x=>x.status!=='Completed').sort((a,b)=>a.date.localeCompare(b.date));
 const past=[...db.competitions].filter(x=>x.status==='Completed').sort((a,b)=>b.date.localeCompare(a.date));
 return head('Competition center','Plan the season, manage entries, and celebrate results — fictional data only.',button(icon('plus')+' Add competition','new-competition'))+
 '<div class="dm-event-intro"><div><span class="dm-mini-label">COMPETITION COMMAND CENTER</span><h2>From first entry to final trophy.</h2><p>Keep your dancers, deadlines, locations, performances, and results in one place.</p></div><div class="dm-calendar-art">'+icon('calendar')+'</div></div>'+
 '<div class="dm-simple-stats"><div><strong>'+upcoming.length+'</strong><span>Upcoming events</span></div><div><strong>'+past.length+'</strong><span>Past events</span></div><div><strong>'+db.awards.length+'</strong><span>Awards recorded</span></div></div>'+
 '<div class="dm-section-line"><h2>Upcoming competitions</h2><span class="pill blue">Manage registrations</span></div>'+
 (upcoming.length?'<div class="dm-event-list">'+upcoming.map(eventCard).join('')+'</div>':'<div class="empty">No upcoming events yet.</div>')+
 '<div class="dm-section-line dm-past-title"><h2>Past competitions & results</h2><span class="pill green">Performance history</span></div>'+
 (past.length?'<div class="dm-event-list">'+past.map(eventCard).join('')+'</div>':'<div class="empty">No completed events recorded.</div>')+
 '<div class="safe-notice dm-privacy">'+icon('shield')+' All event names, cities, dates, venues, fees, participants and results are demonstration examples — not real bookings or competition results.</div>';
}
function eventCard(e){
 const date=new Date(e.date+'T12:00:00');const mon=Number.isNaN(+date)?'—':date.toLocaleDateString('en-US',{month:'short'}),day=Number.isNaN(+date)?'—':date.getDate();
 const completed=e.status==='Completed',awards=db.awards.filter(a=>a.competitionId===e.id).length;
 return '<article class="dm-event-card"><div class="dm-event-date"><strong>'+mon+'</strong><b>'+day+'</b><small>'+esc(e.date.slice(0,4))+'</small></div><div class="dm-event-copy"><div class="dm-event-tags"><span class="pill '+(completed?'green':'blue')+'">'+esc(e.status)+'</span> <span>'+esc(e.city)+'</span></div><h3>'+esc(e.title)+'</h3><p>'+icon('pin')+' '+esc(e.venue)+'</p><p class="dm-event-fine">'+(completed?icon('medal')+' '+awards+' recorded awards':icon('clock')+' Entry deadline '+prettyDate(e.deadline))+' · '+(e.participants||[]).length+' dancers</p></div><button class="btn btn-soft dm-event-button" data-action="event-'+esc(e.id)+'">Manage '+icon('arrow')+'</button></article>';
}
function selector(name,items,selected){return '<div class="form-field"><label class="label" for="'+name+'">Dancer</label><select name="'+name+'" id="'+name+'">'+items.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div>';}
function profileDialog(id){
 const s=db.students.find(x=>x.id===id);if(!s)return;
 const p=profile(id),aw=awardsFor(id),events=competitionsFor(id);
 modalForm(s.name+' — dancer card',
 '<div class="dm-dialog-summary">'+avatar(s,1)+'<div><span class="dm-mini-label">STUDIO DANCER PROFILE</span><h3>'+esc(s.name)+'</h3><p>'+esc(p.specialties||s.level)+'</p></div></div>'+
 '<p class="small">'+esc(p.bio)+'</p><h3 class="dm-modal-h3">'+icon('trophy')+' Awards & achievements</h3>'+
 (aw.length?aw.map(a=>'<div class="dm-award-row"><span>'+icon('medal')+'</span><div><strong>'+esc(a.title)+'</strong><small>'+esc(db.competitions.find(e=>e.id===a.competitionId)?.title||'Competition')+' · '+esc(a.placement||'Award')+'</small></div></div>').join(''):'<p class="muted small">No achievements recorded for this dancer.</p>')+
 '<h3 class="dm-modal-h3">'+icon('calendar')+' Competitions attended</h3>'+
 (events.length?events.map(e=>'<div class="dm-award-row"><span>'+icon('flag')+'</span><div><strong>'+esc(e.title)+'</strong><small>'+eventFormat(e)+'</small></div></div>').join(''):'<p class="muted small">No competitions recorded.</p>')+
 '<div class="modal-footer">'+button('Edit card','edit-dancer-'+s.id,'btn-primary')+button('Close','close-modal','btn-outline')+'</div>','dancer');
}
function editProfileDialog(id){
 const s=db.students.find(x=>x.id===id);if(!s)return;const p=profile(id);
 modalForm('Edit dancer card — '+s.name,
 '<div class="safe-notice">Use fictional sample information only. This prototype has no secure profiles, uploads, or permissions.</div>'+
 '<form id="dm-profile-form"><input type="hidden" name="studentId" value="'+esc(s.id)+'">'+
 field('dm-specialties','Specialties / dance styles','e.g. Ballet · Jazz','text','required maxlength="140"',p.specialties||s.level)+
 '<div class="form-field"><label class="label" for="dm-biography">Background & biography</label><textarea id="dm-biography" name="biography" maxlength="500" rows="4" required>'+esc(p.bio||'')+'</textarea></div>'+
 '<label class="dm-check-label"><input type="checkbox" name="listed" '+(p.listed?'checked':'')+'> Display this fictional dancer card on the studio demo roster</label>'+
 '<p class="fineprint">An actual portrait uploader requires secure storage and parent/guardian authorization. The demo currently shows an illustrated placeholder.</p>'+footer('Save dancer card')+'</form>','edit-profile');
}
function rosterDialog(){
 modalForm('Choose featured dancers','<p class="small muted">Choose which fictional dancer cards appear in your studio’s internal showcase. This does not publish any student to the internet.</p>'+
 '<form id="dm-roster-form"><div class="dm-roster-choices">'+db.students.map(s=>'<label class="dm-roster-choice"><input type="checkbox" name="featured" value="'+esc(s.id)+'" '+(profile(s.id).listed?'checked':'')+'><span class="student-avatar">'+esc(initials(s.name))+'</span><span>'+esc(s.name)+'</span></label>').join('')+'</div>'+footer('Update featured roster')+'</form>','roster-toggle');
}
function eventDialog(id){
 const e=db.competitions.find(c=>c.id===id);if(!e)return;
 const registered=db.students.filter(s=>e.participants.includes(s.id));
 modalForm(e.title+' — event manager',
 '<div class="dm-event-dialog-header">'+icon('calendar')+' '+eventFormat(e)+'</div><p class="small muted">'+icon('pin')+' '+esc(e.venue)+'</p>'+
 '<div class="dm-info-grid"><div><strong>'+prettyDate(e.deadline)+'</strong><small>Entry deadline</small></div><div><strong>'+USD(e.fee)+'</strong><small>Illustrative entry fee</small></div><div><strong>'+esc(e.status)+'</strong><small>Status</small></div></div>'+
 '<h3 class="dm-modal-h3">Registered dancers</h3>'+
 (registered.length?registered.map(s=>'<div class="dm-award-row"><span class="student-avatar">'+esc(initials(s.name))+'</span><div><strong>'+esc(s.name)+'</strong><small>'+esc(profile(s.id).specialties||s.level)+'</small></div></div>').join(''):'<p class="muted small">No dancers currently entered.</p>')+
 '<div class="dm-dialog-actions">'+button('Add dancer','enter-'+e.id,'btn-soft btn-small')+button('Record result','award-'+e.id,'btn-soft btn-small')+(e.status!=='Completed'?button('Mark completed','finish-'+e.id,'btn-outline btn-small'):'')+'</div>'+

}
function newEventDialog(){
 modalForm('Add a sample competition',
 '<div class="safe-notice">Demo only — use invented event information. No external registration occurs.</div><form id="dm-event-form">'+
 field('dm-event-title','Competition title','e.g. Summer Showcase')+
 '<div class="form-grid">'+field('dm-event-date','Competition date','','date')+field('dm-event-deadline','Entry deadline','','date')+'</div>'+
 '<div class="form-grid">'+field('dm-event-city','City, state','e.g. Pensacola, FL')+field('dm-event-venue','Venue','e.g. Demo Arts Hall')+'</div>'+
 field('dm-event-fee','Entry fee estimate in USD','75','number','required min="0" max="10000"')+footer('Add competition')+'</form>','new-event');
}
function entryDialog(id){
 const e=db.competitions.find(c=>c.id===id);if(!e)return;
 const available=db.students.filter(s=>!e.participants.includes(s.id));
 modalForm('Add dancer — '+e.title,available.length?'<form id="dm-entry-form"><input type="hidden" name="eventId" value="'+esc(id)+'">'+selector('studentId',available)+footer('Add to competition')+'</form>':'<div class="empty">All fictional dancers are already entered.</div>','entry');
}
function awardDialog(id){
 const e=db.competitions.find(c=>c.id===id);if(!e)return;
 const participants=db.students.filter(s=>e.participants.includes(s.id));
 modalForm('Record award — '+e.title,participants.length?
 '<form id="dm-award-form"><input type="hidden" name="eventId" value="'+esc(id)+'">'+selector('studentId',participants)+
 field('dm-award-title','Result / award','e.g. 1st Place — Contemporary Solo')+
 '<div class="form-field"><label class="label" for="dm-placement">Recognition</label><select id="dm-placement" name="placement"><option>Gold</option><option>Silver</option><option>Bronze</option><option>Special Award</option><option>Participation</option></select></div>'+footer('Record achievement')+'</form>':'<p class="muted">Add a dancer to this event before recording a result.</p>','award');
}
const prevDoAction=doAction;
doAction=function(action){
 if(action==='show-dancers'){navigate('owner','dancers');return;}
 if(action==='show-competitions'){navigate('owner','competitions');return;}
 if(action==='manage-roster'){rosterDialog();return;}
 if(action==='new-competition'){newEventDialog();return;}
 if(action.startsWith('dancer-')){profileDialog(action.slice(7));return;}
 if(action.startsWith('edit-dancer-')){editProfileDialog(action.slice(12));return;}
 if(action.startsWith('event-')){eventDialog(action.slice(6));return;}
 if(action.startsWith('enter-')){entryDialog(action.slice(6));return;}
 if(action.startsWith('award-')){awardDialog(action.slice(6));return;}
 if(action.startsWith('finish-')){const c=db.competitions.find(x=>x.id===action.slice(7));if(c){c.status='Completed';save();modal='';render();toast('Competition marked completed (demo).')}return;}
 if(action==='reset'){if(window.confirm('Reset all fictional demo data, including dancer cards and competitions?')){db=sample();ensureV2();render();toast('All fictional demo data restored.')}return;}
 prevDoAction(action);
};
document.addEventListener('submit',function(e){
 const ids=['dm-profile-form','dm-roster-form','dm-event-form','dm-entry-form','dm-award-form'];
 if(!ids.includes(e.target.id))return;
 e.preventDefault();
 const form=e.target,d=new FormData(form),str=k=>String(d.get(k)||'').trim();
 if(form.id==='dm-profile-form'){
  const s=db.students.find(x=>x.id===str('studentId'));if(!s)return;
  const spec=str('dm-specialties').slice(0,140),bio=str('biography').slice(0,500);
  if(!spec||!bio)return toast('Add specialties and a short biography.');
  const p=profile(s.id);p.studentId=s.id;p.specialties=spec;p.bio=bio;p.listed=d.has('listed');
  const existing=db.dancerProfiles.findIndex(x=>x.studentId===s.id);
  if(existing>=0)db.dancerProfiles[existing]=p;else db.dancerProfiles.push(p);
 }else if(form.id==='dm-roster-form'){
  const keep=new Set(d.getAll('featured'));
  for(const s of db.students){let p=profile(s.id);p.studentId=s.id;p.listed=keep.has(s.id);if(!db.dancerProfiles.some(x=>x.studentId===s.id))db.dancerProfiles.push(p);}
 }else if(form.id==='dm-event-form'){
  const title=str('dm-event-title').slice(0,120),date=str('dm-event-date'),deadline=str('dm-event-deadline'),city=str('dm-event-city').slice(0,120),venue=str('dm-event-venue').slice(0,120),fee=Number(str('dm-event-fee'));
  if(!title||!date||!deadline||!city||!venue||!Number.isFinite(fee)||fee<0||fee>10000)return toast('Please complete each event field.');
  db.competitions.push({id:'dc'+Date.now(),title,date,deadline,city,venue,fee,status:'Upcoming',participants:[]});
 }else if(form.id==='dm-entry-form'){
  const event=db.competitions.find(x=>x.id===str('eventId')),sid=str('studentId');
  if(!event||!db.students.some(s=>s.id===sid)||event.participants.includes(sid))return toast('Choose an available dancer.');
  event.participants.push(sid);
 }else if(form.id==='dm-award-form'){
  const event=db.competitions.find(x=>x.id===str('eventId')),sid=str('studentId'),title=str('dm-award-title').slice(0,150);
  if(!event||!event.participants.includes(sid)||!title)return toast('Choose an entered dancer and result.');
  db.awards.push({id:'da'+Date.now(),studentId:sid,competitionId:event.id,title,placement:str('placement')});
 }
 save();modal='';render();toast('Fictional record saved on this device.');
});

render();
})();
</script>

 {title:'Encore',format:'Production',style:'Tap',who:'Studio Collective',tag:'Special Award',photo:src.stage},
 {title:'Electric Motion',format:'Team',style:'Hip-Hop',who:'Urban Motion Crew',tag:'Finalist',photo:src.stage}
];
function filterControls(){
 return '<section class="n3-categories"><div class="n3-category-banner"><div><span>EXPLORE THE COMPETITION FLOOR</span><h2>Competition categories</h2><p>Find routines and dancer groups by entry type and dance style. Each item is a fictional demonstration.</p></div><img src="'+src.hero+'" loading="lazy" alt="Stage performer in dramatic pose"></div>'+
 '<div class="n3-filter-label">ENTRY FORMAT</div><div class="n3-format-row">'+formats.map(function(f){return '<button type="button" data-action="n3-format-'+f[0]+'" class="n3-format-btn '+(chosenFormat===f[0]?'active':'')+'">'+f[1]+'</button>';}).join('')+'</div>'+
 '<div class="n3-style-row"><span>Dance style:</span>'+styles.map(function(s){return '<button type="button" class="n3-style-btn '+(chosenStyle===s?'active':'')+'" data-action="n3-style-'+s+'">'+s+'</button>';}).join('')+'</div>'+
 '<div class="n3-routines-head"><h3>'+chosenFormat+' spotlight</h3><span>Illustrative examples</span></div>'+
 '<div class="n3-routines">'+routines.filter(function(r){return r.format===chosenFormat&&(chosenStyle==='All styles'||chosenStyle===r.style);}).map(function(r){return '<article class="n3-routine"><div class="n3-routine-img"><img src="'+r.photo+'" alt="Illustrative stage photography" loading="lazy"><span>★ '+r.tag+'</span></div><div class="n3-routine-info"><small>'+r.style+' · '+r.format+'</small><h4>'+r.title+'</h4><p>'+r.who+'</p><span>Sample routine · Demo only</span></div></article>';}).join('')+
 (routines.some(function(r){return r.format===chosenFormat&&(chosenStyle==='All styles'||chosenStyle===r.style);})?'':'<div class="n3-no-results">No sample routine in this combination. Choose another dance style.</div>')+'</div></section>';
}
content=function(){
 const result=beforeContent();
 if(role==='owner'&&route==='competitions') return result.replace('<div class="dm-simple-stats">',filterControls()+'<div class="dm-simple-stats">');
 return result;
};
const prevAction=doAction;
doAction=function(a){
 if(a.indexOf('n3-format-')===0){chosenFormat=a.slice(10);chosenStyle='All styles';render();return;}
 if(a.indexOf('n3-style-')===0){chosenStyle=a.slice(9);render();return;}
 prevAction(a);
};
demoBanner=function(){return '<div class="demo-banner">V6 FORM PREVIEW · Fictional data · Original site unchanged</div>';};

render();
})();

<script id="dance-v5-chat">
(function(){
'use strict';
let dm5Lead=false,dm5Type='Studio owner',dm5InvitationShown=false;
const options={
 start:[['🏫 I run a studio','studio'],['🏆 I host competitions','director'],['👪 I’m a parent','parent'],['✨ I’m a dancer','dancer'],['📅 Request a demo','demo']],
 studio:[['Explore studio tools →','studio-tour'],['See dancer profiles →','dancer-tour'],['📅 Request a demo','demo'],['← Other questions','start']],
 director:[['Explore competitions →','competition-tour'],['See dancer profiles →','dancer-tour'],['📅 Request a demo','demo'],['← Other questions','start']],
 parent:[['Explore family portal →','parent-tour'],['See dancer profiles →','dancer-tour'],['← Other questions','start'],['📅 Request a demo','demo']],
 dancer:[['See dancer cards →','dancer-tour'],['Explore competitions →','competition-tour'],['← Other questions','start'],['📅 Request a demo','demo']]
};
let dm5Stage='start';
chatMessages.length=0;
chatMessages.push({from:'bot',text:'Hi there! 👋 Welcome to Dance Manager Next. Whether you run a studio, organize competitions, or support a dancer, I can help you find your way. What brings you here today?'});
const oldRender=render, oldChatReply=chatReply;
const noticeKey='dance-manager-v5-greeting-shown';
function dm5Safe(t){return esc(String(t??''));}
function dm5InviteRemove(){document.querySelectorAll('.dm5-invite').forEach(x=>x.remove());}
function dm5Open(){chatOpen=true;dm5Lead=false;dm5InviteRemove();try{sessionStorage.setItem(noticeKey,'yes')}catch(e){} render();dm5Bottom();}
function dm5Bottom(){const area=document.querySelector('#chat-messages');if(area)area.scrollTop=area.scrollHeight;}
function dm5Say(user,reply,stage){if(user)chatMessages.push({from:'you',text:user});if(reply)chatMessages.push({from:'bot',text:reply});if(stage)dm5Stage=stage;dm5Lead=false;render();dm5Bottom();}
function dm5LeadForm(){
 return '<form id="dm5-lead-form" class="dm5-lead">'+
 '<h3>Preview your demo request</h3><p>Try the form using sample information. No booking or email is sent; anything saved stays on this device.</p>'+
 '<div class="dm5-lead-grid"><div><label for="dm5-name">Your name</label><input id="dm5-name" name="name" maxlength="70" required placeholder="Sample Visitor" autocomplete="off"></div>'+
 '<div><label for="dm5-email">Email</label><input id="dm5-email" name="email" type="email" maxlength="120" required placeholder="sample@example.test" autocomplete="off"></div></div>'+
 '<label for="dm5-organization">Studio or organization</label><input id="dm5-organization" name="studio" maxlength="90" required placeholder="Example Dance Academy" autocomplete="off">'+
 '<label for="dm5-role">I’m interested as a</label><select id="dm5-role" name="visitorType">'+
 ['Studio owner','Competition director','Parent / family','Dancer','Other'].map(x=>'<option'+(x===dm5Type?' selected':'')+'>'+x+'</option>').join('')+'</select>'+
 '<label for="dm5-notes">What would you like to explore? (optional)</label><textarea id="dm5-notes" name="message" maxlength="400" placeholder="Competition entries, studio billing, class scheduling..."></textarea>'+
 '<label class="dm5-consent"><input type="checkbox" name="understand" required><span>I understand this is a demonstration stored on this device, and no request will actually be sent.</span></label>'+
 '<div class="dm5-lead-actions"><button class="dm5-back" data-dm5-action="back" type="button">Back</button><button class="dm5-send-demo" type="submit">Save sample request</button></div>'+
 '</form>';
}
chatPanel=function(){
 const messages=chatMessages.slice(-20).map(m=>'<div class="dm5-msg '+(m.from==='you'?'mine':'bot')+'">'+dm5Safe(m.text)+'</div>').join('');
 const choices=(options[dm5Stage]||options.start).map(([label,a])=>'<button type="button" data-dm5-action="'+a+'"'+(a==='demo'?' class="dm5-full"':'')+'>'+dm5Safe(label)+'</button>').join('');
 return '<section class="chat-pane dm5-chat-pane '+(dm5Lead?'dm6-lead-mode':'')+'" aria-label="Dance Manager interactive visitor guide">'+
 '<header class="chat-head"><div class="dm5-chat-avatar" aria-hidden="true">✦</div><div><b>'+(dm5Lead?'Demo request':'Dance Manager Guide')+'</b><small>'+(dm5Lead?'Tell us what interests you':'Welcome! How can I help?')+'</small></div>'+
 '<button class="dm5-chat-close" type="button" data-dm5-action="close" aria-label="Close chat">×</button></header>'+
 (dm5Lead?'<div class="dm5-automated">Sample request only · Nothing is sent or booked</div>':'<div class="dm5-automated">Interactive demo assistant · Automated replies, not a live agent</div>')+
 (dm5Lead?'':'<div id="chat-messages" class="dm5-history" role="log" aria-live="polite">'+messages+'</div>')+
 (dm5Lead?dm5LeadForm():'<div class="dm5-choices">'+choices+'</div><form id="chat-form" class="chat-input"><label class="screen-reader" for="chat-question">Ask a question</label><input id="chat-question" name="question" maxlength="240" placeholder="Or type your question…" required autocomplete="off"><button type="submit" aria-label="Ask question">'+icon('arrow')+'</button></form>')+
 '</section>';
};
askChat=function(q){
 q=String(q||'').trim().slice(0,240);if(!q)return;
 const lower=q.toLowerCase();
 const answer=/demo|contact|reach out|book|schedule a call|talk to a person/.test(lower)
 ?'You can preview a demo request below. This test site does not send your details or connect you with a real person yet.'
 :oldChatReply(q);
 dm5Say(q,answer);
 if(/demo|contact|reach out|book|schedule a call|talk to a person/.test(lower)){dm5Lead=true;render();dm5Bottom();}
};
function dm5Decorate(){
 const b=document.querySelector('.chat-trigger');
 if(b){
 b.setAttribute('aria-label','Open Dance Manager welcome guide');b.setAttribute('title','Questions? Start here');
 b.innerHTML=icon('chat')+'<span class="dm5-chat-dot" aria-hidden="true"></span>';
 }
 if(!chatOpen && role==='marketing' && !dm5InvitationShown){
  dm5InvitationShown=true;
  setTimeout(function(){
    if(chatOpen||role!=='marketing'||document.querySelector('.dm5-invite'))return;
    try{if(sessionStorage.getItem(noticeKey))return;sessionStorage.setItem(noticeKey,'yes')}catch(e){}
    const d=document.createElement('div');d.className='dm5-invite';
    d.innerHTML='<button type="button" class="dm5-invite-text" data-dm5-action="open"><b>Hi there! 👋</b> Running a studio or planning a dance competition? I can help you explore.</button>'+
    '<button type="button" class="dm5-invite-close" data-dm5-action="dismiss" aria-label="Dismiss welcome message">×</button>';
    document.body.appendChild(d);
    setTimeout(function(){if(d.isConnected)d.remove();},11000);
  },1800);
 }
}
render=function(){oldRender();dm5Decorate();};
function dm5Route(roleName,routeName){dm5InviteRemove();navigate(roleName,routeName);}
document.addEventListener('click',function(e){
 const button=e.target.closest('[data-dm5-action]');if(!button)return;
 e.preventDefault();e.stopImmediatePropagation();
 const a=button.dataset.dm5Action;
 if(a==='dismiss'){dm5InviteRemove();return;}
 if(a==='open'){dm5Open();return;}
 if(a==='close'){chatOpen=false;dm5Lead=false;render();return;}
 if(a==='back'){dm5Lead=false;render();dm5Bottom();return;}
 if(a==='start'){dm5Say('Other questions','Which part of Dance Manager Next would you like to explore?','start');return;}
 if(a==='demo'){dm5Lead=true;render();dm5Bottom();return;}
 if(a==='studio'){dm5Type='Studio owner';dm5Say('I run a studio','Great! This prototype lets you explore class schedules, rosters, attendance, invoicing and messages. Where would you like to start?','studio');return;}
 if(a==='director'){dm5Type='Competition director';dm5Say('I host competitions','Welcome! Explore our example competition formats, dancer entries, schedules and awards. These are sample features, not actual event registrations.','director');return;}
 if(a==='parent'){dm5Type='Parent / family';dm5Say('I’m a parent','You can preview a family portal with sample class schedules, tuition summaries and studio announcements.','parent');return;}
 if(a==='dancer'){dm5Type='Dancer';dm5Say('I’m a dancer','Explore dancer spotlight cards, styles and achievements in our fictional showcase.','dancer');return;}
 if(a==='studio-tour'){dm5Route('owner','overview');return;}
 if(a==='competition-tour'){dm5Route('owner','competitions');return;}
 if(a==='dancer-tour'){dm5Route('owner','dancers');return;}
 if(a==='parent-tour'){dm5Route('parent','family');return;}
},true);
document.addEventListener('submit',function(e){
 if(e.target.id!=='dm5-lead-form')return;
 e.preventDefault();e.stopImmediatePropagation();
 const f=e.target;
 if(!f.reportValidity())return;
 const d=new FormData(f), name=String(d.get('name')||'').trim(),email=String(d.get('email')||'').trim(),studio=String(d.get('studio')||'').trim(),type=String(d.get('visitorType')||'').trim(),note=String(d.get('message')||'').trim();
 if(!name||!email||!studio||!d.has('understand'))return;
 // Prototype only: no outbound request, email, CRM or production data storage.
 if(!Array.isArray(db.leads))db.leads=[];
 db.leads.push({name,studio,email,type,message:note,source:'Visitor guide V6 (local demo)'});
 save();
 dm5Say('Save sample request','Thank you for trying the demo! Your sample request was saved in this browser only. Nobody has been contacted. Once secure lead capture is configured, this flow can send real requests to the studio.','start');
},true);
render();
})();
</script>
