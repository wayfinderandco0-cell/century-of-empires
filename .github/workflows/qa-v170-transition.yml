name: V170 terrain edge blend iPhone QA
on:
  push:
    branches: [terrain-v170-photo-edge-transition-20261024]
    paths:
      - 'v170-terrain-transition-test.html'
      - 'scripts/qa_v170_transition.py'
      - '.github/workflows/qa-v170-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-terrain-transition:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve exact V121 and V123 road identities
        run: node scripts/test_v161_native_material.js
      - name: Install QA dependencies
        run: python -m pip install playwright==1.64.1 pillow==12.0.0
      - name: Verify new iPhone playable preview in Chromium and WebKit
        run: python scripts/qa_v170_transition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v170-iphone-playable-3-octagon-screenshots-NOT-approved-art
          path: qa/v170-mobile/
          retention-days: 7
