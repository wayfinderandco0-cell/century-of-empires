          assert len(m['cells'])==27 and m['sourceArtworkRecords']==29
          assert len(m['nativePhotoPixelJoins'])==28
          assert len(m['unapprovedCrossSourceJoins'])==2
          assert len(m['roadFreeNativeDiamondInlays'])==8
          assert m['newArtworkComposedThisRun']==0
