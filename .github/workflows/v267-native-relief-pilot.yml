name: V267 original 3D relief octagon pilot
on:
  push:
    branches:
      - terrain-v267-three-original-art-prototype-20261028
    paths:
      - scripts/v267_native_relief_pilot.py
      - scripts/v267_relief_materials.py
      - scripts/v267_heightmesh_export.py
      - terrain-grid/v267-heightmesh-review.html
      - terrain-grid/atlas-integrated.js
      - terrain-grid/atlas-photo-stream.js
      - .github/workflows/v267-native-relief-pilot.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coe-v267-native-relief-pilot
  cancel-in-progress: true
jobs:
  build-original-relief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source terrain renderer
        run: python -m pip install --disable-pip-version-check numpy scipy Pillow playwright
      - name: Render eight ORIGINAL DEM-driven shaded 3D relief octagons
        run: python scripts/v267_native_relief_pilot.py --root . --out generated/v267-relief-pilot --scale 1
      - name: Verify eight native octagons, road crossings and no false approval
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          p=Path('generated/v267-relief-pilot')
          m=json.loads((p/'manifest.json').read_text())
          assert len(m['cells'])==8 and len(m['seams'])==8 and len(m['inlays'])==3
          assert m['true3DMesh'] is False and m['visuallyApprovedV267'] is False
          for g in m['inlays']:
              assert not g['playable'] and not g['roadNodes']
              assert Image.open(p/g['image']).size==(512,512)
          assert m['status']=='original-3d-relief-candidates-NOT-V267-approved'
          assert not m['historicalRoadsVerified']
          assert len({c['sha256'] for c in m['cells']})==8
          for c in m['cells']:
              im=Image.open(p/c['image'])
              assert im.size==(1536,1024) and im.mode=='RGBA'
              assert im.getpixel((0,0))[3]==0 and im.getpixel((768,512))[3]==255
              assert hashlib.sha256((p/c['image']).read_bytes()).hexdigest()==c['sha256']
              assert c['nativeArt'] and not c['photographicCrop']
              assert not c['visualApproved'] and not c['nativeGamePlayable'] and not c['historicallyVerified']
          for s in m['seams']:
              vals=s.get('roadCrossingLocalY',s.get('roadCrossingLocalX',[]))
              assert vals and all(256<=v<=768 if s['side']=='east-west' else 256<=v<=1280 for v in vals),s
          print('PASS: eight original relief octagons, eight world-space road seams, zero finished or playable claims')
          PY
      - name: Export actual indexed 3D heightmesh geometry from shared V94 world space
        run: python scripts/v267_heightmesh_export.py --root . --out generated/v267-relief-pilot
      - name: Validate eight textured glTF meshes and exact shared-border contracts
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('generated/v267-relief-pilot')
          m=json.loads((p/'heightmesh-manifest.json').read_text())
          assert m['true3DMesh'] and not m['sourcePhotosUsed']
          assert len(m['cells'])==8 and len(m['inlays'])==3 and len(m['geometricSeamChecks'])==10
          assert m['roadContracts']==8
          assert m['historicalRoadsVerified']==m['nativeGamePlayable']==m['visuallyApprovedV267']==m['finishedToday']==0
          for c in m['cells']:
              g=json.loads((p/c['gltf']).read_text())
              assert g['asset']['version']=='2.0'
              assert g['accessors'][0]['count']==6305 and g['accessors'][3]['count']==36864
              assert g['meshes'][0]['primitives'][0]['mode']==4
              assert hashlib.sha256((p/c['binary']).read_bytes()).hexdigest()==c['sha256']
              assert not c['nativeGamePlayable'] and not c['visuallyApproved']
          for g in m['inlays']:
              gltf=json.loads((p/g['gltf']).read_text())
              assert gltf['accessors'][0]['count']==1089 and gltf['accessors'][3]['count']==6144
              assert not g['playable'] and not g['nativeGamePlayable']
          assert all(c['sameWorldGrid'] and c['maxHeightDifference']==0 for c in m['geometricSeamChecks'])
          print('PASS: 8 true heightmeshes + 3 3D diamond infills, 10 exact geometric seams; 0 approved/playable')
          PY
      - name: Install WebKit for mobile screenshot
        run: python -m playwright install --with-deps webkit
      - name: Check actual mobile WebKit image loading
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          p=Path('generated/v267-relief-pilot').resolve()
          with sync_playwright() as w:
              browser=w.webkit.launch(headless=True)
              page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
              page.goto((p/'index.html').as_uri(),wait_until='load')
              page.wait_for_function("document.images.length===1 && document.images[0].complete && document.images[0].naturalWidth===1536",timeout=60000)
              page.screenshot(path=str(p/'actual-webkit-iphone.png'),full_page=True)
              browser.close()
          print('PASS: original relief contact sheet visible in 390x844 WebKit; native game NOT integrated')
          PY
      - name: Verify actual native game canvas loads 8 relief studies and retains V123 march
        run: |
          python - <<'PY'
          import subprocess,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1'],
                                  stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
          try:
              time.sleep(1.5)
              with sync_playwright() as w:
                  browser=w.webkit.launch(headless=True)
                  page=browser.new_page(viewport={'width':390,'height':844},
                      device_scale_factor=2,is_mobile=True,has_touch=True)
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('http://127.0.0.1:8765/index.html?terrainStudy=1',wait_until='domcontentloaded')
                  page.wait_for_function('window.COEAtlas && window.COEAtlas.loaded',timeout=90000)
                  assert page.evaluate('COEAtlas.nodes')==100
                  page.locator('#atlasIntegratedOpen').click()
                  page.locator('#atlasPhotoSources').click()
                  page.wait_for_function('COEAtlas.photoMode && COEAtlas.photoCells===8 && COEAtlas.photoLoaded>=2',timeout=60000)
                  page.locator('#atlasWhole').click()
                  page.wait_for_function('COEAtlas.photoInlays===3',timeout=10000)
                  page.wait_for_timeout(1000)
                  page.screenshot(path='generated/v267-relief-pilot/actual-native-game-webkit-iphone.png')
                  assert page.evaluate('COEAtlas.startMarch()') is False
                  page.locator('#atlasPhotoSources').click()
                  assert page.evaluate('COEAtlas.nodes')==100
                  assert page.evaluate('COEAtlas.startMarch()') is True
                  assert page.evaluate('COEAtlas.finishMarch()')==[2806,1629]
                  assert not errors,errors
                  browser.close()
          finally:
              server.terminate();server.wait(timeout=5)
          print('PASS: native WebKit terrain study, 3 decorative infills, V123 march, zero fake playable relief')
          PY
      - name: Render actual 3D geometry in iPhone-sized WebKit and test zoom/pan
        run: |
          python - <<'PY'
          import subprocess,time
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1'],
                                  stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
          try:
              time.sleep(1.5)
              with sync_playwright() as w:
                  browser=w.webkit.launch(headless=True)
                  page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('http://127.0.0.1:8765/terrain-grid/v267-heightmesh-review.html')
                  page.wait_for_function('window.COEMeshReview && (window.COEMeshReview.loaded || window.COEMeshReview.failed)',timeout=90000)
                  state=page.evaluate('window.COEMeshReview')
                  assert state['webgl2'] and state['loaded'] and state['cells']==8 and state['inlays']==3 and not state['failed'],state
                  page.locator('#plus').click()
                  page.locator('#minus').click()
                  page.locator('#next').click()
                  page.screenshot(path='generated/v267-relief-pilot/actual-webkit-heightmesh-close-iphone.png')
                  page.locator('#whole').click()
                  page.screenshot(path='generated/v267-relief-pilot/actual-webkit-heightmesh-iphone.png')
                  assert not errors,errors
                  browser.close()
          finally:
              server.terminate();server.wait(timeout=5)
          print('PASS: real WebGL2 3D terrain rendered in 390x844 WebKit, zoom/pan controls; not gameplay integration')
          PY
      - name: Commit generated candidate assets and mobile evidence to development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/v267-relief-pilot
          if ! git diff --cached --quiet; then
            git commit -m "Render eight connected original 3D relief candidates and mobile WebKit evidence"
            # Another development commit may arrive while the renderer runs.
            # Never force-push or discard it. Rebase and retry a bounded number
            # of times, failing visibly if generated asset conflicts occur.
            for attempt in 1 2 3; do
              if git push; then
                echo "PASS: generated 3D assets committed without overwriting newer source"
                exit 0
              fi
              git fetch origin terrain-v267-three-original-art-prototype-20261028
              if ! git rebase origin/terrain-v267-three-original-art-prototype-20261028; then
                git rebase --abort || true
                echo "ERROR: concurrent generated asset conflict; manual reconciliation required"
                exit 1
              fi
            done
            echo "ERROR: failed to push generated 3D assets after 3 safe retries"
            exit 1
          fi
