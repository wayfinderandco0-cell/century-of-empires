name: V260 SOUTH Single Native Source Resample (PRODUCTION RED)
on:
  push:
    branches:
      - terrain-v260-single-pass-native-south-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-pass-source-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry libraries
        run: python -m pip install numpy scipy opencv-python-headless
      - name: Compile and run synthetic V260 regressions
        run: |
          set -euo pipefail
          python -m py_compile scripts/v260_single_pass_native_south.py scripts/test_v260_single_pass_native_south.py
          python scripts/test_v260_single_pass_native_south.py -v
      - name: Fail closed on protected game files and atlas
        run: |
          set -euo pipefail
          git cat-file -e b29bbf06^{commit}
          git diff --name-only b29bbf06 HEAD > /tmp/v260-changed
          if grep -E '^(index\.html|v94-|v121-octagon-1-painted-road\.html|terrain-grid/v12[13]-|campaign|saves|assets/sprites)' /tmp/v260-changed; then
            echo "PROTECTED GAME FILE CHANGED"; exit 1
          fi
          python - <<'PY'
          import hashlib
          data=open('terrain-grid/v123-atlas.js','rb').read()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob=='09f04b4062e24fbacbb645307462cdddce2b2aa3',blob
          print('Immutable V123 atlas SHA verified')
          PY
          echo "No protected game files changed. Exact original image remains local-only."
  production-art-approval:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Strict V203, exact-art WebKit, geography, bridge banks, user approval still RED
        run: |
          echo "V260 is an isolated fictional-art quality experiment, NOT accepted game art."
          echo "Local source-pixel improvements do not constitute strict V203 or user approval."
          exit 1
