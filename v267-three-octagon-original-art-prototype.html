<script>
(function(){
/* V122 seam geometry gate. Canonical source copied from GitHub (bf6e3d7c063762359bde45a194975c126241ffa3). */
'use strict';
const EPS=1.5;
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const translate=(p,o)=>[p[0]+o[0],p[1]+o[1]];
function octagon(w,h,cut=256){
 if(!(w>2*cut&&h>2*cut))throw Error('Invalid octagon geometry');
 return [[cut,0],[w-cut,0],[w,cut],[w,h-cut],[w-cut,h],[cut,h],[0,h-cut],[0,cut]];
}
function segmentDistance(p,a,b){
 const dx=b[0]-a[0],dy=b[1]-a[1],den=dx*dx+dy*dy;
 const t=den?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/den)):0;
 return dist(p,[a[0]+t*dx,a[1]+t*dy]);
}
function boundaryDistance(p,polygon){
 return Math.min(...polygon.map((a,i)=>segmentDistance(p,a,polygon[(i+1)%polygon.length])));
}
function sharedSideLength(a,b,epsilon=EPS){
 const pa=octagon(a.width,a.height,a.corner||256).map(p=>translate(p,a.origin));
 const pb=octagon(b.width,b.height,b.corner||256).map(p=>translate(p,b.origin));
 let best=0;
 for(let i=0;i<pa.length;i++){
  const u=pa[i],v=pa[(i+1)%pa.length];
  const dx=v[0]-u[0],dy=v[1]-u[1],len=Math.hypot(dx,dy);
  for(let j=0;j<pb.length;j++){
   const p=pb[j],q=pb[(j+1)%pb.length];
   const lineError=(point)=>Math.abs(dx*(point[1]-u[1])-dy*(point[0]-u[0]))/len;
   if(lineError(p)>epsilon||lineError(q)>epsilon)continue;
   const t1=((p[0]-u[0])*dx+(p[1]-u[1])*dy)/len;
   const t2=((q[0]-u[0])*dx+(q[1]-u[1])*dy)/len;
   best=Math.max(best,Math.max(0,Math.min(len,Math.max(t1,t2))-Math.max(0,Math.min(t1,t2))));
  }
 }
 return best;
}
function endpoint(tile,port){
 const road=tile.roads && tile.roads[port.road];
 if(!road||road.length<2||road.some(p=>!Array.isArray(p)||p.length!==2))return null;
 return port.end==='start'?road[0]:port.end==='end'?road[road.length-1]:null;
}
function validateSeam(tiles,link,epsilon=EPS){
 const a=tiles.get(link.from.tile),b=tiles.get(link.to.tile),errors=[];
 if(!a||!b)return {id:link.id,pass:false,errors:['missing_tile']};
 const ap=endpoint(a,link.from),bp=endpoint(b,link.to);
 if(!ap||!bp)return {id:link.id,pass:false,errors:['missing_road_or_endpoint']};
 const polyA=octagon(a.width,a.height,a.corner||256);
 const polyB=octagon(b.width,b.height,b.corner||256);
 const distanceA=boundaryDistance(ap,polyA),distanceB=boundaryDistance(bp,polyB);
 const worldA=translate(ap,a.origin),worldB=translate(bp,b.origin);
 const gap=dist(worldA,worldB);
 if(distanceA>epsilon)errors.push('from_road_ends_inside_tile');
 if(distanceB>epsilon)errors.push('to_road_ends_inside_tile');
 if(gap>epsilon)errors.push('world_seam_gap');
 if(sharedSideLength(a,b,epsilon)<epsilon*2)errors.push('no_shared_octagon_side');
 if(a.artReviewed!==true||b.artReviewed!==true ||
    link.bothRoadsVisuallyVerified!==true)errors.push('source_art_not_approved');
 if(link.enabled!==true)errors.push('join_not_enabled');
 return {id:link.id,pass:errors.length===0,errors,
         endpointGapPx:gap,sourceInsetPx:distanceA,targetInsetPx:distanceB,
         from:worldA,to:worldB};
}
function buildNetwork(plan,epsilon=EPS){
 if(!Array.isArray(plan.tiles)||!Array.isArray(plan.links))throw Error('Bad network plan');
 const tiles=new Map(),graph=new Map(),seams=[];
 for(const t of plan.tiles){
  if(tiles.has(t.id)||!Array.isArray(t.origin)||!Number.isFinite(t.width)||!Number.isFinite(t.height))throw Error('Bad tile');
  tiles.set(t.id,t);
 }
 function key(id,p){return id+'@'+p[0].toFixed(3)+','+p[1].toFixed(3);}
 function ensure(id,p){const k=key(id,p);if(!graph.has(k))graph.set(k,{id,world:translate(p,tiles.get(id).origin),edges:[]});return k;}
 function edge(u,v,length,kind){graph.get(u).edges.push({to:v,length,kind});graph.get(v).edges.push({to:u,length,kind});}
 for(const t of plan.tiles)for(const [road,points] of Object.entries(t.roads||{})){
  if(points.length<2)continue;
  for(let i=1;i<points.length;i++){
   if(dist(points[i],points[i-1])<0.0001)throw Error('Duplicate road point: '+t.id+'/'+road);
   const u=ensure(t.id,points[i-1]),v=ensure(t.id,points[i]);
   edge(u,v,dist(points[i-1],points[i]),'painted-road');
  }
 }
 for(const link of plan.links){
  const check=validateSeam(tiles,link,epsilon);
  seams.push(check);
  if(!check.pass)continue;
  const a=tiles.get(link.from.tile),b=tiles.get(link.to.tile);
  const u=ensure(a.id,endpoint(a,link.from)),v=ensure(b.id,endpoint(b,link.to));
  edge(u,v,check.endpointGapPx,'approved-seam');
 }
 function planRoute(start,end){
  if(!graph.has(start)||!graph.has(end))return null;
  const queue=new Set(graph.keys()),cost=new Map([[start,0]]),prior=new Map();
  while(queue.size){
   let selected=null,best=Infinity;
   for(const id of queue){const d=cost.get(id)??Infinity;if(d<best){best=d;selected=id;}}
   if(selected===null||best===Infinity)break;
   queue.delete(selected);if(selected===end)break;
   for(const e of graph.get(selected).edges)if(queue.has(e.to)){
    const n=best+e.length;
    if(n<(cost.get(e.to)??Infinity)){cost.set(e.to,n);prior.set(e.to,selected);}
   }
  }
  if(!cost.has(end))return null;
  const keys=[end];while(keys[0]!==start){const previous=prior.get(keys[0]);if(!previous)return null;keys.unshift(previous);}
  return {distance:cost.get(end),keys,positions:keys.map(k=>graph.get(k).world),
          seams:keys.slice(1).filter((k,i)=>graph.get(keys[i]).id!==graph.get(k).id).length};
 }
 return {tiles,graph,seams,planRoute,key};
}
const seamApi={octagon,boundaryDistance,sharedSideLength,endpoint,validateSeam,buildNetwork};
if(typeof module!=='undefined'&&module.exports)module.exports=seamApi;
if(typeof window!=='undefined')window.V122Seam=seamApi;

})();
</script>

(function(root,factory){

 if(typeof module!=='undefined'&&module.exports)module.exports=api;
 else root.V123Atlas=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(seams){
 'use strict';
 const SIZE=[1536,1024],CORNER=256;
 const copy=o=>JSON.parse(JSON.stringify(o));
 const westRoad=[[1536,478],[1450,478],[1320,480],[1210,490],[1085,507],[980,515],[890,535],[784,551],[680,560],[570,540],[470,520],[370,522],[275,550]];
 const southRoad=[[466,0],[466,74],[470,160],[488,235],[540,310],[620,350],[700,400],[805,442],[930,510],[1050,550],[1140,585],[1270,605]];
 function create(centerRoads,opt={}){
  if(!centerRoads||!centerRoads.west||!centerRoads.south||!centerRoads.bridge)throw Error('Missing V121 primary painted road data');
  const middle=copy(centerRoads);
  if(middle.west[0][0]!==99||middle.west[0][1]!==478||middle.south.at(-1)[0]!==466||middle.south.at(-1)[1]!==958)throw Error('V121 coordinates drifted: stop, review the art');
  middle.west.unshift([0,478]);
  middle.south.push([466,1024]);
  const engineering=opt.experimentalSeams===true;
  const tiles=[
   {id:'west',name:'Western pass',origin:[0,0],width:SIZE[0],height:SIZE[1],corner:CORNER,roads:{east:copy(westRoad)},artReviewed:engineering},
   {id:'matrei',name:'Matrei',origin:[1536,0],width:SIZE[0],height:SIZE[1],corner:CORNER,roads:middle,artReviewed:engineering},
   {id:'south',name:'Southern valley',origin:[1536,1024],width:SIZE[0],height:SIZE[1],corner:CORNER,roads:{north:copy(southRoad)},artReviewed:engineering}
  ];
  const links=[
   {id:'west-matrei',from:{tile:'matrei',road:'west',end:'start'},to:{tile:'west',road:'east',end:'start'},bothRoadsVisuallyVerified:engineering,enabled:engineering},
   {id:'matrei-south',from:{tile:'matrei',road:'south',end:'end'},to:{tile:'south',road:'north',end:'start'},bothRoadsVisuallyVerified:engineering,enabled:engineering}
  ];
  return {version:123,tiles,links,network:seams.buildNetwork({tiles,links}),experimentalSeams:engineering,productionApproved:false,physicalIPhoneApproved:false,neighborArtFinal:false};
 }
 function endpoints(a){
  const network=a.network;
  return {
   west:network.key('west',westRoad.at(-1)),
   matrei:network.key('matrei',[518,519]),
   south:network.key('south',southRoad.at(-1)),
   bridge:network.key('matrei',[813,486])
  };
 }
 return {create,endpoints,SIZE};
});

    JSON.stringify(v121.south.pop())!==JSON.stringify([466,1024]))throw Error("V121 source roads changed");
 atlasPlan=V123Atlas.create(v121,{experimentalSeams:true});network=atlasPlan.network;graph=network.graph;
 for(const tile of atlas){const original=atlasPlan.tiles.find(t=>t.id===tile.id);
  if(!original||JSON.stringify(original.roads)!==JSON.stringify(tile.roads)||
     JSON.stringify(original.origin)!==JSON.stringify(tile.o))throw Error("V123 art/route mismatch: "+tile.id);
 }
 if(graph.size!==100||network.seams.length!==2||network.seams.some(s=>!s.pass||s.endpointGapPx!==0))
  throw Error("Canonical V123 network or border checks failed");
 currentKey=V123Atlas.endpoints(atlasPlan).west;
 army=graph.get(currentKey).world.slice();
 return network.seams;
}
function nearestKey(p){let best=null,d=Infinity;
 for(const [k,n] of graph){const v=dist(p,n.world);if(v<d){d=v;best=k}}return best;
}
function currentEdge(){
 if(marchPath.length<2||pathKeys.length!==marchPath.length)return pausedEdge;
 let remain=traveled;
 for(let i=1;i<marchPath.length;i++){
  const length=dist(marchPath[i-1],marchPath[i]);
  if(remain<=length+1e-5){
   if(i===1&&pathKeys[0]===null)return startEdge;
   return pathKeys[i-1]&&pathKeys[i]?{a:pathKeys[i-1],b:pathKeys[i]}:null;
  }remain-=length;
 }return null;
}
function start(to){
 const target=typeof to==="string"?to:nearestKey(to);
 if(!graph.has(target))return false;
 const edge=moving?currentEdge():pausedEdge;
 const choices=edge?[edge.a,edge.b]:[currentKey||nearestKey(army)];
 let chosen=null;
 for(const k of choices){if(!k)continue;
  const plan=network.planRoute(k,target);if(!plan)continue;
  const p=graph.get(k).world,offset=dist(army,p);
  const pts=offset>1e-5?[army.slice(),...plan.positions]:plan.positions.slice();
  const keys=offset>1e-5?[null,...plan.keys]:plan.keys.slice();
  const cost=offset+plan.distance;
  if(!chosen||cost<chosen.cost)chosen={cost,pts,keys,plan,edge};
 }
 if(!chosen){document.getElementById("status").textContent="No connected V123 cartway route";return false}
 marchPath=chosen.pts;pathKeys=chosen.keys;total=chosen.cost;
 traveled=0;moving=total>1;goalKey=target;startEdge=chosen.edge;pausedEdge=null;dirty=true;
 document.getElementById("status").textContent="Marching on V123 cartways • "+chosen.plan.seams+" seam crossings";
 return true;
}
function halt(){if(!moving)return;pausedEdge=currentEdge();moving=false;goalKey=null;
 marchPath=[];pathKeys=[];traveled=0;total=0;dirty=true;

}
function sample(path,d){
 for(let i=1;i<path.length;i++){let seg=dist(path[i-1],path[i]);if(d<=seg){let f=d/seg;return [path[i-1][0]+(path[i][0]-path[i-1][0])*f,path[i-1][1]+(path[i][1]-path[i-1][1])*f]}d-=seg}

}
// Touch targets follow the real V123 cartway SEGMENTS, not merely nodes.
// This prevents missed taps on long road intervals and accidental off-road
// orders while leaving the original navigation graph and paths untouched.
function roadTap(p){
 // Gap artwork is intentionally not a playable region; don't snap a
 // tap in the decorative square onto the closest road by accident.
 const playable=atlas.some(t=>{
  const x=p[0]-t.o[0],y=p[1]-t.o[1];
  if(x<0||x>W||y<0||y>H)return false;
  const inx=y<CUT?CUT-y:y>H-CUT?y-(H-CUT):0;
  return x>=inx&&x<=W-inx;
 });
 if(!playable){document.getElementById('status').textContent='No road in the terrain infill';return;}
 let closest=null;
 for(const [k,n] of graph){for(const edge of n.edges){
  const target=graph.get(edge.to);if(!target)continue;
  const a=n.world,b=target.world,dx=b[0]-a[0],dy=b[1]-a[1];
  const len2=dx*dx+dy*dy;if(len2<1e-6)continue;
  const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/len2));
  const d=dist(p,[a[0]+t*dx,a[1]+t*dy]);
  if(!closest||d<closest.d)closest={d,k:t<.5?k:edge.to};
 }}
 if(closest&&closest.d<72)start(closest.k);
 else document.getElementById("status").textContent="Tap a visible cartway to march.";
}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle="#29261f";ctx.fillRect(0,0,cw,ch);
 ctx.save();ctx.translate(cw/2-cam[0]*scale,ch/2-cam[1]*scale);ctx.scale(scale,scale);
 // Deliberate parchment outside the three playable cells. Never fabricate
 // neighboring mountain tiles by reflecting or duplicating Matrei scenery.
 ctx.save();ctx.strokeStyle="rgba(200,174,117,.075)";ctx.lineWidth=1.5;
 for(let x=-512;x<4096;x+=256){ctx.beginPath();ctx.moveTo(x,-512);ctx.lineTo(x,2600);ctx.stroke()}
 for(let y=-512;y<2600;y+=256){ctx.beginPath();ctx.moveTo(-512,y);ctx.lineTo(4096,y);ctx.stroke()}
 ctx.restore();
 for(const patch of inlays)ctx.drawImage(patch.canvas,patch.x,patch.y);
 for(const tile of atlas){
  ctx.save();ctx.translate(...tile.o);
  poly();ctx.clip();
  let tex=textures[tile.id];
  if(tex){ctx.globalAlpha=1;ctx.drawImage(tex,0,0,W,H)}
  // Roads are physically present in the registered landscape raster;
  // no overlaid road stripe is drawn. Debug-only V123 path is optional.
  ctx.restore();
  naturalOutline(tile);
 }
 // Road portals cover the baked border at the two crossings only.
 for(const patch of roadPortals)ctx.drawImage(patch.canvas,patch.x,patch.y);
 // Seam collars sit above tiny gold-border restorations; they use real
 // neighboring photography rather than a synthetic stripe over the joint.
 for(const patch of seamArtPatches)ctx.drawImage(patch.canvas,patch.x,patch.y);
 if(showRoads){
  for(const tile of atlas){ctx.save();ctx.translate(...tile.o);
   for(const pts of Object.values(tile.roads)){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.lineWidth=5;ctx.strokeStyle="#f8e76c";ctx.stroke();}
   ctx.restore();
  }
 }
 ctx.save();ctx.font="bold 36px Georgia";ctx.textAlign="center";ctx.shadowColor="#09150e";ctx.shadowBlur=12;ctx.fillStyle="#fff0ca";ctx.fillText("WESTERN PASS",800,125);ctx.fillText("MATREI",2625,130);ctx.fillText("SOUTHERN VALLEY",2340,1960);ctx.restore();
 if(army){
  // The original V123 preview's screen-size unit badge, troop count and flag.
  ctx.save();ctx.translate(...army);
  const k=16/scale;ctx.fillStyle="#172e26";ctx.strokeStyle="#e7d087";ctx.lineWidth=2/scale;
  ctx.beginPath();ctx.arc(0,0,k,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.font="bold "+Math.ceil(19/scale)+"px Georgia";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#f5e4b4";ctx.fillText("⚔",0,-1/scale);
  ctx.fillStyle="#15291c";ctx.fillRect(-22/scale,19/scale,44/scale,17/scale);
  ctx.fillStyle="#ead89e";ctx.font="bold "+Math.ceil(11/scale)+"px sans-serif";ctx.fillText("720",0,28/scale);
  ctx.fillStyle="#e4d19f";ctx.fillRect(3/scale,-30/scale,2/scale,14/scale);
  ctx.fillStyle="#242529";ctx.fillRect(5/scale,-30/scale,15/scale,5/scale);
  ctx.fillStyle="#d6ac47";ctx.fillRect(5/scale,-25/scale,15/scale,5/scale);
  ctx.restore();
 }
 ctx.restore();
}
function resize(){cw=C.clientWidth;ch=C.clientHeight;dpr=Math.min(window.devicePixelRatio||1,2);C.width=cw*dpr;C.height=ch*dpr;base=Math.min(cw/3450,ch/2350);scale=base*zoom;dirty=true;render()}
function frame(time){
 let dt=Math.min(.12,(time-last)/1000);last=time;
 if(moving){traveled=Math.min(total,traveled+dt*215);army=sample(marchPath,traveled);dirty=true;
  if(traveled>=total-.01){moving=false;currentKey=goalKey;goalKey=null;startEdge=null;pausedEdge=null;
   document.getElementById("status").textContent="Army arrived • V123 route traversal complete";}}
 if(dirty){render();dirty=false}requestAnimationFrame(frame);
}
function pan(dx,dy){cam=[cam[0]-dx/scale,cam[1]-dy/scale];dirty=true}
C.addEventListener("pointerdown",e=>{
 C.setPointerCapture(e.pointerId);pointerState.set(e.pointerId,[e.clientX,e.clientY]);
 if(pointerState.size===1)down=[e.clientX,e.clientY];
 else down=null;
 if(pointerState.size===2){let p=[...pointerState.values()];gesture={d:dist(p[0],p[1])}}
});
C.addEventListener("pointermove",e=>{
 if(!pointerState.has(e.pointerId))return;
 let prev=pointerState.get(e.pointerId);pointerState.set(e.pointerId,[e.clientX,e.clientY]);
 if(pointerState.size===2){let p=[...pointerState.values()],nd=dist(p[0],p[1]),mid=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2];
  if(gesture&&gesture.d>1){let old=worldAt(mid);zoom=Math.max(.75,Math.min(9,zoom*nd/gesture.d));scale=base*zoom;let fresh=worldAt(mid);cam[0]+=old[0]-fresh[0];cam[1]+=old[1]-fresh[1]}gesture={d:nd};down=null;dirty=true;return
 }
 if(down&&dist(down,[e.clientX,e.clientY])>8)down=null;
 pan(e.clientX-prev[0],e.clientY-prev[1]);
});
function finish(e){if(!pointerState.has(e.pointerId))return;if(pointerState.size===1&&down&&dist(down,[e.clientX,e.clientY])<10){roadTap(worldAt([e.clientX,e.clientY]))}
 pointerState.delete(e.pointerId);if(pointerState.size<2)gesture=null;down=null;

for(const ev of ["pointerup","pointercancel","lostpointercapture"])C.addEventListener(ev,finish);
window.addEventListener("resize",resize);
document.getElementById("whole").onclick=()=>{cam=[1590,1020];zoom=1;scale=base*zoom;dirty=true};
document.getElementById("center").onclick=()=>{cam=army.slice();zoom=3;scale=base*zoom;dirty=true};
// One-touch iPhone inspection of the two fixed V123 cartway connections.

document.getElementById("march").onclick=()=>{moving=false;pausedEdge=null;startEdge=null;
 currentKey=V123Atlas.endpoints(atlasPlan).west;army=graph.get(currentKey).world.slice();

window.COE=Object.freeze({
 focusJoin,

 get army(){return army.slice()},get westSouthConnected(){return !!(network&&network.planRoute(V123Atlas.endpoints(atlasPlan).west,V123Atlas.endpoints(atlasPlan).south))},
 get sourceRegistered(){return !!(textures.west&&textures.south)},
 get roadSeams(){return network?network.seams.map(s=>({id:s.id,pass:s.pass,gap:s.endpointGapPx,errors:s.errors})):[]},
 get decorativeGapPatches(){return inlays.map(v=>v.name)},
 get productionApproved(){return false},get nativeIPhoneVerified(){return false},
 get engine(){return "canonical V122/V123 experimental seam graph"},
 get currentEdge(){return currentEdge()},get route(){return marchPath.map(p=>p.slice())},
 get pathKeys(){return pathKeys.slice()},
 marchWestToSouth:()=>{moving=false;pausedEdge=null;startEdge=null;currentKey=V123Atlas.endpoints(atlasPlan).west;
  army=graph.get(currentKey).world.slice();return start(V123Atlas.endpoints(atlasPlan).south)},
 halt,stepToEnd:()=>{if(marchPath.length){traveled=total;army=sample(marchPath,total);moving=false;currentKey=goalKey;goalKey=null;dirty=true}return army.slice()},
