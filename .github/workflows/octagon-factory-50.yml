              assert hashlib.sha256(art.read_bytes()).hexdigest()==c['outputSha256']
              assert not c['gameplayEnabled'] and not c['historicallyVerified']
              assert not c['physicallyRoadSeamChecked'] and not c['exactPhotoGeoreferenced']
