name: V256 Corrected Physical Cartway Trace (PRODUCTION RED)
on:
  push:
    branches:
      - terrain-v256-corrected-native-road-trace-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-physical-road-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy opencv-python-headless
      - name: Compile corrected road trace and regression tests
        run: python -m py_compile scripts/v256_real_cartway.py scripts/test_v256_real_cartway.py
      - name: Run seven V256 regressions including required WEST rejection
        run: PYTHONPATH=scripts python -m unittest -v scripts/test_v256_real_cartway.py
      - name: Verify original game and route files unchanged
        run: |
          git diff --name-only b29bbf06 -- terrain-grid/v123-atlas.js terrain-grid/v121-road-graph.js v121-octagon-1-painted-road.html v94.html index.html | tee /tmp/v256-protected-diff.txt
          test ! -s /tmp/v256-protected-diff.txt
  production-art-approval:
    runs-on: ubuntu-latest
    needs: isolated-physical-road-contact
    steps:
      - name: Keep production RED until source and gameplay evidence are accepted
        run: |
          echo 'WEST corrected physical-road trace exceeds unchanged 155px deformation gate.'
          echo 'SOUTH passes necessary transform geometry but still has visible road drift.'
          echo 'No independent V209 geodesy, historical roads, bridge banks, four-browser new-art screenshot pass or user approval.'
          echo 'Source PNGs are local fictional studies; CI synthetic tests are not game-art acceptance.'
          echo 'PRODUCTION GATE RED.'
          exit 1
