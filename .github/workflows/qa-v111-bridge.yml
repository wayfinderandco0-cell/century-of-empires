name: V111 Road and Bridge iPhone QA
on:
  push:
    branches: [main]
    paths:
      - "v111-bridge-junction.html"
      - "scripts/qa_v111_bridge.py"
      - ".github/workflows/qa-v111-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install browser engines
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test branch routing and zoom
        run: python scripts/qa_v111_bridge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v111-road-bridge-evidence
          path: qa/v111/
