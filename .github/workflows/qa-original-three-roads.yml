name: Original Three Artwork — Road Integrity
on:
  push:
    branches: [map-restart-approved-three-road-first-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every original road and all border crossings
        run: node map-reset/test-road-graph.cjs
