name: V242 Photo Art Import Visibility (PRODUCTION RED)
on:
  push:
    branches: ['terrain-v242-imported-photo-layer-priority-20261027']
  workflow_dispatch:
concurrency:
  group: v242-photo-import
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  actual-photo-import-and-four-browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local browser/image QA dependencies
        run: |
          python -m pip install pillow numpy playwright
          python -m playwright install --with-deps chromium webkit
      - name: Verify immutable V121/V123 and V242 import stacking regression
        run: |
          node scripts/test_v242_photo_art_import.js
          node scripts/test_v227_art_ingest.js
          node scripts/test_v236_authored_alpine.js
      - name: Inherited graph and road-tap regression
        run: |
          python scripts/qa_v137_coherent.py
          python scripts/qa_v202_road_segment_taps.py
      - name: Actual photo import screenshot, Matrei pixel preservation and army routing in four mobile configurations
        run: python scripts/qa_v242_photo_art_import.py
      - name: Strict unchanged V203 image microstructure gate (diagnostic; no approval)
        continue-on-error: true
        run: python scripts/qa_v203_canopy_structure.py --screenshots qa/v242-photo-import --output qa/v242-strict-v203 --enforce
      - name: Preserve actual screenshots and metrics for human inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v242-actual-photo-import-four-browser-UNAPPROVED
          path: |
            qa/v242-photo-import/
            qa/v242-strict-v203/
            qa/v202-road-segment-taps/
          retention-days: 14
      - name: Keep production RED without original accepted art, V209 registration, period roads, bridge-bank and user review
        if: always()
        run: |
          echo "V242 only repairs visibility of imported artwork; V224 fixtures are rejected."
          echo "No verified 1780 roads, source/game natural tiepoints, bridge banks, user art approval or physical iPhone approval."
          exit 1
