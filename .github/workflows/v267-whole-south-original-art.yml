name: V267 whole SOUTH original-photo art — actual iPhone review
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - scripts/compose_v267_whole_south_scene.py
      - .github/workflows/v267-whole-south-original-art.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v267-whole-south-original-art
  cancel-in-progress: false
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-photo compositor and actual mobile browser engines
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Author original full SOUTH landscape and bake photographed V123 cartway
        run: python scripts/compose_v267_whole_south_scene.py
      - name: Capture actual phone-sized WEST MATREI SOUTH and test seamless marching
        run: |
          python - <<'PY'
          from pathlib import Path
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          out=Path('art-reviews/v267-whole-south-phone')
          out.mkdir(parents=True,exist_ok=True)
          server=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler)
          Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}/v267-three-octagon-original-art-prototype.html'
          with sync_playwright() as pw:
            for engine in ('chromium','webkit'):
              browser=getattr(pw,engine).launch(headless=True)
              photos={}
              for mode in ('default','whole'):
                ctx=browser.new_context(viewport={'width':390,'height':844},
                  device_scale_factor=2,is_mobile=True,has_touch=True)
                page=ctx.new_page();errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto(base+('?southArt=whole' if mode=='whole' else ''),wait_until='load')
                page.wait_for_function(
                  'window.COE && COE.originalMatreiLoaded && COE.sourceRegistered',
                  timeout=90000)
                page.wait_for_timeout(1200)
                assert page.evaluate('COE.nodes')==100
                assert page.evaluate('COE.westSouthConnected')
                assert all(s['pass'] and s['gap']==0 for s in page.evaluate('COE.roadSeams'))
                if mode=='whole':
                  assert page.evaluate('SOUTH_WHOLE_SCENE_PREVIEW') is True
                for join in ('west','south'):
                  page.evaluate(f'COE.focusJoin("{join}")')
                  page.wait_for_timeout(350)
                  path=out/f'{engine}-{mode}-{join}-actual-iphone.png'
                  page.screenshot(path=str(path))
                  photos[(mode,join)]=Image.open(path).convert('RGB')
                page.evaluate('COE.focusJoin("south")')
                page.mouse.move(350,390);page.mouse.down()
                page.mouse.move(40,390,steps=18);page.mouse.up()
                page.wait_for_timeout(300)
                path=out/f'{engine}-{mode}-river-actual-iphone.png'
                page.screenshot(path=str(path))
                photos[(mode,'river')]=Image.open(path).convert('RGB')
                if mode=='whole':
                  page.evaluate('COE.focusJoin("west")')
                  page.touchscreen.tap(195,422)
                  assert page.evaluate('COE.moving')
                  page.evaluate('COE.halt()')
                  assert page.evaluate('COE.marchWestToSouth()')
                  route=page.evaluate('COE.route')
                  assert len(route)==53 and [1536,478] in route and [2002,1024] in route
                  assert page.evaluate('COE.stepToEnd()')==[2806,1629]
                assert not errors,errors
                ctx.close()
              for view in ('west','south','river'):
                sheet=Image.new('RGB',(1560,1740),'#17251d')
                sheet.paste(photos[('default',view)],(0,55))
                sheet.paste(photos[('whole',view)],(780,55))
                d=ImageDraw.Draw(sheet)
                d.text((16,16),'BEFORE: current V267 original',fill='white')
                d.text((796,16),'AFTER: whole SOUTH original-photo candidate - UNAPPROVED',fill='white')
                sheet.save(out/f'{engine}-{view}-actual-before-after.webp',
                  format='WEBP',quality=86,method=6)
              browser.close()
          server.shutdown()
          print('Real mobile Chromium/WebKit screenshots + V123 WEST->MATREI->SOUTH march passed; no visual approval')
          PY
      - name: Verify protected engine graph and art unchanged
        run: |
          python - <<'PY'
          import subprocess
          changed={x[3:] for x in subprocess.check_output(
            ['git','status','--porcelain','-uall'],text=True).splitlines()}
          allowed={'v267-three-octagon-original-art-prototype.html',
            'art-reviews/v267-original-source/south-whole-scene-road-river-composition-unapproved.webp',
            'art-reviews/v267-whole-south-composition-review.md',
            'art-reviews/v267-whole-south-source-before-after.jpg'}
          unexpected={p for p in changed if p not in allowed and
            not p.startswith('art-reviews/v267-whole-south-phone/')}
          assert not unexpected,unexpected
          assert 'art-reviews/v267-original-source/south-whole-scene-road-river-composition-unapproved.webp' in changed
          print('Protected V121 Matrei, V123 graph, V94, sprites, saves and main untouched')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-whole-south-original-art-real-mobile
          path: |
            art-reviews/v267-original-source/south-whole-scene-road-river-composition-unapproved.webp
            art-reviews/v267-whole-south-composition-review.md
            art-reviews/v267-whole-south-source-before-after.jpg
            art-reviews/v267-whole-south-phone/
          retention-days: 14
      - name: Commit actual art and browser screenshots on SAME isolated branch
        run: |
          git config user.name "century-of-empires-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "Branch advanced: keep artifact, do not push stale result."
            exit 0
          fi
          git add v267-three-octagon-original-art-prototype.html \
            art-reviews/v267-original-source/south-whole-scene-road-river-composition-unapproved.webp \
            art-reviews/v267-whole-south-composition-review.md \
            art-reviews/v267-whole-south-source-before-after.jpg \
            art-reviews/v267-whole-south-phone/
          if git diff --cached --quiet; then
            echo "No new source artwork; no version bump."
          else
            git commit -m "Compose full SOUTH original landscape and preserve actual mobile art evidence"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
