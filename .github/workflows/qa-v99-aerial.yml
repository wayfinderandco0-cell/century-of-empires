name: Verify V99 Austrian aerial imagery
on:
  push:
    branches: [terrain-v99-verified-geography]
    paths: ['.github/workflows/qa-v99-aerial.yml']
  workflow_dispatch:
jobs:
  aerial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check official basemap.at orthophoto tile returns a real photograph
        run: |
          python - <<'PY'
          import urllib.request,math,io,sys
          from PIL import Image,ImageStat
          lon,lat,z=11.5219506,47.1298267,17
          n=2**z
          x=int((lon+180)/360*n)
          y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
          url=f'https://mapsneu.wien.gv.at/basemap/bmaporthofoto30cm/normal/google3857/{z}/{y}/{x}.jpeg'
          print('PHOTO_TILE',url,flush=True)
          request=urllib.request.Request(url,headers={'User-Agent':'CenturyOfEmpires V99 geographic verification'})
          with urllib.request.urlopen(request,timeout=25) as response:
            raw=response.read()
            print('TILE_HTTP',response.status,'BYTES',len(raw),flush=True)
          img=Image.open(io.BytesIO(raw)).convert('RGB')
          st=ImageStat.Stat(img)
          print('DIMENSIONS',img.size,'RGB_VARIANCE',st.var,flush=True)
          assert img.size[0]>=256 and img.size[1]>=256
          assert len(raw)>5000 and max(st.var)>100
          print('ORTHOPHOTO PHOTO TILE VERIFIED',flush=True)
          PY
