name: V115 Pannable Map iPhone Browser QA
on:
  push:
    branches: [main]
    paths:
      - "v115-town-pan-controls.html"
      - "scripts/qa_v115_pan.py"
      - ".github/workflows/qa-v115-pan.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - run: python scripts/qa_v115_pan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v115-mobile-browser-qa
          path: qa/v115/
