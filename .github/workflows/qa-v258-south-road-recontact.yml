name: V258 SOUTH Physical Cartway Recontact (PRODUCTION RED)
on:
  push:
    branches:
      - terrain-v258-south-physical-midbend-recontact-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-south-source-pixel-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native-image geometry dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy opencv-python-headless
      - name: Compile actual pixel remap and holdout tests
        run: python -m py_compile scripts/v258_south_road_recontact.py scripts/test_v258_south_road_recontact.py
      - name: Run corrected SOUTH source-pixel holdout regressions
        run: PYTHONPATH=scripts python -m unittest -v scripts/test_v258_south_road_recontact.py
      - name: Fail closed on protected game files
        run: |
          set -euo pipefail
          git rev-parse --verify b29bbf06^{commit}
          git diff --name-only b29bbf06 -- terrain-grid/v123-atlas.js terrain-grid/v121-road-graph.js v121-octagon-1-painted-road.html v94.html index.html | tee /tmp/v258-protected.txt
          test ! -s /tmp/v258-protected.txt
  production-art-approval:
    runs-on: ubuntu-latest
    needs: isolated-south-source-pixel-geometry
    steps:
      - name: Explicitly keep V203 and production approval RED
        run: |
          echo 'SOUTH manual source-road holdout contact improved, not historic or geodetic evidence.'
          echo 'Exact original PNGs are NOT hosted in CI. Four-browser exact V258 art NOT tested.'
          echo 'WEST bridge banks, Matrei border joins, strict V203, human approval remain UNVERIFIED.'
          echo 'Never promote or modify immutable V123 or game saves.'
          exit 1
