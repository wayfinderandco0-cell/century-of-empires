name: V267 original SOUTH northern forest continuity and real phone review
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - scripts/v267_south_original_forest_continuity.py
      - .github/workflows/v267-original-forest-continuity.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v267-original-forest-continuity
  cancel-in-progress: false
jobs:
  art-and-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original artwork compositor and real mobile browsers
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Compose new original SOUTH native conifer forest and Matrei-border material
        run: python scripts/v267_south_original_forest_continuity.py
      - name: Inspect real iPhone-sized Chromium and WebKit scenes and tap-to-march
        run: |
          python - <<'PY'
          from pathlib import Path
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          import base64,json
          out=Path('art-reviews/v267-native-forest-phone')
          out.mkdir(parents=True,exist_ok=True)
          server=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler)
          Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}/v267-three-octagon-original-art-prototype.html'
          results=[]
          with sync_playwright() as pw:
            for engine in ('chromium','webkit'):
              browser=getattr(pw,engine).launch(headless=True)
              photos={}
              for mode in ('default','nativeforest'):
                ctx=browser.new_context(viewport={'width':390,'height':844},
                  device_scale_factor=2,is_mobile=True,has_touch=True)
                page=ctx.new_page();errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto(base+('?southArt=nativeforest' if mode=='nativeforest' else ''),wait_until='load')
                page.wait_for_function('window.COE && COE.originalMatreiLoaded && COE.sourceRegistered',timeout=90000)
                page.wait_for_timeout(1000)
                assert page.evaluate('COE.nodes')==100
                assert page.evaluate('COE.westSouthConnected')
                assert all(s['pass'] and s['gap']==0 for s in page.evaluate('COE.roadSeams'))
                for join in ('west','south'):
                  page.evaluate(f'COE.focusJoin("{join}")')
                  page.wait_for_timeout(400)
                  p=out/f'{engine}-{mode}-{join}-actual-iphone.png'
                  page.screenshot(path=str(p))
                  photos[(mode,join)]=Image.open(p).convert('RGB')
                page.evaluate('COE.focusJoin("south")')
                page.mouse.move(350,390);page.mouse.down()
                page.mouse.move(40,390,steps=18);page.mouse.up()
                page.wait_for_timeout(350)
                p=out/f'{engine}-{mode}-river-actual-iphone.png'
                page.screenshot(path=str(p))
                photos[(mode,'river')]=Image.open(p).convert('RGB')
                if mode=='nativeforest':
                  page.evaluate('COE.focusJoin("west")')
                  page.touchscreen.tap(195,422)
                  assert page.evaluate('COE.moving')
                  page.evaluate('COE.halt()')
                  assert page.evaluate('COE.marchWestToSouth()')
                  route=page.evaluate('COE.route')
                  assert len(route)==53 and [1536,478] in route and [2002,1024] in route
                  assert page.evaluate('COE.stepToEnd()')==[2806,1629]
                assert not errors,errors
                ctx.close()
              for view in ('west','south','river'):
                before=photos[('default',view)];after=photos[('nativeforest',view)]
                sheet=Image.new('RGB',(1560,1740),'#18251d')
                sheet.paste(before,(0,55));sheet.paste(after,(780,55))
                d=ImageDraw.Draw(sheet)
                d.text((12,16),'BEFORE: V267 original SOUTH',fill='white')
                d.text((795,16),'AFTER: independent native forest shoulder - UNAPPROVED',fill='white')
                target=out/f'{engine}-{view}-actual-before-after.webp'
                sheet.save(target,format='WEBP',quality=85,method=6)
                if engine=='webkit':
                  thumb=sheet.resize((780,870))
                  import io
                  b=io.BytesIO();thumb.save(b,'JPEG',quality=78)
                  (out/f'{view}-review-thumbnail.jpg.b64').write_text(base64.b64encode(b.getvalue()).decode())
              results.append({'browser':engine,'viewport':[390,844],
                'actual_browser_screenshots':True,'touch_march':True,
                'original_graph':True,'user_approved':False,'production':False})
              browser.close()
          server.shutdown()
          (out/'review-results.json').write_text(json.dumps(results,indent=2))
          print('Actual iPhone-size Chromium/WebKit and unchanged V123 touch march passed; no visual approval')
          PY
      - name: Ensure source art only and protect V121 V123 V94 engine sprites saves
        run: |
          python - <<'PY'
          import subprocess
          changed={line[3:] for line in subprocess.check_output(
            ['git','status','--porcelain','-uall'],text=True).splitlines()}
          allowed={'v267-three-octagon-original-art-prototype.html',
            'art-reviews/v267-original-source/south-original-forest-continuity-unapproved.webp',
            'art-reviews/v267-original-forest-continuity-review.md',
            'art-reviews/v267-original-forest-continuity-source.jpg'}
          unexpected={p for p in changed if p not in allowed and
            not p.startswith('art-reviews/v267-native-forest-phone/')}
          assert not unexpected,unexpected
          assert 'art-reviews/v267-original-source/south-original-forest-continuity-unapproved.webp' in changed
          print('Only isolated original source art, review evidence and preview selection changed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-native-forest-original-source-and-actual-mobile
          path: |
            art-reviews/v267-original-source/south-original-forest-continuity-unapproved.webp
            art-reviews/v267-original-forest-continuity-review.md
            art-reviews/v267-original-forest-continuity-source.jpg
            art-reviews/v267-native-forest-phone/
          retention-days: 14
      - name: Commit substantive artwork and actual mobile evidence on SAME V267 branch
        run: |
          git config user.name "century-of-empires-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "Branch advanced; keep artifact and do not push stale candidate."
            exit 0
          fi
          git add v267-three-octagon-original-art-prototype.html \
            art-reviews/v267-original-source/south-original-forest-continuity-unapproved.webp \
            art-reviews/v267-original-forest-continuity-review.md \
            art-reviews/v267-original-forest-continuity-source.jpg \
            art-reviews/v267-native-forest-phone/
          if git diff --cached --quiet; then
            echo "No new art; no version bump."
          else
            git commit -m "Compose SOUTH independent native forest shoulder and real phone review"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
