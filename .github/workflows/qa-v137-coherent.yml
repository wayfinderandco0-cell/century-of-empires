name: V137/V139 Continuous Alpine Mobile QA
on:
  push:
    branches: [terrain-v138-coherent-boot-ci-20261023, terrain-v139-neighbor-detail-20261023, terrain-v140-geographic-relief-prototype-20261023]
    paths:
      - 'v137-coherent-alpine-preview.html'
      - 'scripts/qa_v137_coherent.py'
      - 'scripts/test_v138_matrei_mask.js'
      - '.github/workflows/qa-v137-coherent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alpine-iphone-regression:
    runs-on: ubuntu-latest
    # Match proven V134 Chromium/WebKit setup; avoid apt dependency downloads.
    container: mcr.microsoft.com/playwright/python:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/test_v138_matrei_mask.js
      - run: python -m pip install playwright==1.64.1 pillow==12.0.0
      - run: python scripts/qa_v137_coherent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v137-chromium-webkit-iphone-landscape-portrait
          path: qa/v137-clean/
