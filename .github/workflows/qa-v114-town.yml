name: V114 iPhone Town Coverage QA
on:
  push:
    branches: [main]
    paths:
      - "v114-town-camera-bridge-safety.html"
      - "scripts/qa_v114_town.py"
      - ".github/workflows/qa-v114-town.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - run: python scripts/qa_v114_town.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v114-portrait-landscape-proof
          path: qa/v114/
