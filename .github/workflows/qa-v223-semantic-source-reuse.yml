name: V223 Semantic Source Reuse (V222 ART REJECTED)
on:
  push:
    branches: ['terrain-v223-semantic-source-reuse-gate-20261026']
  workflow_dispatch:
concurrency:
  group: v223-semantic-source-reuse
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  original-source-motif-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy
      - name: Protect original Matrei painting and V123 movement graph
        run: |
          git hash-object v121-octagon-1-painted-road.html | grep '^4c6aa5cda9e7c359b6d2a49d5b5fe8a597346382$'
          git hash-object terrain-grid/v123-atlas.js | grep '^09f04b4062e24fbacbb645307462cdddce2b2aa3$'
      - name: Test independent source versus overlapping shifted crops, and reject V222
        run: |
          python -m py_compile scripts/qa_v223_semantic_source_reuse.py scripts/test_v223_semantic_source_reuse.py
          python scripts/test_v223_semantic_source_reuse.py
          python scripts/qa_v223_semantic_source_reuse.py --out qa/v223-source-reuse
          python -c "import json; r=json.load(open('qa/v223-source-reuse/report.json')); assert r['status']=='REJECTED_OVERLAPPING_SOURCE_MOTIFS' and r['sourceReuseFraction']>0.5 and not r['humanArtApproved']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v223-source-reuse-proof-V222-rejected
          path: qa/v223-source-reuse/
          retention-days: 7
  existing-four-browser-game-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium webkit
      - name: Original road bridge army camera and segment tap tests
        run: |
          python scripts/qa_v137_coherent.py
          python scripts/qa_v202_road_segment_taps.py
      - name: Inspect original unchanged V222 phone rendering as negative art control
        run: python scripts/qa_v222_painted_game_art.py
      - name: Preserve strict V203 photographic microstructure thresholds
        run: python scripts/qa_v203_canopy_structure.py --screenshots qa/v222-original-painting-game-art --output qa/v223-strict-v203 --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v223-four-browser-actual-phone-V222-negative-control
          path: |
            qa/v137-clean/
            qa/v202-road-segment-taps/
            qa/v222-original-painting-game-art/
            qa/v223-strict-v203/
          retention-days: 7
  visual-acceptance-stays-red:
    needs: [original-source-motif-reuse, existing-four-browser-game-regressions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require independent visual acceptance (not available)
        run: |
          python - <<'PY'
          import json
          m=json.load(open('terrain-v222/assets/manifest.json'))
          assert m['gameArtApproved'] is True and m['physicalIPhoneApproved'] is True, (
              'V223 ART RED: V222 reused Matrei motifs; no user-approved WEST/SOUTH art'
          )
          PY
