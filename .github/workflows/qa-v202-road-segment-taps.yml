name: V202 Segment-Safe Road Taps and Original Terrain QA
on:
  push:
    branches: ['terrain-v202-road-segment-tap-safety-20261025']
    paths:
      - 'v192-weathered-cartways-graphics-test.html'
      - 'scripts/qa_v202_road_segment_taps.py'
      - '.github/workflows/qa-v202-road-segment-taps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v202-segment-safe-road-taps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free browser QA dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium webkit
      - name: Preserve immutable V123 painted road pixel checks
        run: python scripts/qa_v194_cartway_pigment.py
      - name: Preserve road crossing, halt and route geometry
        run: python scripts/qa_v192_cartways.py
      - name: Preserve strict three-center image detail gate
        run: python scripts/qa_v192_terrain_parity.py --capture --enforce
      - name: Preserve mobile camera coverage and anchored pinch
        run: python scripts/qa_v193_camera_coverage.py
      - name: Preserve static landscape caching during army motion
        run: python scripts/qa_v196_integrated_cache.py
      - name: Preserve real pan and pinch static cache invalidation
        run: python scripts/qa_v201_touch_camera_cache.py
      - name: Verify V202 closest painted road segment tap and terminal safety
        run: python scripts/qa_v202_road_segment_taps.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v202-road-segment-tap-and-visual-evidence
          path: |
            qa/v194-cartway-material/
            qa/v192-road-graphics/
            qa/v192-three-centers/
            qa/v193-camera-coverage/
            qa/v196-integrated-cache/
            qa/v201-touch-camera-cache/
            qa/v202-road-segment-taps/
          retention-days: 7
