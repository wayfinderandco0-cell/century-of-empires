name: V267 east original-ridge riparian art candidate
on:
  push:
    branches:
      - terrain-v267-three-original-art-prototype-20261028
    paths:
      - scripts/v267_east01_riparian.py
      - .github/workflows/v267-east01-riparian.yml
  workflow_dispatch:
concurrency:
  group: v267-east01-riparian-art
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  compose-original-ridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local open-source image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Compose V267 original-ridge river continuity candidate
        run: python scripts/v267_east01_riparian.py
      - name: Verify candidate dimensions, uniqueness, and honest status
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, hashlib
          p=Path("terrain-grid/v267-original-art-batch-01")
          out=p/"matrei-east-riparian-v3.webp"
          ref=p/"matrei-east-ridge.webp"
          evidence=json.loads((p/"matrei-east-riparian-v3-evidence.json").read_text())
          assert Image.open(out).size==(1536,1024)
          assert Image.open(p/"matrei-east-riparian-v3-comparison.webp").size==(3072,1024)
          assert Image.open(p/"matrei-east-riparian-v3-thumb.webp").size==(1024,341)
          assert hashlib.sha256(out.read_bytes()).hexdigest()!=hashlib.sha256(ref.read_bytes()).hexdigest()
          assert evidence["roadPorts"]==[] and not evidence["roadsVerified"]
          assert not evidence["riverSeamVerified"] and not evidence["finished"]
          print("PASS: unique image, native dimensions, road-free, unapproved")
          PY
      - name: Commit actual candidate image and comparison to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-grid/v267-original-art-batch-01/matrei-east-riparian-v3.webp
          git add terrain-grid/v267-original-art-batch-01/matrei-east-riparian-v3-comparison.webp
          git add terrain-grid/v267-original-art-batch-01/matrei-east-riparian-v3-thumb.webp
          git add terrain-grid/v267-original-art-batch-01/matrei-east-riparian-v3-evidence.json
          if git diff --cached --quiet; then
            echo "Generated art already up to date"
          else
            git commit -m "Add actual V267 EAST-01 riparian original-ridge art candidate and comparison"
            git fetch origin terrain-v267-three-original-art-prototype-20261028
            git rebase origin/terrain-v267-three-original-art-prototype-20261028
            git push origin HEAD:terrain-v267-three-original-art-prototype-20261028
          fi
