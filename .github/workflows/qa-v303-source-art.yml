name: V303 50-Tile Pinned Terrain iPhone QA
on:
  push:
    branches: [gameplay-v303-pinned-50-source-art-20261103]
  pull_request:
    paths:
      - 'v303-50-octagon-playtest.html'
      - 'terrain-grid/art/**'
      - 'scripts/qa_v303_sources.py'
      - '.github/workflows/qa-v303-source-art.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-50-terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mobile-size browser engines
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Verify images, connected graph and army route
        run: python scripts/qa_v303_sources.py
      - name: Save actual iPhone-sized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v303-50-tile-iphone
          path: qa/v303/
