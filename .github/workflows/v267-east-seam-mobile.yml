name: V267 east seam mobile visual QA
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - 'v267-east-seam-inspector.html'
      - 'scripts/test_v267_east_seam_inspector.py'
      - '.github/workflows/v267-east-seam-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebKit and Pillow
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow
          python -m playwright install --with-deps webkit
      - name: Verify real iPhone viewport pixels and controls
        run: python scripts/test_v267_east_seam_inspector.py
      - name: Preserve actual screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v267-east-seam-iphone-qa
          path: |
            terrain-grid/v267-original-art-batch-01/actual-webkit-iphone-east-seam-inspector.png
            terrain-grid/v267-original-art-batch-01/actual-webkit-iphone-east-seam-v2.png
          if-no-files-found: ignore
      - name: Commit actual WebKit screenshots on development branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "terrain-v267-three-original-art-prototype-20261028"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-grid/v267-original-art-batch-01/actual-webkit-iphone-east-seam-inspector.png
          git add terrain-grid/v267-original-art-batch-01/actual-webkit-iphone-east-seam-v2.png
          if ! git diff --cached --quiet; then
            git commit -m "Save actual 390x844 WebKit screenshots of V267 east seam V2"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
