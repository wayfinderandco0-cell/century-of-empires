name: V225 Graph-Locked Ground Contact (ART NOT APPROVED) (ART NOT APPROVED)
on:
  push:
    branches: ['terrain-v225-cc0-oblique-scene-trial-20261026']
  workflow_dispatch:
concurrency:
  group: v225-licensed-oblique
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  licensed-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Protect original Matrei painting and immutable V123 graph
        run: |
          git hash-object v121-octagon-1-painted-road.html | grep '^4c6aa5cda9e7c359b6d2a49d5b5fe8a597346382$'
          git hash-object terrain-grid/v123-atlas.js | grep '^09f04b4062e24fbacbb645307462cdddce2b2aa3$'
      - name: Reproduce native crops and verify licenses, sources, modern roads, negative controls
        run: |
          python scripts/v224_licensed_oblique_cells.py --verify
          python scripts/test_v224_licensed_oblique_cells.py
  existing-four-browser-game-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pillow playwright numpy
          python -m playwright install --with-deps chromium webkit
      - name: Original V137 and V202 road, bridge, army, camera, and 24-segment taps
        run: |
          python scripts/qa_v137_coherent.py
          python scripts/qa_v202_road_segment_taps.py
      - name: Capture actual V225 four-config phone rendering and original Matrei parity
        run: python scripts/qa_v225_ground_contact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v225-four-browser-actual-phone-art-NOT-approved
          path: |
            qa/v137-clean/
            qa/v202-road-segment-taps/
            qa/v225-ground-contact/
          retention-days: 7
  strict-v203-art-quality:
    needs: existing-four-browser-game-regressions
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy
      - uses: actions/download-artifact@v4
        with:
          name: v225-four-browser-actual-phone-art-NOT-approved
          path: qa
      - name: Unchanged fail-closed V203 photographic microstructure
        run: python scripts/qa_v203_canopy_structure.py --screenshots qa/v225-ground-contact --output qa/v225-strict-v203 --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v225-strict-v203-evidence
          path: qa/v225-strict-v203/
          retention-days: 7
  human-art-acceptance-stays-red:
    needs: [licensed-source-integrity,existing-four-browser-game-regressions,strict-v203-art-quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Never infer production approval from source or numeric tests
        run: |
          python - <<'PY'
          import json
          m=json.load(open('terrain-v224/assets/manifest.json'))
          assert m['gameArtApproved'] is True and m['physicalIPhoneApproved'] is True and m['bridgeBanksVerified'] is True, (
            'V225 ART RED: modern source road, no independently verified V123 tiepoints, no user visual acceptance'
          )
          PY
