name: V248 Native Cartway Pixel Inspection (ART RED)
on:
  push:
    branches: ['terrain-v248-native-cartway-inspection-mode-20261027']
  workflow_dispatch:
concurrency:
  group: v248-native-cartway-review
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-road-review-and-four-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local browser/image QA dependencies
        run: |
          python -m pip install pillow numpy playwright
          python -m playwright install --with-deps chromium webkit
      - name: V248 source pixel mode, syntax and immutable V123 regression
        run: |
          node scripts/test_v248_native_cartway_review.js
          node scripts/test_v242_photo_art_import.js
          node scripts/test_v227_art_ingest.js
          python -m py_compile scripts/qa_v248_native_cartway_review.py
      - name: Real Chromium/WebKit portrait/landscape native road versus playable route screenshots
        run: python scripts/qa_v248_native_cartway_review.py
      - name: Unchanged strict V203 visual gate (diagnostic; never art approval)
        continue-on-error: true
        run: python scripts/qa_v203_canopy_structure.py --screenshots qa/v248-native-road-review --output qa/v248-strict-v203 --enforce
      - name: Preserve actual browser screenshots and metrics for human inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v248-actual-four-browser-native-road-UNAPPROVED
          path: |
            qa/v248-native-road-review/
            qa/v248-strict-v203/
          retention-days: 14
      - name: Keep production RED without source registration, real period roads, bank proof and user approval
        if: always()
        run: |
          echo "V248 only separates original native pixels from overpainted playable routes."
          echo "The fixtures are rejected; no new photo-grade WEST/SOUTH pair, historical registration or human approval."
          exit 1
