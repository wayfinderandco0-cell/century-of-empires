name: V247 rejected endpoint-retouch art experiment (production RED)
on:
  push:
    branches: [terrain-v247-rejected-endpoint-retouch-study-20261027]
  workflow_dispatch:
jobs:
  endpoint-art-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local image-processing dependencies
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Compile and run pixel-preservation / negative controls
        run: |
          python -m py_compile scripts/v247_endpoint_art_repair.py scripts/test_v247_endpoint_art_repair.py
          python -m unittest discover -s scripts -p 'test_v247_endpoint_art_repair.py' -v
      - name: Generate explicitly synthetic negative-art screenshot
        run: |
          mkdir -p qa/v247
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image,ImageDraw
          p=Path('qa/v247/source.png')
          im=Image.new('RGB',(1536,1024),(72,111,64))
          d=ImageDraw.Draw(im)
          d.line([(0,525),(130,531),(275,540),(500,535),(1000,520),(1535,478)],fill=(144,107,64),width=30)
          im.save(p)
          m={'originalSha256':hashlib.sha256(p.read_bytes()).hexdigest(),
             'sourceKind':'fictional-generated-art-study',
             'sourceAttribution':'CI SYNTHETIC PIXELS ONLY; NOT REAL ART',
             'annotationMethod':'manual-original-pixel-visible-road-trace',
             'fullVisibleRoadPoints':[[0,525],[130,531],[275,540],[500,535],[1000,520],[1535,478]],
             'playableStartIndex':2,'playableEndIndex':5}
          Path('qa/v247/manifest.json').write_text(json.dumps(m))
          PY
          python scripts/v247_endpoint_art_repair.py --image qa/v247/source.png --manifest qa/v247/manifest.json --out qa/v247/diagnostic
      - name: Upload actual generated synthetic screenshot and provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v247-REJECTED-synthetic-endpoint-repair-NOT-GAME-ART
          path: qa/v247/diagnostic/
      - name: PRODUCTION RED — visually rejected actual WEST/SOUTH retouches
        run: |
          echo "Original fictional WEST and SOUTH studies were visually inspected outside CI."
          echo "Endpoint inpainting creates unnatural seams. No playable art, source registration or approval."
          exit 1
