name: V267 original SOUTH gorge registration — actual mobile review
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - scripts/v267_south_gorge_river_registration.py
      - .github/workflows/v267-gorge-river-registration.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v267-original-gorge-registration
  cancel-in-progress: false
jobs:
  build-real-art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photographic tools and actual mobile browsers
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Reconstruct local riverbank and stage only opt-in candidate
        run: python scripts/v267_south_gorge_river_registration.py
      - name: Capture actual iPhone-size before/after and test unchanged V123 march
        run: |
          python - <<'PY'
          from pathlib import Path
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          out=Path('art-reviews/v267-gorge-river-phone')
          out.mkdir(parents=True,exist_ok=True)
          server=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler)
          Thread(target=server.serve_forever,daemon=True).start()
          url=f'http://127.0.0.1:{server.server_port}/v267-three-octagon-original-art-prototype.html'
          with sync_playwright() as pw:
            for engine in ('webkit','chromium'):
              browser=getattr(pw,engine).launch(headless=True)
              images=[]
              river_images=[]
              for mode in ('river','gorge'):
                ctx=browser.new_context(viewport={'width':390,'height':844},
                  device_scale_factor=2,is_mobile=True,has_touch=True)
                page=ctx.new_page()
                errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto(url+'?southArt='+mode,wait_until='load')
                page.wait_for_function(
                  'window.COE && COE.originalMatreiLoaded && COE.sourceRegistered',
                  timeout=90000)
                assert page.evaluate('COE.nodes')==100
                assert page.evaluate('COE.westSouthConnected')
                assert all(s['pass'] and s['gap']==0
                  for s in page.evaluate('COE.roadSeams'))
                page.wait_for_timeout(950)
                page.evaluate('COE.focusJoin("south")')
                page.wait_for_timeout(600)
                page.evaluate('COE.focusJoin("south")')
                page.wait_for_timeout(400)
                p=out/f'{engine}-{mode}-actual-iphone.png'
                page.screenshot(path=str(p))
                images.append(Image.open(p).convert('RGB'))
                # Inspect the ACTUAL riverbank seam 483 world pixels east of
                # the fixed road junction, not only the unchanged x466 road.
                # At 390px portrait zoom 5.7, a 310px drag pans ~480 world px.
                page.mouse.move(350,390)
                page.mouse.down()
                page.mouse.move(40,390,steps=18)
                page.mouse.up()
                page.wait_for_timeout(650)
                rp=out/f'{engine}-{mode}-river-seam-actual-iphone.png'
                page.screenshot(path=str(rp))
                river_images.append(Image.open(rp).convert('RGB'))
                if mode=='gorge':
                  page.evaluate('COE.focusJoin("west")')
                  page.touchscreen.tap(195,422)
                  assert page.evaluate('COE.moving')
                  page.evaluate('COE.halt()')
                  assert page.evaluate('COE.marchWestToSouth()')
                  route=page.evaluate('COE.route')
                  assert len(route)==53 and [1536,478] in route and [2002,1024] in route
                  assert page.evaluate('COE.stepToEnd()')==[2806,1629]
                assert not errors,errors
                ctx.close()
              sheet=Image.new('RGB',(1560,1740),'#1c211d')
              sheet.paste(images[0],(0,55));sheet.paste(images[1],(780,55))
              d=ImageDraw.Draw(sheet)
              d.text((12,18),'BEFORE: native river photo - UNAPPROVED',fill='white')
              d.text((792,18),'AFTER: registered upper gorge - UNAPPROVED',fill='white')
              sheet.save(out/f'{engine}-same-camera-before-after.jpg',quality=88)
              # Separate eyes-on RIVER comparison; previous join sheet
              # centered on the road and concealed the actual gorge defect.
              river_sheet=Image.new('RGB',(1560,1740),'#1c211d')
              river_sheet.paste(river_images[0],(0,52))
              river_sheet.paste(river_images[1],(780,52))
              rd=ImageDraw.Draw(river_sheet)
              rd.text((10,18),'BEFORE: SOUTH original river - UNAPPROVED',fill='white')
              rd.text((790,18),'AFTER: reconstructed river throat - UNAPPROVED',fill='white')
              river_sheet.save(out/f'{engine}-river-seam-actual-before-after.webp',
                               format='WEBP',quality=85,method=6)
              browser.close()
          server.shutdown()
          print('Actual Chromium and WebKit 390x844 DPR2 screenshots + V123 touchscreen march passed; artwork NOT visually approved')
          PY
      - name: Protect Matrei, graph, V94, sprites, saves and main
        run: |
          python - <<'PY'
          import subprocess
          names={line[3:] for line in subprocess.check_output(
            ['git','status','--porcelain','-uall'],text=True).splitlines()}
          allowed={'v267-three-octagon-original-art-prototype.html',
            'art-reviews/v267-original-source/south-gorge-river-registered-unapproved.webp',
            'art-reviews/v267-gorge-river-registration-review.md'}
          bad={p for p in names if p not in allowed and
            not p.startswith('art-reviews/v267-gorge-river-phone/')}
          assert not bad,bad
          assert ('art-reviews/v267-original-source/south-gorge-river-registered-unapproved.webp' in names or\n            any(p.endswith('-river-seam-actual-before-after.webp') for p in names)), names
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-upper-gorge-actual-phone-review
          path: |
            art-reviews/v267-original-source/south-gorge-river-registered-unapproved.webp
            art-reviews/v267-gorge-river-registration-review.md
            art-reviews/v267-gorge-river-phone/
          retention-days: 14
      - name: Commit source artwork and actual browser screenshots only
        run: |
          git config user.name "century-of-empires-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "Branch advanced; preserve artifact without stale push."
            exit 0
          fi
          git add v267-three-octagon-original-art-prototype.html \
            art-reviews/v267-original-source/south-gorge-river-registered-unapproved.webp \
            art-reviews/v267-gorge-river-registration-review.md \
            art-reviews/v267-gorge-river-phone/
          if git diff --cached --quiet; then
            echo "No new artwork; skip commit."
          else
            git commit -m "Register SOUTH upper gorge river artwork and actual iPhone-size review"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
