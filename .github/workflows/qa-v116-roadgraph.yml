name: V116 Road-Graph Actual-Art Browser QA
on:
  push:
    branches: [terrain-v116-hour7-roadgraph-proof]
    paths:
      - "scripts/v116_road_graph.js"
      - "tests/test_v116_road_graph.js"
      - "v116-shared-roadgraph-army-proof.html"
      - "scripts/qa_v116_road_graph_browser.py"
      - ".github/workflows/qa-v116-roadgraph.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  roadgraph-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Reusable road-graph invariant tests
        run: node --test tests/test_v116_road_graph.js
      - name: Existing V116 graph/renderer regression tests
        run: node tests/test_v116_renderer.js
      - name: Browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Actual-art portrait/landscape browser QA
        run: python scripts/qa_v116_road_graph_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v116-actual-painting-bridge-screenshots
          path: qa/v116/
