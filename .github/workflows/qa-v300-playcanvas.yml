name: V300 PlayCanvas 3D Gameplay QA
on:
  push:
    branches: [main]
    paths:
      - 'v300-playcanvas-3d.html'
      - 'terrain-playcanvas/**'
      - 'scripts/qa_v300_playcanvas.py'
      - '.github/workflows/qa-v300-playcanvas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-3d-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - run: python scripts/qa_v300_playcanvas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v300-playcanvas-mobile-screenshots
          path: qa/v300-playcanvas/
