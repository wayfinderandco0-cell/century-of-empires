name: V267 exact original-art mobile review (UNAPPROVED)
on:
  push:
    branches:
      - terrain-v267-three-original-art-prototype-20261028
    paths:
      - v267-three-octagon-original-art-prototype.html
      - scripts/v267_actual_art_browser_review.py
      - .github/workflows/v267-exact-art-mobile-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-art-browser-review:
    name: ${{ matrix.browser }} / ${{ matrix.orientation }} / exact embedded art
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        orientation: [portrait, landscape]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify immutable production sources are unchanged
        run: |
          git fetch --no-tags --depth=1 origin main
          # The earlier isolated opt-in index is pinned, not falsely
          # rejected by comparing the entire branch against main.
          actual_index=$(git rev-parse HEAD:index.html)
          expected_index=bebb8717b7a8dd8891f4a9bbc15541418f21dac1
          if [ "$actual_index" != "$expected_index" ]; then
            echo "Isolated V94 shell/index changed unexpectedly: $actual_index"
            exit 1
          fi
          # Compare immutable V121/V123/V94 sources and sprites/saves with main.
          changed=$(git diff --name-only origin/main HEAD -- 'v121-*' 'v122-*' 'v123-*' 'v94-*' 'assets/**' 'saves/**')
          if [ -n "$changed" ]; then
            printf '%s\\n' "$changed"
            echo 'Protected game/source files changed: production gate RED.'
            exit 1
          fi
          echo 'Pinned opt-in index and protected source files unchanged; still UNAPPROVED.'
      - name: Run real artwork browser review (NOT production approval)
        run: |
          python scripts/v267_actual_art_browser_review.py \
            --browser ${{ matrix.browser }} \
            --orientation ${{ matrix.orientation }} \
            --out art-reviews/v267-actual-browser
      - name: Preserve actual mobile screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v267-actual-${{ matrix.browser }}-${{ matrix.orientation }}
          path: art-reviews/v267-actual-browser/
          if-no-files-found: warn
          retention-days: 14
