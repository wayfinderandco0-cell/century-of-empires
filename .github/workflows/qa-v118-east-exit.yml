name: V118 One-Octagon East-Exit QA
on:
  push:
    branches: [terrain-v117-road-art-contract]
    paths:
      - "scripts/v118_east_connector.js"
      - "tests/test_v118_east_connector.js"
      - "v118-connected-bridge-exit.html"
      - "scripts/qa_v118_east_exit_browser.py"
      - ".github/workflows/qa-v118-east-exit.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  one-octagon-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Unit movement / painted exit geometry
        run: node --test tests/test_v116_road_graph.js tests/test_v117_road_art_contract.js tests/test_v118_east_connector.js
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Four real mobile browser cases and screenshots
        run: python scripts/qa_v118_east_exit_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v118-mobile-bridge-to-east-exit
          path: qa/v118/
