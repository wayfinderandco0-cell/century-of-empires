name: V170 terrain edge blend iPhone QA
on:
  push:
    branches: [terrain-v170-photo-edge-transition-20261024]
    paths:
      - 'v170-terrain-transition-test.html'
      - 'scripts/qa_v170_transition.py'
      - '.github/workflows/qa-v170-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-terrain-transition:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve original painted Matrei roads and three-octagon graph
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const pins={
            'v121-octagon-1-painted-road.html':'4c6aa5cda9e7c359b6d2a49d5b5fe8a597346382',
            'terrain-grid/v123-atlas.js':'09f04b4062e24fbacbb645307462cdddce2b2aa3'
          };
          for(const [path,pin] of Object.entries(pins)){
            const bytes=fs.readFileSync(path);
            const got=crypto.createHash('sha1').update(Buffer.concat([
              Buffer.from('blob '+bytes.length),Buffer.from([0]),bytes
            ])).digest('hex');
            assert.equal(got,pin,'Original game/source drift: '+path);
          }
          console.log('Original V121 painted roads and V123 topology unchanged');
          NODE
      - name: Install QA dependencies
        run: python -m pip install playwright==1.64.1 pillow==12.0.0
      - name: Verify new iPhone playable preview in Chromium and WebKit
        run: python scripts/qa_v170_transition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v170-iphone-playable-3-octagon-screenshots-NOT-approved-art
          path: qa/v170-mobile/
          retention-days: 7
