name: V269 native four-cell terrain movement proof
on:
  push:
    branches: [terrain-v269-four-cell-exploration-20261102]
    paths:
      - .github/workflows/v269-four-cell-motion.yml
      - terrain-grid/v269-exploration.js
      - terrain-grid/v268-matrei-native.js
      - terrain-grid/atlas-integrated.js
      - scripts/qa_v269_exploration.py
      - index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-webkit-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser code syntax
        run: |
          node --check terrain-grid/v269-exploration.js
          node --check terrain-grid/v268-matrei-native.js
          node --check terrain-grid/atlas-integrated.js
          python -m py_compile scripts/qa_v269_exploration.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine mobile WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps webkit
      - name: Test FOUR V268 source ground cells and real cross-boundary V269 army animation
        run: python scripts/qa_v269_exploration.py
      - name: Preserve actual iPhone browser screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v269-real-webkit-cross-cell-proof
          path: generated/v269-qa/
          retention-days: 14

  public-preview-http:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm SHA-pinned public browser preview serves exact V269 and four geographic images
        run: |
          python - <<'PY'
          import json,urllib.request,time
          # Pin to the tested implementation so a changing branch cannot silently substitute another build.
          base='https://raw.githack.com/wayfinderandco0-cell/century-of-empires/4d58b57a60935452a405e78a6a24d923cd5cac5a'
          paths=['/index.html?v268Geo=1&v269Explore=1&autoOpen=1',
                 '/terrain-grid/v269-exploration.js',
                 '/terrain-grid/v268-matrei-geographic/manifest.json']
          error=None
          for attempt in range(4):
            try:
              result={}
              for path in paths:
                with urllib.request.urlopen(base+path,timeout=25) as r:
                  if r.status!=200:raise RuntimeError(path+' HTTP '+str(r.status))
                  result[path]=r.read()
              html=result[paths[0]].decode()
              assert 'v269-exploration.js' in html and 'v268-matrei-native.js' in html
              manifest=json.loads(result[paths[2]])
              assert len(manifest['cells'])==4
              assert manifest['newNativePlayable']==0
              for c in manifest['cells']:
                with urllib.request.urlopen(base+'/terrain-grid/v268-matrei-geographic/'+c['artWebp'],timeout=25) as r:
                  assert r.status==200 and len(r.read())>5000
              print('PASS: independent public HTTPS preview serves exact SHA-pinned V269 code and four real source-ground images')
              break
            except Exception as e:
              error=e
              print('External preview attempt',attempt+1,repr(e))
              time.sleep(5)
          else:raise RuntimeError('Public preview NOT verified: '+repr(error))
          PY
