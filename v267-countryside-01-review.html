<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Century of Empires — new countryside art candidate</title><style>
html,body{margin:0;width:100%;height:100%;background:#132019;color:#e6d6b3;font:14px system-ui;overflow:hidden}
header,footer{position:fixed;z-index:3;left:0;right:0;background:#0c1a16e8;border-bottom:1px solid #bba16c;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
header{top:0}footer{bottom:0;border-top:1px solid #bba16c;border-bottom:0;line-height:1.35}
button{background:#1b392e;color:#f7e6c2;border:1px solid #ab9366;border-radius:7px;min-height:40px;min-width:44px}
#viewport{position:absolute;inset:55px 0 64px;overflow:hidden;touch-action:none}
#scene{position:absolute;left:50%;top:50%;width:min(95vw,1152px);transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
#scene img{width:100%;height:auto;display:block}
small{color:#c3b69b}strong{font-family:Georgia,serif;font-size:16px}
</style></head><body><header><div><strong>Century of Empires · Countryside-01</strong><br><small>NEW original layered art candidate · NOT approved or playable</small></div><div><button id="minus">−</button><button id="plus">+</button><button id="fit">Fit</button></div></header>
<div id="viewport"><div id="scene"><img alt="New original forested alpine meadow, rock slopes and conifers, no roads or villages" src="terrain-grid/v267-countryside-original/forest-meadow-01.svg"></div></div>
<footer><span>1536 × 1024 vector master · no roads, towns or historic claims. Pan with one finger; pinch to zoom. Original WEST/MATREI/SOUTH unchanged.</span></footer>
<script>"use strict";const scene=document.getElementById("scene"),v=document.getElementById("viewport");let z=1,x=0,y=0,points=new Map(),last=null;function draw(){scene.style.transform="translate(calc(-50% + "+x+"px),calc(-50% + "+y+"px)) scale("+z+")"}function zoom(f){z=Math.min(6,Math.max(.35,z*f));draw()}document.getElementById("plus").onclick=()=>zoom(1.25);document.getElementById("minus").onclick=()=>zoom(.8);document.getElementById("fit").onclick=()=>{z=1;x=0;y=0;draw()};v.addEventListener("pointerdown",e=>{v.setPointerCapture(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);last=null});v.addEventListener("pointermove",e=>{if(!points.has(e.pointerId))return;const old=points.get(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size===1){x+=e.clientX-old[0];y+=e.clientY-old[1]}else if(points.size===2){const q=[...points.values()],dist=Math.hypot(q[0][0]-q[1][0],q[0][1]-q[1][1]);if(last)z=Math.min(6,Math.max(.35,z*dist/last));last=dist}draw()});for(const ev of ["pointerup","pointercancel","lostpointercapture"])v.addEventListener(ev,e=>{points.delete(e.pointerId);last=null});v.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY>0?.9:1.1)},{passive:false});draw();</script></body></html>
