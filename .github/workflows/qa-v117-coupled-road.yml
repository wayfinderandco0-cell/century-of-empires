name: V117 Coupled Road Art Browser QA
on:
  push:
    branches: [terrain-v117-road-art-contract]
    paths:
      - "scripts/v117_road_art_contract.js"
      - "tests/test_v117_road_art_contract.js"
      - "v117-coupled-cart-road-proof.html"
      - "scripts/qa_v117_road_art_browser.py"
      - ".github/workflows/qa-v117-coupled-road.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  coupled-road-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Source art and army path regression tests
        run: node --test tests/test_v117_road_art_contract.js
      - name: Existing road-graph regression tests
        run: node --test tests/test_v116_road_graph.js tests/test_v116_route_tile_trace.js
      - name: Install browser engines
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Actual-art mobile browser and screenshots
        run: python scripts/qa_v117_road_art_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v117-coupled-road-portrait-landscape
          path: |
            qa/v117/
            v117-coupled-cart-road-proof.html
