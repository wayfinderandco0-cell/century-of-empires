name: V184 Matrei Brenner continuous modern SOURCE overview — NOT GAME ART
on:
  push:
    branches: [terrain-v184-matrei-brenner-overview-20261025]
    paths:
      - 'scripts/v184_matrei_brenner_overview.py'
      - 'scripts/test_v184_matrei_brenner_overview.py'
      - '.github/workflows/qa-v184-matrei-brenner-overview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geographic-overview-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Preserve historic registration and anchor guards
        run: |
          node scripts/test_v172_registration.js
          node scripts/test_v178_geographic_crosswalk.js
          node scripts/test_v179_real_landmark_coverage.js
          python scripts/test_v180_matrei_source.py
          python scripts/test_v183_brenner_pass_source.py
      - name: Test exact source geometry and fail-closed claims
        run: python scripts/test_v184_matrei_brenner_overview.py
      - name: Acquire complete 60-tile modern geographic overview
        run: |
          python scripts/v184_matrei_brenner_overview.py --download
          python scripts/v184_matrei_brenner_overview.py --verify
      - name: Enforce continuous observed SOURCE coverage without historical claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('qa/v184-matrei-brenner-overview/manifest.json').read_text())
          assert len(m['samples'])==60
          assert len({s['sha256'] for s in m['samples']})==60
          assert m['seamDiagnostics']['horizontalTilePairs']==48
          assert m['seamDiagnostics']['verticalTilePairs']==55
          assert m['seamDiagnostics']['nativeRasterFullyObserved'] is True
          assert m['seamDiagnostics']['gameArtSeamApproved'] is False
          assert m['doesNotProveHistoricalOrTraversableRoadCorridor'] is True
          assert all(m[k] is False for k in ('sourceSectorsAreGameOctagons',
              'v121ToGeographyRegistered','v123RoadsGeoregistered',
              'historicalRoadsVerified','bridgeBanksVerified',
              'historic1780Certified','periodArtComplete',
              'physicalIPhoneApproved','productionApproved'))
          print('60 continuous modern SOURCE tiles; no historical/game claims')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v184-60tile-modern-geographic-overview-NOT-GAME-ART
          path: qa/v184-matrei-brenner-overview/
          retention-days: 7
