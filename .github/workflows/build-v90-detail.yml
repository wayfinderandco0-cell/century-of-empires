name: Build V90 central-Europe close-zoom DEM

on:
  push:
    paths:
      - 'scripts/build_v90_central_detail.py'
      - '.github/workflows/build-v90-detail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install terrain analysis packages
        run: python -m pip install numpy Pillow requests
      - name: Build registered terrain directly from higher-resolution measurements
        run: python scripts/build_v90_central_detail.py
      - name: Validate geographic detail output
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          p='terrain-detail/central-europe-v90.webp'
          a=Image.open(p)
          m=json.load(open('terrain-detail/central-europe-v90.json'))
          assert a.size==(m['imageWidth'],m['imageHeight'])
          assert a.width>=3000 and a.height>=3000
          assert m['bboxLonLat']==[7.0,44.0,19.0,57.0]
          assert m['x']>450 and m['y']>350
          print('REGIONAL DEM VERIFIED',a.size,m['bboxLonLat'])
          PY
      - name: Commit high-resolution terrain source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add terrain-detail/central-europe-v90.webp terrain-detail/central-europe-v90.json
          if ! git diff --cached --quiet; then
            git commit -m "Build measured high-detail central Europe tile for tactical zoom"
            for retry in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
