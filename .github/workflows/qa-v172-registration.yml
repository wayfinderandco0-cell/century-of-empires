name: V172 candidate geographic registration - NO historical approval
on:
  push:
    branches: [terrain-v172-evidence-gated-registration-20261024]
    paths:
      - 'terrain-grid/v172-registration.js'
      - 'scripts/test_v172_registration.js'
      - 'terrain-grid/v172-unregistered-evidence.json'
      - '.github/workflows/qa-v172-registration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-gated-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve V121 original painting and immutable V123 graph
        run: node scripts/test_v161_native_material.js
      - name: Pin exact original game-art and graph bytes for future evidence review
        run: sha256sum v121-octagon-1-painted-road.html terrain-grid/v123-atlas.js
      - name: Candidate fit with independent holdouts and fail-closed negative tests
        run: node scripts/test_v172_registration.js
      - name: No real game-to-source tie points are approved
        run: |
          node - <<'JS'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('terrain-grid/v172-unregistered-evidence.json','utf8'));
          const {validateEvidence}=require('./terrain-grid/v172-registration');
          if(m.controls.length||m.holdouts.length||m.productionApproved||m.v123RoadsGeoregistered)
            throw Error('V172 source-to-game correspondence was silently asserted');
          const crypto=require('crypto');
          const hash=path=>crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          if(m.gameArtSha256!==hash('v121-octagon-1-painted-road.html'))
            throw Error('V121 original art SHA256 drift');
          if(m.gameGraphSha256!==hash('terrain-grid/v123-atlas.js'))
            throw Error('V123 original route graph SHA256 drift');
          if(m.sourceMosaicSha256!=='7360fcb88a2325791aaeb16fbfd3a8b4c24289752c0d1b67c99ba3b42de11756')
            throw Error('V169 source mosaic identity drift');
          try {validateEvidence(m);throw Error('Missing landmark controls were accepted');}
          catch(e){if(!/four reviewed controls/.test(e.message))throw e;}
          console.log('PASS: no invented landmark controls; registration remains blocked');
          JS
