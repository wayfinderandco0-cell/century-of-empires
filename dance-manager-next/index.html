const NAV={owner:[['overview','grid','Overview'],['students','users','Students'],['classes','calendar','Classes'],['attendance','check','Attendance'],['billing','credit','Billing'],['messages','mail','Messages'],['insights','chart','Insights'],['settings','gear','Settings']],instructor:[['today','calendar','My classes'],['roll','check','Attendance'],['roster','users','Student roster']],parent:[['family','home','Family home'],['schedule','calendar','Class schedule'],['payments','credit','Tuition'],['updates','bell','Studio updates']]};
const MOBILE={owner:['overview','students','classes','billing'],instructor:['today','roll','roster'],parent:['family','schedule','payments','updates']};
function pageTitle(){return NAV[role]?.find(([key])=>key===route)?.[2]||'Overview';}
function layout(){const nav=NAV[role]||NAV.owner;return `<div class="platform"><aside class="sidebar">${brand()}<div class="side-category">${role==='owner'?'Studio management':role==='parent'?'Family portal':'Instructor workspace'}</div><nav aria-label="Workspace navigation">${nav.map(([id,ic,title])=>`<button type="button" class="side-item ${route===id?'active':''}" data-route="${id}">${icon(ic)} ${title}</button>`).join('')}</nav><div class="side-bottom"><button class="side-item" data-action="marketing">${icon('home')} Public website</button><button class="side-item" data-action="reset">${icon('rotate')} Reset demo data</button><div class="side-footer">Independent V1 preview<br/>No production connectivity</div></div></aside><div class="workspace"><header class="workspace-top"><div><div class="crumbs">Dance Manager Next / ${esc(role)} </div><div class="crumbs"><b>${esc(pageTitle())}</b></div></div><div class="top-actions"><select class="role-switch" id="role-select" aria-label="Switch demonstration role"><option value="owner" ${role==='owner'?'selected':''}>Studio owner</option><option value="instructor" ${role==='instructor'?'selected':''}>Instructor</option><option value="parent" ${role==='parent'?'selected':''}>Parent</option><option value="marketing">Public website</option></select><span class="avatar">DM</span></div></header><main class="main">${content()}${metaNote()}</main></div><nav class="mobile-tabs" aria-label="Mobile navigation">${nav.filter(([id])=>MOBILE[role].includes(id)).map(([id,ic,title])=>`<button class="mobile-tab ${route===id?'active':''}" data-route="${id}">${icon(ic)}<span>${title}</span></button>`).join('')}${role==='owner'?`<button type="button" class="mobile-tab" data-action="mobile-more">${icon('menu')}<span>More</span></button>`:''}</nav></div>`}
function head(title,desc,action){return `<div class="page-title-row"><div><h1>${title}</h1><p>${desc}</p></div>${action||''}</div>`}
function stat(title,value,ic,desc){return `<div class="stat-card"><div class="stat-line"><span>${title}</span><span class="stat-icon">${icon(ic)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${desc}</div></div>`}
function panel(title,subtitle,body,action=''){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div><div class="panel-body">${body}</div></section>`}
function classRow(c){return `<div class="class-row"><div class="time-chip">${esc(to12(c.start))}<br><span style="font-weight:500">${esc(c.day.slice(0,3))}</span></div><div class="class-info"><strong>${esc(c.name)}</strong><small>${esc(c.instructor)} · ${esc(c.room)}</small></div><div class="class-count">${classEnrollCount(c)}/${esc(c.capacity)}</div></div>`}
function to12(t){const [h,m]=(t||'16:00').split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function ownerOverview(){const s=summary();return `${head('Good afternoon, Studio Team','Here’s what’s happening across your fictional studio today.',button(`${icon('plus')} Add student`,'add-student'))}<div class="stats-grid">${stat('Active students',s.active, 'users','Current sample roster')}${stat('Scheduled classes',db.classes.length,'calendar','Weekly classes')}${stat('Collected invoices',USD(s.paid),'credit','Fictional transactions')}${stat('Open balances',USD(s.open),'dollar','Not real receivables')}</div><div class="dashboard-grid"><div style="display:grid;gap:18px">${panel('Weekly class schedule','Your recurring class lineup',db.classes.slice(0,5).map(classRow).join(''),button('All classes '+icon('arrow'),'show-classes','btn-quiet btn-small'))}${panel('Tuition summary','Sample billing data',`<div class="revenue-chart">${[42,54,50,66,78,70,90].map((n,i)=>`<div class="revenue-month"><span class="bar" style="height:${n}%"></span><small>${['Apr','May','Jun','Jul','Aug','Sep','Oct'][i]}</small></div>`).join('')}</div><p class="fineprint" style="margin-top:23px">Illustrative chart only; not connected to any studio financials.</p>`)}</div><div style="display:grid;align-content:start;gap:18px">${panel('Quick actions','Common tasks',`<div class="quick-links"><button class="quick-link" data-action="add-student">${icon('plus')} New student</button><button class="quick-link" data-action="add-class">${icon('calendar')} Add class</button><button class="quick-link" data-action="add-invoice">${icon('credit')} New invoice</button></div>`)}${panel('Recent activity','Local demo actions',`<ul class="activity-list">${db.activity.map(a=>`<li><span class="activity-dot"></span><div><b>${esc(a.text)}</b><small>${esc(a.stamp)}</small></div></li>`).join('')}</ul>`)}${panel('Important reminder','This is a concept only',`<div class="highlight">${icon('info')} Role switching is a preview, not secure login. No information goes to the live Dance Manager system.</div>`)}</div></div>`}
function students(){return `${head('Students & families','Manage fictional student records and enrollment status.',button(`${icon('plus')} Add student`,'add-student'))}<section class="panel"><div class="table-controls"><label class="search-wrap">${icon('search')}<input id="student-search" aria-label="Search students" placeholder="Search students or guardians" autocomplete="off"/></label><span class="pill blue" id="student-count">${db.students.length} students</span></div><div class="scroll-x"><table><thead><tr><th>Student</th><th>Level</th><th>Guardian</th><th>Status</th><th>Age</th></tr></thead><tbody id="student-list">${db.students.map((s,i)=>`<tr data-student-search="${esc((s.name+' '+s.guardian+' '+s.level).toLowerCase())}"><td><div class="student-profile"><span class="student-avatar v${i%4+1}">${esc(initials(s.name))}</span><div><strong>${esc(s.name)}</strong><div class="fineprint">#${esc(s.id)}</div></div></div></td><td>${esc(s.level)}</td><td>${esc(s.guardian)}</td><td>${badge(s.status)}</td><td>${esc(s.age)}</td></tr>`).join('')}</tbody></table></div></section>`}
function classes(){return `${head('Class schedule','Organize studios, teachers, capacity, and class details.',button(`${icon('plus')} New class`,'add-class'))}<div class="class-card-grid">${db.classes.map(c=>`<article class="class-card"><div class="class-card-top"><span class="pill blue">${esc(c.day)}</span><span class="pill ${classEnrollCount(c)>=c.capacity?'amber':'green'}">${classEnrollCount(c)>=c.capacity?'Full':'Open'}</span></div><h3>${esc(c.name)}</h3><p>${icon('clock')} ${esc(to12(c.start))} · ${esc(c.duration)} min</p><p>${icon('users')} ${esc(c.instructor)} · ${esc(c.room)}</p><div class="tagline">${icon('users')} ${classEnrollCount(c)} / ${esc(c.capacity)} enrolled</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,classEnrollCount(c)/Math.max(1,c.capacity)*100)}%"></div></div><div class="class-card-footer"><span class="fineprint">${Math.max(0,c.capacity-classEnrollCount(c))} seats available</span>${button('View roster '+icon('arrow'),'roster-'+c.id,'btn-soft btn-small')}</div></article>`).join('')}</div>`}
function attendance(){const id=db.classes[0]?.id;return `${head('Attendance','Mark fictional students present or absent; changes save locally.',button('Switch to instructor view','instructor','btn-outline'))}<div class="split-2">${panel('Choose a class','Select a class to review attendance.',`<div class="form-field"><label class="label" for="attendance-class">Class</label><select id="attendance-class">${db.classes.map(c=>`<option value="${esc(c.id)}" ${c.id===id?'selected':''}>${esc(c.name)} · ${esc(c.day)}</option>`).join('')}</select></div><div id="attendance-block">${attendanceBody(id)}</div>`)}${panel('How attendance works','A quick instructor workflow',`<div class="highlight">${icon('info')} Choose a class, then tap Present or Absent. This demo only changes local example records.</div><p class="small muted">A production version would also need historical records, absence notifications, permissions, and audit logging.</p>`)}</div>`}
function attendanceBody(id){const c=db.classes.find(c=>c.id===id);if(!c)return '<div class="empty">No class selected.</div>';if(!c.enrolled.length)return '<div class="empty">No enrolled students in this sample class.</div>';return `<div class="attendance-list">${c.enrolled.map((s,i)=>{const st=db.students.find(x=>x.id===s);if(!st)return '';const status=db.attendance[id]?.[s]||'';return `<div class="attendance-person"><div class="student-profile"><span class="student-avatar v${i%4+1}">${esc(initials(st.name))}</span><strong>${esc(st.name)}</strong></div><div class="attendance-buttons"><button data-action="mark:${id}:${s}:present" class="${status==='present'?'present':''}" aria-label="Mark ${esc(st.name)} present">✓</button><button data-action="mark:${id}:${s}:absent" class="${status==='absent'?'absent':''}" aria-label="Mark ${esc(st.name)} absent">✕</button></div></div>`}).join('')}</div><div class="fineprint">${esc(c.name)} · ${classEnrollCount(c)} enrolled. Attendance saved in this browser only.</div>`}
function billing(){const s=summary();return `${head('Tuition & invoices','Track sample balances and simulate payment status.',button(`${icon('plus')} Create invoice`,'add-invoice'))}<div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">${stat('Recorded as paid',USD(s.paid),'check','Demo status only')}${stat('Outstanding',USD(s.open),'dollar','Demo status only')}</div><section class="panel"><div class="panel-head"><div><h2>Recent invoices</h2><p>No money moves in this prototype</p></div><span class="pill amber">Simulation</span></div><div class="scroll-x"><table><thead><tr><th>Invoice</th><th>Student</th><th>Amount</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.invoices.map(i=>`<tr><td><strong>${esc(i.label)}</strong><div class="fineprint">${esc(i.id)}</div></td><td>${esc(studentName(i.studentId))}</td><td><strong>${USD(i.amount)}</strong></td><td>${prettyDate(i.due)}</td><td>${badge(i.status)}</td><td>${i.status==='Open'?button('Mark paid (demo)','pay-'+i.id,'btn-soft btn-small'):'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
function messages(){return `${head('Studio communications','Draft updates for families and staff.',button(`${icon('plus')} New announcement`,'new-message'))}<div class="split-2">${panel('Recent announcements','Fictional internal message previews',`<div>${db.announcements.map(a=>`<div class="message-entry">${icon('mail')}<div><strong>${esc(a.title)}</strong> <span class="pill blue">${esc(a.kind||'Update')}</span><p>${esc(a.body)}</p><span class="fineprint">${esc(a.date)}</span></div></div>`).join('')}</div>`)}${panel('Communication status','Not connected to real delivery',`<div class="highlight">${icon('info')} Announcements are displayed only in this private browser demo. No email, SMS, or push notifications are sent.</div><p class="small muted">Production integrations would require opt-in/opt-out handling, event triggers, delivery logs, and studio administration controls.</p>`)}</div>`}
function insights(){const s=summary();const max=Math.max(1,...db.classes.map(c=>c.capacity));return `${head('Studio insights','Simple snapshots from the fictional sample data.',button('Reset demo','reset','btn-outline'))}<div class="stats-grid">${stat('Student records',db.students.length,'users','Including trial students')}${stat('Class occupancy',Math.round(s.enrolled/Math.max(1,s.spots)*100)+'%','chart','Across weekly classes')}${stat('Fictional receipts',USD(s.paid),'credit','Invoices marked paid')}${stat('Open invoices',db.invoices.filter(i=>i.status==='Open').length,'bell','Awaiting demo payment')}</div><div class="split-2">${panel('Enrollment by class','Class seats vs. enrollment',db.classes.map(c=>`<div style="padding:13px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:720"><span>${esc(c.name)}</span><span>${classEnrollCount(c)} / ${esc(c.capacity)}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(classEnrollCount(c)/Math.max(1,c.capacity)*100)}%"></div></div></div>`).join(''))}${panel('Revenue trend','Illustrative artwork, not accounting history',`<div class="revenue-chart">${[40,49,63,59,77,85,73].map((n,i)=>`<div class="revenue-month"><span class="bar" style="height:${n}%"></span><small>${['Apr','May','Jun','Jul','Aug','Sep','Oct'][i]}</small></div>`).join('')}</div><p class="fineprint" style="margin-top:26px">Chart bars are placeholder values. Build a real reporting engine only after a verified data model exists.</p>`)}</div>`}
function settings(){return `${head('Demo settings','Inspect what is real and what is still conceptual.',button(`${icon('rotate')} Reset demo`,'reset','btn-outline'))}<div class="split-2">${panel('Prototype configuration','V1 limitations',`<div class="message-entry">${icon('check')}<div><strong>Local sample data</strong><p>Forms, lists, and status changes are stored in this browser only.</p></div></div><div class="message-entry">${icon('alert')}<div><strong>No user authentication</strong><p>Role selection is for demos; anyone using this preview can switch roles.</p></div></div><div class="message-entry">${icon('alert')}<div><strong>No real financial services</strong><p>Invoice statuses are simulated. There is no checkout, payout, or card collection.</p></div></div><div class="message-entry">${icon('alert')}<div><strong>Not connected to Dance Manager</strong><p>Original hosting, accounts, and customer records remain untouched.</p></div></div>`)}${panel('Install to home screen','For future private HTTPS staging',`<p class="small muted">Once hosted on a separate HTTPS address, you can use iPhone Safari → Share → Add to Home Screen. This is a PWA prototype, not a published App Store application.</p><p class="small muted">A native iPhone/Android application requires further engineering and eventual store registration.</p>${button('Back to website','marketing','btn-soft')}`)}</div>`}
function instructorToday(){const cs=db.classes.filter(c=>c.instructor==='Olivia Hart');return `${head('Hello, Olivia','Your fictional class schedule and attendance shortcuts.',button('Open attendance','show-roll'))}<div class="parent-greeting"><h2>Ready for class?</h2><p>Here’s what’s coming up for you this week.</p></div>${panel('My class schedule','Sample instructor: Olivia Hart',cs.map(c=>`<div class="class-row"><div class="time-chip">${esc(to12(c.start))}<br>${esc(c.day.slice(0,3))}</div><div class="class-info"><strong>${esc(c.name)}</strong><small>${esc(c.room)} · ${classEnrollCount(c)} students</small></div>${button('Take roll','roster-'+c.id,'btn-soft btn-small')}</div>`).join(''))}`}
function instructorRoster(){const cs=db.classes.filter(c=>c.instructor==='Olivia Hart');return `${head('My student rosters','View your fictional classes and students.')}${cs.map(c=>panel(`${esc(c.name)}`,`${esc(c.day)} · ${esc(c.room)}`,c.enrolled.length?c.enrolled.map(s=>`<div class="class-row"><div class="student-profile"><span class="student-avatar">${esc(initials(studentName(s)))}</span><strong>${esc(studentName(s))}</strong></div></div>`).join(''):'<div class="empty">No students enrolled</div>')).join('<div style="height:16px"></div>')}`}
function family(){const parentStud=db.students[0];const s=db.invoices.filter(i=>i.studentId===parentStud.id);const open=s.filter(i=>i.status==='Open').reduce((n,i)=>n+i.amount,0);return `${head('Welcome, Morgan','Your sample family portal.',button('Explore class schedule','show-schedule'))}<div class="parent-greeting"><h2>Everything for your dance family.</h2><p>Classes, studio messages, and account information in one place.</p><span class="watermark">${icon('dance')}</span></div><div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">${stat('Your dancer',esc(parentStud.name.split(' ')[0]),'users','Sample family')}${stat('Tuition balance',USD(open),'credit','Fictional balance')}</div><div class="split-2">${panel('Upcoming classes','For Avery Brooks',db.classes.filter(c=>c.enrolled.includes('s1')).map(classRow).join('')||'<p class="muted">No class assigned.</p>')}${panel('Latest studio update','Illustrative announcements',`<strong>${esc(db.announcements[0]?.title||'No updates')}</strong><p class="small muted">${esc(db.announcements[0]?.body||'')}</p>${button('See all updates','show-updates','btn-soft btn-small')}`)}</div>`}
function parentSchedule(){const mine=db.classes.filter(c=>c.enrolled.includes('s1'));const open=db.classes.filter(c=>!c.enrolled.includes('s1')&&classEnrollCount(c)<c.capacity);return `${head('Class schedule','View your family’s schedule and explore available classes.')}${panel('Current enrollment','Avery Brooks',mine.length?mine.map(classRow).join(''):'<div class="empty">No current classes.</div>')}<div style="height:18px"></div>${panel('Explore classes','Requests are simulated and not sent to the studio.',open.map(c=>`<div class="enroll-card"><div><strong>${esc(c.name)}</strong><div class="note">${esc(c.day)} · ${esc(to12(c.start))} · ${esc(c.instructor)}</div></div>${button('Request trial','request-'+c.id,'btn-soft btn-small')}</div>`).join('')||'<div class="empty">No other sample classes available.</div>')}`}
function parentPayments(){const invoices=db.invoices.filter(i=>i.studentId==='s1');return `${head('Tuition & payments','Your fictional family balance.')}${panel('Family invoices','No real money can be paid from this demo.',invoices.map(i=>`<div class="enroll-card"><div><strong>${esc(i.label)}</strong><div class="note">Due ${prettyDate(i.due)} · ${esc(i.id)}</div></div><div style="text-align:right"><strong>${USD(i.amount)}</strong><div style="margin:5px 0">${badge(i.status)}</div></div></div>`).join('')+`<div class="safe-notice">This preview has no payment processor. The “Pay” functionality will be developed only after secure integration and approval.</div>`)}`}
function parentUpdates(){return `${head('Studio announcements','Updates from the fictional dance studio.')}${panel('Latest news','Preview only',db.announcements.map(a=>`<div class="message-entry">${icon('bell')}<div><strong>${esc(a.title)}</strong> <span class="pill blue">${esc(a.kind)}</span><p>${esc(a.body)}</p><span class="fineprint">${esc(a.date)}</span></div></div>`).join(''))}`}
function content(){if(role==='owner')return ({overview:ownerOverview,students,classes,attendance,billing,messages,insights,settings}[route]||ownerOverview)();if(role==='instructor')return ({today:instructorToday,roll:attendance,roster:instructorRoster}[route]||instructorToday)();return ({family,parent:family,schedule:parentSchedule,payments:parentPayments,updates:parentUpdates}[route]||family)()}
function demoBanner(){return `<div class="demo-banner">${icon('shield')} PRIVATE INDEPENDENT PROTOTYPE · Fictional data · Original Dance Manager website untouched</div>`}
function render(){document.querySelector('#app').innerHTML=demoBanner()+(role==='marketing'?marketing():layout())+`<button class="chat-trigger" data-action="chat-toggle">${icon('chat')} ${chatOpen?'Close assistant':'Ask a question'}</button>`+(chatOpen?chatPanel():'');renderModal();}
function navigate(r,p){role=r;route=p||({marketing:'home',owner:'overview',instructor:'today',parent:'family'}[r]);mobileMenu=false;chatOpen=false;modal='';render();window.scrollTo({top:0,behavior:'instant'});}
function toast(msg){const root=document.querySelector('#toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>{if(root)root.innerHTML='';},3200)}
function modalForm(title,body,kind){modal={title,body,kind};renderModal();}
function renderModal(){const root=document.querySelector('#modal-root');if(!modal){root.innerHTML='';return;}root.innerHTML=`<div class="modal-scrim" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${esc(modal.title)}</h2><button type="button" class="icon-button" aria-label="Close dialog" data-action="close-modal">${icon('x')}</button></div><div class="modal-body">${modal.body}</div></section></div>`;}
const field=(id,label,placeholder='',type='text',req='required',value='')=>`<div class="form-field"><label class="label" for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" ${req} placeholder="${esc(placeholder)}" value="${esc(value)}" /></div>`;
const footer=(submit='Save example')=>`<div class="modal-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${submit}</button></div>`;
function openStudent(){modalForm('Add a fictional student',`<div class="safe-notice">Use sample details only. This is not a secure storage system.</div><form id="student-form"><div class="form-grid">${field('student-name','Student name','e.g. Demo Student')}${field('student-age','Age','9','number','required min="2" max="99"')}</div><div class="form-grid">${field('student-guardian','Guardian name','e.g. Demo Guardian')}${field('student-level','Dance level','e.g. Ballet I')}</div>${footer('Add to demo roster')}</form>`,'student');}
function openClass(){modalForm('Create a fictional class',`<form id="class-form">${field('class-name','Class name','e.g. Beginner Ballet')}<div class="form-grid"><div class="form-field"><label class="label" for="class-day">Day</label><select id="class-day" name="class-day">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=>`<option>${d}</option>`).join('')}</select></div>${field('class-start','Start time','','time','required','16:00')}</div><div class="form-grid">${field('class-instructor','Instructor','e.g. Demo Teacher')}${field('class-room','Room','e.g. Studio A')}</div><div class="form-grid">${field('class-capacity','Capacity','12','number','required min="1" max="300"','12')}${field('class-duration','Duration (minutes)','60','number','required min="15" max="240"','60')}</div>${footer('Add demo class')}</form>`,'class');}
function openInvoice(){modalForm('Create a fictional invoice',`<div class="safe-notice">A real payment cannot be collected in this prototype.</div><form id="invoice-form"><div class="form-field"><label class="label" for="invoice-student">Student</label><select id="invoice-student" name="invoice-student">${db.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div><div class="form-grid">${field('invoice-amount','Amount (USD)','95','number','required min="1" max="100000"')}${field('invoice-due','Due date','','date','required','2026-10-31')}</div>${field('invoice-label','Description','November tuition')}${footer('Save demo invoice')}</form>`,'invoice');}
function openMessage(){modalForm('Compose a studio announcement',`<div class="safe-notice">This only adds an announcement to the local demo; it does not send a message.</div><form id="message-form">${field('message-title','Announcement title','e.g. Saturday rehearsal')}<div class="form-field"><label class="label" for="message-body">Message</label><textarea id="message-body" name="message-body" required maxlength="1000" placeholder="Write a studio announcement..."></textarea></div>${footer('Save mock announcement')}</form>`,'message');}
function openRoster(id){const c=db.classes.find(c=>c.id===id);if(!c)return;modalForm(`${c.name} — roster`,`<p class="small muted">${esc(c.day)} · ${esc(to12(c.start))} · ${esc(c.instructor)} · ${esc(c.room)}</p><div style="margin:15px 0">${c.enrolled.length?c.enrolled.map((sid,i)=>`<div class="class-row"><span class="student-avatar v${i%4+1}">${esc(initials(studentName(sid)))}</span><div class="class-info"><strong>${esc(studentName(sid))}</strong></div></div>`).join(''):'<div class="empty">No students currently assigned.</div>'}</div><div class="safe-notice">All rosters contain fictional students. Editing enrollment will come in a later version.</div><div class="modal-footer">${button('Close','close-modal','btn-outline')}</div>`,'roster')}
function chatPanel(){return `<section class="chat-pane" aria-label="Demo help chat"><header class="chat-head"><div><b>Dance Manager Assistant</b><small>Scripted demo · Not live AI</small></div><button class="icon-button" data-action="chat-toggle" aria-label="Close chat" style="background:#ffffff20;color:white;border:0">${icon('x')}</button></header><div class="chat-messages" id="chat-messages">${chatMessages.map(m=>`<div class="bubble ${m.from==='you'?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="chat-quick">${['Features','Parent portal','Pricing','Mobile app'].map(q=>`<button type="button" data-chat-quick="${esc(q)}">${q}</button>`).join('')}</div><form id="chat-form" class="chat-input"><label class="screen-reader" for="chat-question">Ask a question</label><input id="chat-question" name="question" placeholder="Ask about Dance Manager..." maxlength="240" required autocomplete="off"/><button type="submit" aria-label="Send question">${icon('arrow')}</button></form></section>`}
function chatReply(q){const s=q.toLowerCase();if(/cost|price|pricing|fee|month|trial/.test(s))return 'Official pricing and fees must be confirmed by the product owner. This independent V1 prototype intentionally does not publish an unverified plan or price.';if(/parent|family|guardian|portal|register/.test(s))return 'The intended family experience includes classes, invoices, updates, and enrollment requests. Switch to the Parent view to try fictional workflows.';if(/app|iphone|android|phone|mobile|install/.test(s))return 'This is a mobile-friendly progressive web app prototype. Once hosted on a separate HTTPS site, it can be added to a phone home screen. Native app-store releases remain future work.';if(/bill|payment|tuition|invoice|credit/.test(s))return 'The prototype lets studio owners create fictional invoices and mark them paid as a simulation. No charges, cards, or real payments are processed.';if(/class|attendance|teacher|instructor|schedule/.test(s))return 'You can browse sample classes, view rosters, and mark attendance. Switch between Studio owner and Instructor using the role menu.';if(/demo|feature|software|works/.test(s))return 'Try the Studio owner, Instructor, and Parent demo views. Students, classes, messages and sample billing all operate locally in your browser.';if(/contact|support|sales|email|schedule a demo/.test(s))return 'The public page includes a local demo-inquiry form. It does not send email. A production version will need a verified booking and support workflow.';return 'I can explain the sample class schedule, student records, tuition simulation, parent portal, mobile app plans, or pricing status. This is a scripted demo, not a live AI service.'}
function askChat(q){q=(q||'').trim().slice(0,240);if(!q)return;chatMessages.push({from:'you',text:q},{from:'bot',text:chatReply(q)});const c=document.querySelector('.chat-pane');if(c){c.outerHTML=chatPanel();document.querySelector('#chat-messages')?.scrollTo(0,999999);}else render();}
function doAction(action){if(action==='mobile-more'){modalForm('More studio tools',`<div class="more-menu">${NAV.owner.filter(([id])=>!MOBILE.owner.includes(id)).map(([id,ic,title])=>`<button type="button" class="more-link" data-route="${id}">${icon(ic)} <span>${title}</span> ${icon('chevron')}</button>`).join('')}<button type="button" class="more-link" data-action="marketing">${icon('home')} <span>Public website</span> ${icon('chevron')}</button><button type="button" class="more-link" data-action="reset">${icon('rotate')} <span>Reset demo data</span> ${icon('chevron')}</button></div>`, 'more');return}if(action==='toggle-menu'){mobileMenu=!mobileMenu;render();return}if(action==='close-menu'){mobileMenu=false;return}if(action==='owner'||action==='instructor'||action==='parent'||action==='marketing'){navigate(action);return}if(action==='reset'){if(window.confirm('Reset only this prototype’s fictional sample data?')){db=sample();save();render();toast('Fictional demo data restored.')}return}if(action==='chat-toggle'){chatOpen=!chatOpen;render();return}if(action==='add-student'){openStudent();return}if(action==='add-class'){openClass();return}if(action==='add-invoice'){openInvoice();return}if(action==='new-message'){openMessage();return}if(action==='close-modal'){modal='';renderModal();return}if(action==='show-classes'){role='owner';route='classes';render();return}if(action==='show-roll'){role='instructor';route='roll';render();return}if(action==='show-schedule'){role='parent';route='schedule';render();return}if(action==='show-updates'){role='parent';route='updates';render();return}if(action.startsWith('roster-')){openRoster(action.substring(7));return}if(action.startsWith('mark:')){const [,cid,sid,status]=action.split(':');if(db.classes.find(c=>c.id===cid)?.enrolled.includes(sid)){db.attendance[cid]??={};db.attendance[cid][sid]=status;save();const sel=document.querySelector('#attendance-class');if(sel?.value===cid){const b=document.querySelector('#attendance-block');if(b)b.innerHTML=attendanceBody(cid)}toast(`Marked ${studentName(sid)} ${status} (demo).`)}return}if(action.startsWith('pay-')){const inv=db.invoices.find(i=>i.id===action.slice(4));if(inv&&inv.status==='Open'){inv.status='Paid';track(`Marked ${inv.label} paid — simulated`);render();toast('Invoice marked paid in demo. No money transferred.')}return}if(action.startsWith('request-')){const c=db.classes.find(x=>x.id===action.slice(8));if(c){db.enrollmentRequests.push({classId:c.id,studentId:'s1'});track(`Sample enrollment request for ${c.name}`);toast(`Mock request recorded for ${c.name}. Not sent.`)}return}}
document.addEventListener('click',e=>{const quick=e.target.closest('[data-chat-quick]');if(quick){askChat(quick.dataset.chatQuick);return}const r=e.target.closest('[data-route]');if(r){route=r.dataset.route;modal='';render();window.scrollTo({top:0,behavior:'instant'});return}const a=e.target.closest('[data-action]');if(a){if(a.classList.contains('modal-scrim')&&e.target!==a)return;if(a.tagName==='A'){mobileMenu=false;return}doAction(a.dataset.action)}});
document.addEventListener('change',e=>{if(e.target.id==='role-select'){navigate(e.target.value);return}if(e.target.id==='attendance-class'){const b=document.querySelector('#attendance-block');if(b)b.innerHTML=attendanceBody(e.target.value)}});
document.addEventListener('input',e=>{if(e.target.id==='student-search'){const q=e.target.value.toLowerCase().trim();let shown=0;document.querySelectorAll('#student-list tr').forEach(row=>{const visible=row.dataset.studentSearch.includes(q);row.hidden=!visible;if(visible)shown++});const label=document.querySelector('#student-count');if(label)label.textContent=`${shown} students`}});
document.addEventListener('submit',e=>{const form=e.target;if(!['student-form','class-form','invoice-form','message-form','lead-form','chat-form'].includes(form.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());if(form.id==='chat-form'){askChat(data.question);return}if(form.id==='student-form'){const name=(data['student-name']||'').trim(),age=Number(data['student-age']);if(!name||!Number.isFinite(age)||age<2||age>99)return toast('Please check the student name and age.');db.students.push({id:'s'+Date.now(),name,age,level:(data['student-level']||'').trim(),guardian:(data['student-guardian']||'').trim(),email:'demo@example.test',status:'Active'});track(`Added fictional student: ${name}`);modal='';render();toast('Student added to demo roster.');return}if(form.id==='class-form'){const name=(data['class-name']||'').trim(),capacity=Number(data['class-capacity']),duration=Number(data['class-duration']);if(!name||!(capacity>=1&&capacity<=300)||!(duration>=15&&duration<=240))return toast('Check class details.');db.classes.push({id:'c'+Date.now(),name,day:data['class-day'],start:data['class-start'],duration,instructor:(data['class-instructor']||'').trim()||'Demo Teacher',room:(data['class-room']||'').trim()||'Studio A',capacity,enrolled:[]});track(`Added demo class: ${name}`);modal='';render();toast('Class added to demo schedule.');return}if(form.id==='invoice-form'){const amount=Number(data['invoice-amount']);if(!(amount>0&&amount<=100000)||!data['invoice-due'])return toast('Please enter a valid amount and due date.');db.invoices.unshift({id:'i'+Date.now(),studentId:data['invoice-student'],amount,due:data['invoice-due'],status:'Open',label:(data['invoice-label']||'Tuition').trim()});track('Created a fictional tuition invoice');modal='';render();toast('Demo invoice created.');return}if(form.id==='message-form'){if(!data['message-title']?.trim()||!data['message-body']?.trim())return;db.announcements.unshift({id:'a'+Date.now(),title:data['message-title'].trim(),body:data['message-body'].trim(),date:'Just now',kind:'Studio update'});track('Saved a mock studio announcement');modal='';render();toast('Announcement preview saved. Nothing sent.');return}if(form.id==='lead-form'){if(!data.name?.trim()||!data.studio?.trim())return;db.leads.push({name:data.name.trim(),studio:data.studio.trim(),message:(data.message||'').trim()});track(`Mock inquiry from ${data.studio}`);render();toast('Inquiry saved locally. No email was sent.');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';renderModal()}});
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
if(new URLSearchParams(location.search).get('app')==='1'){role='owner';route='overview'}
render();

  </script>
  <script src="./v2.js"></script>
  <script src="./v3.js"></script>
  <script src="./v4.js"></script>
</body>
</html>
