name: V244 Native Road Landscape Warp (ART RED)
on:
  push:
    branches: [terrain-v244-native-road-landscape-warp-study-20261027]
  workflow_dispatch:
jobs:
  isolated-native-warp:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing requirements
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Compile new image code and inherited V243 geometry guard
        run: python -m py_compile scripts/v244_native_road_warp.py scripts/test_v244_native_road_warp.py scripts/v243_road_conditioning.py
      - name: Run native road pixel relocation and negative tests
        run: PYTHONPATH=scripts python -m unittest -v test_v244_native_road_warp
      - name: Verify immutable V123 graph and WEST/SOUTH art constraints
        run: |
          PYTHONPATH=scripts python -m unittest -v test_v243_road_conditioning
          python scripts/v243_road_conditioning.py --out qa/v244-inherited-road-constraints
      - name: Preserve diagnostic artifacts (not playable artwork)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v244-original-graph-constraints-only-UNAPPROVED
          path: qa/v244-inherited-road-constraints/
          if-no-files-found: warn
      - name: PRODUCTION GATE - deliberately RED until actual WEST and SOUTH visual approval
        run: |
          echo "ART RED: SOUTH vertical approach unsupported; WEST local road extends beyond survey; no historical tiepoints or user visual approval."
          exit 1
