name: V171 Directional Army and Road Graphics QA
on:
  push:
    branches: [main]
    paths:
      - 'v171-directional-army-road-test.html'
      - 'scripts/qa_v171_graphics.py'
      - '.github/workflows/qa-v171-graphics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v171-mobile-graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - run: python scripts/qa_v171_graphics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v171-mobile-chromium-webkit-portraits-landscapes
          path: qa/v171-graphics/
