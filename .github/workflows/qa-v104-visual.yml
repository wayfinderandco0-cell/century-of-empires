name: V104 Brenner 3D forest geometry
on:
  push:
    branches: [terrain-v104-forest-mesh]
    paths: ['v104-brenner-visual-pilot.html', 'terrain-v104/pilot.js', 'terrain-v104/pilot.css', 'scripts/qa_v104_mobile.py', '.github/workflows/qa-v104-visual.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v104-visual-repair
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare original assets and test browsers
        run: |
          pip install numpy scipy pillow playwright
          python -m playwright install --with-deps chromium webkit
          node --check terrain-v104/pilot.js
      - name: Render and test both phone orientations
        run: python scripts/qa_v104_mobile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v104-visual-evidence-${{ github.run_id }}
          path: terrain-v104/
      - name: Save visual evidence only to V104
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin terrain-v104-forest-mesh
          if [ "$(git rev-parse origin/terrain-v104-forest-mesh)" != "$SOURCE_SHA" ]; then
            echo 'Source advanced; evidence retained in uniquely named artifact. Do not overwrite newer source.'
            exit 1
          fi
          git add terrain-v104/
          if ! git diff --cached --quiet; then
            git commit -m 'V104: persist mobile browser screenshots and QA evidence'
            git push origin HEAD:terrain-v104-forest-mesh
          fi
