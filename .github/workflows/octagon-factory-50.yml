                  assert page.evaluate('window.COEAtlas.nodes')==100
                  page.locator('#atlasIntegratedOpen').click()
                  page.locator('#atlasPhotoSources').click()
                  page.wait_for_function('window.COEAtlas.photoCells===27 && window.COEAtlas.photoInlays===8',timeout=60000)
                  page.locator('#atlasWhole').click()
                  page.wait_for_function('window.COEAtlas.photoLoaded>=10',timeout=60000)
                  page.wait_for_timeout(700)
                  page.screenshot(path=str(out/'actual-webkit-iphone-27-photo-coverage.png'))
                  assert page.evaluate('window.COEAtlas.startMarch()') is False
                  page.locator('#atlasPhotoNext').click()
                  page.wait_for_timeout(1000)
                  page.screenshot(path=str(out/'actual-webkit-iphone-27-photo-close.png'))
                  page.locator('#atlasPhotoSources').click()
                  assert page.evaluate('window.COEAtlas.nodes')==100
                  assert page.evaluate('window.COEAtlas.photoMode') is False
                  print('PASS: 27 real photos in native WebKit, eight natural road-free diamonds, zoom and V123 unchanged')
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY
      - name: Commit durable source art and actual browser evidence to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Candidate metadata and V94 previews must be durable too. They
          # remain explicitly UNAPPROVED and do not count toward finished art.
          git add generated/octagon-factory/ terrain-grid/factory-photo/
          if ! git diff --cached --quiet; then
            git commit -m "Compose source-backed native photo atlas batches and WebKit review"
            if ! git push origin HEAD:terrain-v267-three-original-art-prototype-20261028; then
              # Concurrent code commits may advance the same isolated branch.
              # Never force-push: replay this art-only commit on the latest head.
              git fetch origin terrain-v267-three-original-art-prototype-20261028
              git rebase origin/terrain-v267-three-original-art-prototype-20261028
              git push origin HEAD:terrain-v267-three-original-art-prototype-20261028
            fi
          fi
      - name: Upload staging manifests and real mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: octagon-factory-batch-${{ github.event.inputs.batch || '0' }}
          path: |
            generated/octagon-factory/
            terrain-grid/factory-photo/
          if-no-files-found: error
          retention-days: 14
