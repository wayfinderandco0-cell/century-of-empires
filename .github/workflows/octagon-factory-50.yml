name: 50-octagon geographic factory staging
on:
  workflow_dispatch:
    inputs:
      batch:
        description: '50-cell batch index 0..8 (last batch contains 32)'
        required: false
        default: '0'
  push:
    branches:
      - terrain-v267-three-original-art-prototype-20261028
    paths:
      - scripts/octagon_factory_50.js
      - scripts/octagon_photo_batch.py
      - scripts/octagon_commons_photo_batch.py
      - .github/workflows/octagon-factory-50.yml
permissions:
  contents: write
concurrency:
  group: coe-photo-factory-v267
  cancel-in-progress: false
jobs:
  generate-map-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce fifty geography candidates and source-region manifest
        env:
          SELECTED_BATCH: ${{ github.event.inputs.batch || '0' }}
        run: |
          node scripts/octagon_factory_50.js --batch "$SELECTED_BATCH"
          if [ "$SELECTED_BATCH" != '1' ]; then
            node scripts/octagon_factory_50.js --batch 1
          fi
      - name: Verify fifty unique candidates and unapproved route contracts
        env:
          SELECTED_BATCH: ${{ github.event.inputs.batch || '0' }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const idx=String(process.env.SELECTED_BATCH).padStart(2,'0');
          const base='generated/octagon-factory/batch-'+idx;
          const manifest=JSON.parse(fs.readFileSync(base+'/manifest.json'));
          const report=JSON.parse(fs.readFileSync(base+'/qa-report.json'));
          const expected=Number(process.env.SELECTED_BATCH)===8?32:50;
          if(manifest.cells.length!==expected||report.geographyPreviews!==expected) throw Error('Unexpected batch count');
          const ids=new Set(manifest.cells.map(c=>c.id));
          if(ids.size!==expected)throw Error('Duplicate IDs');
          for(const c of manifest.cells) {
            if(!fs.existsSync(base+'/'+c.id+'.svg'))throw Error('Missing preview '+c.id);
            if(c.historicalConquestTowns.length||c.art.finalNativeArtRendered||c.usableForGameplay)throw Error('False finished claim');
          }
          for(const link of manifest.routeLinks){
            if(link.artRoadPainted||link.gameplayEnabled||link.historicallyVerified)throw Error('False route certification');
          }
          console.log('PASS',expected,'geography candidates, no false historical/road/game approvals');
          NODE
      - name: Install free native photographic composition dependencies
        run: python -m pip install --disable-pip-version-check Pillow playwright
      - name: Compose two full-resolution source-native photographic scenes
        run: python scripts/octagon_photo_batch.py
      - name: Verify distinct source photography and no fictional gameplay
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          p=Path('terrain-grid/factory-photo')
          m=json.loads((p/'manifest.json').read_text())
          assert len(m['cells'])==2 and m['finishedToday']==0
          assert len({c['sourceSha256'] for c in m['cells']})==2
          assert len({c['outputSha256'] for c in m['cells']})==2
          for c in m['cells']:
              f=Path(c['image'])
              assert Image.open(f).size==(1536,1024)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==c['outputSha256']
              assert not c['gameplayEnabled'] and not c['physicallyRoadSeamChecked']
              assert not c['historicallyVerified'] and not c['visuallyReviewedOnPhone']
          print('PASS: two distinct 1536x1024 photo scenes, licensed, NOT finished')
          PY
      - name: Compose three additional region-matched licensed source photographs
        run: python scripts/octagon_commons_photo_batch.py
      - name: Verify five distinct native photo candidates and conservative gates
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          p=Path('terrain-grid/factory-photo')
          m=json.loads((p/'manifest.json').read_text())
          assert len(m['cells'])==5 and m['photographicArtComposed']==5
          assert len({c['originalSource'] for c in m['cells']})==5
          assert len({c['outputSha256'] for c in m['cells']})==5
          for c in m['cells']:
              f=Path(c['image'])
              assert Image.open(f).size==(1536,1024)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==c['outputSha256']
              assert not c['gameplayEnabled'] and not c['physicallyRoadSeamChecked']
              assert not c['historicallyVerified'] and not c['visuallyReviewedOnPhone']
          assert m['finishedToday']==0
          print('PASS: 5 geographically varied source-photo candidates, 0 playable')
          PY
      - name: Install WebKit browser for actual iPhone-size render
        run: python -m playwright install --with-deps webkit
      - name: Render real WebKit 390x844 source-art review
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          p=Path('terrain-grid/factory-photo').resolve()
          with sync_playwright() as w:
              browser=w.webkit.launch(headless=True)
              page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,
                  is_mobile=True,has_touch=True)
              page.goto((p/'index.html').as_uri(),wait_until='load')
              page.locator('article img').first.wait_for()
              page.wait_for_function("Array.from(document.querySelectorAll('article img')).every(i=>i.complete && i.naturalWidth===1536 && i.naturalHeight===1024)")
              page.screenshot(path=str(p/'actual-webkit-iphone.png'),full_page=True)
              assert page.locator('article img').count()==5
              print('PASS actual WebKit mobile photographic review, 390x844, 5 source images')
              browser.close()
          PY
      - name: Verify source-photo streaming inside actual native game canvas
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import subprocess,time
          p=Path('terrain-grid/factory-photo')
          server=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1'],
              stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
          try:
              time.sleep(1.5)
              with sync_playwright() as w:
                  browser=w.webkit.launch(headless=True)
                  page=browser.new_page(viewport={'width':390,'height':844},
                      device_scale_factor=2,is_mobile=True,has_touch=True)
                  page.goto('http://127.0.0.1:8765/index.html',wait_until='domcontentloaded')
                  page.wait_for_function('window.COEAtlas && window.COEAtlas.loaded',timeout=60000)
                  assert page.evaluate('window.COEAtlas.nodes')==100
                  page.locator('#atlasIntegratedOpen').click()
                  page.locator('#atlasPhotoSources').click()
                  page.wait_for_function('window.COEAtlas.photoMode && window.COEAtlas.photoCells===5 && window.COEAtlas.photoLoaded>=2',timeout=40000)
                  assert page.evaluate('window.COEAtlas.startMarch()') is False
                  page.screenshot(path=str(p/'actual-native-game-webkit-iphone.png'))
                  # Traverse from two Sharr references to the new Western Alps cell
                  # inside the SAME game canvas. This is art viewing, not gameplay.
                  page.evaluate('window.COEAtlas.nextPhotoSource()')
                  assert page.evaluate('window.COEAtlas.nextPhotoSource()')=='eu-05-14'
                  page.wait_for_function('window.COEAtlas.photoLoaded>=3',timeout=40000)
                  page.screenshot(path=str(p/'actual-native-western-alps-webkit-iphone.png'))
                  page.locator('#atlasPhotoSources').click()
                  assert page.evaluate('window.COEAtlas.photoMode') is False
                  assert page.evaluate('window.COEAtlas.nodes')==100
                  print('PASS: actual native game WebKit 390x844; 5 source cells manifest; at least 2 stream; V123 graph preserved; photo roads disabled')
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY
      - name: Commit durable source art and actual browser evidence to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-grid/factory-photo/
          if ! git diff --cached --quiet; then
            git commit -m "Compose two distinct source-backed native photo atlas cells and WebKit review"
            git push origin HEAD:terrain-v267-three-original-art-prototype-20261028
          fi
      - name: Upload staging manifests and real mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: octagon-factory-batch-${{ github.event.inputs.batch || '0' }}
          path: |
            generated/octagon-factory/
            terrain-grid/factory-photo/
          if-no-files-found: error
          retention-days: 14
