name: V267 unified native Alpine artwork and actual phone review
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - scripts/v267_unified_native_landscapes.py
      - .github/workflows/v267-unified-native-landscapes.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v267-unified-native-landscapes
  cancel-in-progress: false
jobs:
  artwork-and-real-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original photographic compositor and real phone browsers
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Preserve original review candidate for same-camera before/after
        run: cp v267-three-octagon-original-art-prototype.html v267-unified-before-temp.html
      - name: Author two coherent native photographic Alpine artworks
        run: python scripts/v267_unified_native_landscapes.py
      - name: Capture actual Chromium and WebKit iPhone WEST and SOUTH junctions and march
        run: |
          python - <<'PY'
          from pathlib import Path
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          out=Path('art-reviews/v267-unified-native-phone')
          out.mkdir(parents=True,exist_ok=True)
          server=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler)
          Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}/'
          with sync_playwright() as pw:
            for engine in ('chromium','webkit'):
              browser=getattr(pw,engine).launch(headless=True)
              photos={}
              for mode in ('before','after'):
                ctx=browser.new_context(viewport={'width':390,'height':844},
                  device_scale_factor=2,is_mobile=True,has_touch=True)
                page=ctx.new_page();errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                name='v267-unified-before-temp.html' if mode=='before' else 'v267-three-octagon-original-art-prototype.html?southArt=coherent'
                page.goto(base+name,wait_until='load')
                page.wait_for_function('window.COE && COE.originalMatreiLoaded && COE.sourceRegistered',timeout=90000)
                page.wait_for_timeout(950)
                assert page.evaluate('COE.nodes')==100
                assert page.evaluate('COE.westSouthConnected')
                assert all(s['pass'] and s['gap']==0 for s in page.evaluate('COE.roadSeams'))
                for join in ('west','south'):
                  page.evaluate(f'COE.focusJoin("{join}")')
                  page.wait_for_timeout(600)
                  page.evaluate(f'COE.focusJoin("{join}")')
                  page.wait_for_timeout(350)
                  path=out/f'{engine}-{mode}-{join}-actual-iphone.png'
                  page.screenshot(path=str(path))
                  photos[(mode,join)]=Image.open(path).convert('RGB')
                  if mode=='after':
                    page.locator('canvas#map').screenshot(path=str(out/f'{engine}-after-{join}-canvas-actual-iphone.png'))
                if mode=='after':
                  page.evaluate('COE.focusJoin("west")')
                  page.touchscreen.tap(195,422)
                  assert page.evaluate('COE.moving'),'Real touch failed to issue movement'
                  page.evaluate('COE.halt()')
                  assert page.evaluate('COE.marchWestToSouth()'),'WEST->MATREI->SOUTH failed'
                  route=page.evaluate('COE.route')
                  assert len(route)==53 and [1536,478] in route and [2002,1024] in route
                  assert page.evaluate('COE.stepToEnd()')==[2806,1629]
                assert not errors,errors
                ctx.close()
              for join in ('west','south'):
                sheet=Image.new('RGB',(780,885),'#17231d')
                for x,mode in ((0,'before'),(390,'after')):
                  sheet.paste(photos[(mode,join)].resize((390,844)),(x,41))
                d=ImageDraw.Draw(sheet)
                d.text((12,12),'BEFORE: prior V267 source',fill='white')
                d.text((403,12),'AFTER: unified native - UNAPPROVED',fill='white')
                sheet.save(out/f'{engine}-{join}-actual-before-after.webp',format='WEBP',quality=87,method=6)
              browser.close()
          server.shutdown()
          print('Actual iPhone-size Chromium/WebKit scenes and WEST->MATREI->SOUTH tap-to-march verified')
          PY
      - name: Remove temporary baseline and verify protected files unchanged
        run: |
          rm -f v267-unified-before-temp.html
          python - <<'PY'
          import subprocess
          names={s[3:] for s in subprocess.check_output(
            ['git','status','--porcelain','-uall'],text=True).splitlines()}
          allowed={'v267-three-octagon-original-art-prototype.html',
            'art-reviews/v267-original-source/west-unified-native-border-unapproved.webp',
            'art-reviews/v267-original-source/south-unified-native-border-unapproved.webp',
            'art-reviews/v267-unified-native-source-comparison.webp',
            'art-reviews/v267-unified-native-review.md'}
          unexpected={p for p in names if p not in allowed and
            not p.startswith('art-reviews/v267-unified-native-phone/')}
          assert not unexpected,unexpected
          assert 'art-reviews/v267-original-source/south-unified-native-border-unapproved.webp' in names
          print('V121/V123/V94/sprites/saves/main untouched')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-unified-native-real-phone-evidence
          path: |
            art-reviews/v267-original-source/west-unified-native-border-unapproved.webp
            art-reviews/v267-original-source/south-unified-native-border-unapproved.webp
            art-reviews/v267-unified-native-source-comparison.webp
            art-reviews/v267-unified-native-review.md
            art-reviews/v267-unified-native-phone/
          retention-days: 14
      - name: Commit real artwork and actual browser screenshots to same isolated branch
        run: |
          git config user.name "century-of-empires-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "Branch advanced; preserve artifact, do not push stale candidate."
            exit 0
          fi
          git add v267-three-octagon-original-art-prototype.html \
            art-reviews/v267-original-source/west-unified-native-border-unapproved.webp \
            art-reviews/v267-original-source/south-unified-native-border-unapproved.webp \
            art-reviews/v267-unified-native-source-comparison.webp \
            art-reviews/v267-unified-native-review.md \
            art-reviews/v267-unified-native-phone/
          if git diff --cached --quiet; then
            echo "No art change; no version bump."
          else
            git commit -m "Bake coherent original WEST/SOUTH landscapes and real phone review"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
