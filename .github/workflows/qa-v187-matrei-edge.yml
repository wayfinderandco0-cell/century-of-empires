name: V187 Matrei photo-edge tone mobile QA
on:
  push:
    branches: [terrain-v187-matrei-photo-tone-20261025]
    paths:
      - 'v187-matrei-edge-tone-trial.html'
      - 'scripts/qa_v187_edge_tone.py'
      - '.github/workflows/qa-v187-matrei-edge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge-tone-mobile-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install phone browser emulators
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test terrain and immutable movement on Chromium and WebKit
        run: python scripts/qa_v187_edge_tone.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v187-four-mobile-browser-captures
          path: qa/v187-edge-tone/
