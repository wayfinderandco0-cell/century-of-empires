<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Century of Empires — EAST-01 V4 river continuity QA</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10231d;color:#f0e5ca;font-family:system-ui}
header{position:fixed;z-index:2;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:#12271fe9;border-bottom:1px solid #ad9666}
header strong{font:700 14px Georgia,serif;margin-right:auto}button,a{border:1px solid #aa9362;background:#28463b;color:#f4e4c6;border-radius:6px;padding:7px 10px;min-height:39px;font:700 12px system-ui;text-decoration:none}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#terrain{position:absolute;left:50%;top:50%;max-width:none;width:3072px;height:1024px;transform-origin:50% 50%;user-select:none;-webkit-user-drag:none;pointer-events:none}
#status{position:fixed;z-index:2;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#13271fed;border-top:1px solid #ad9666;font:12px/1.45 system-ui}
#status b{color:#f1c478}
</style></head><body>
<header><strong>V267 · EAST-01 · V4 river study</strong><button id="fit">Fit</button><button id="seam">Seam</button><button id="plus">+</button><button id="minus">−</button><a href="v267-ios-safari-review.html?southArt=coherent">Approved 3</a></header>
<div id="viewport"><img id="terrain" alt="Registered Matrei at left, unapproved EAST-01 V4 river continuity at right, with a marked vertical seam"></div>
<div id="status" role="status"><b>UNAPPROVED ORIGINAL-RIDGE REVISION</b> · River exit, bank continuity and road connection are NOT verified. No new army route or historical claim. Pinch or drag to inspect.</div>
<script>
"use strict";
const v=document.getElementById("viewport"),img=document.getElementById("terrain"),st=document.getElementById("status");
let zoom=1,cx=0,cy=0,pointers=new Map(),lastDist=0;
function draw(){img.style.transform="translate(calc(-50% + "+cx+"px),calc(-50% + "+cy+"px)) scale("+zoom+")"}
function fit(){zoom=Math.min((innerWidth-14)/3072,(innerHeight-135)/1024);cx=0;cy=0;draw()}
function seam(){zoom=Math.max(.35,Math.min(1.5,innerWidth/750));cx=0;cy=0;draw()}
function setZoom(z){zoom=Math.max(.12,Math.min(5,z));draw()}
document.getElementById("fit").onclick=fit;document.getElementById("seam").onclick=seam;
document.getElementById("plus").onclick=()=>setZoom(zoom*1.3);
document.getElementById("minus").onclick=()=>setZoom(zoom/1.3);
v.addEventListener("pointerdown",e=>{e.preventDefault();v.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let p=[...pointers.values()];lastDist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])}});
v.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){cx+=e.clientX-old[0];cy+=e.clientY-old[1]}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(lastDist>2)setZoom(zoom*d/lastDist);lastDist=d}draw()});
for(const name of ["pointerup","pointercancel","lostpointercapture"])v.addEventListener(name,e=>{pointers.delete(e.pointerId);if(pointers.size<2)lastDist=0});
img.onload=()=>{st.innerHTML="<b>V4 original-ridge image loaded.</b> Visual seam and river remain UNVERIFIED; no playable east road. Drag / pinch to inspect.";fit()};
img.onerror=()=>{st.innerHTML="<b>V4 asset not published yet.</b> The image build may still be pending or failed. The approved three-octagon game remains available above."};
img.src="terrain-grid/v267-original-art-batch-01/matrei-east-riparian-v4-comparison.webp";
window.addEventListener("resize",fit);fit();
</script></body></html>
