name: Verify V99 real Brenner stream network

on:
  push:
    branches: [terrain-v99-verified-geography]
    paths:
      - scripts/build_v99_osm_streams.py
      - .github/workflows/build-v99-streams.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Download real OSM stream network and validate lines
        run: python -u scripts/build_v99_osm_streams.py
      - name: Verify traceable stream source and count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('terrain-v99/brenner-streams.json').read_text())
          assert len(d['waterways'])>=3
          assert all(len(f['coords'])>=2 for f in d['waterways'])
          assert 'OpenStreetMap' in d['source']
          print('V99 LOCALLY MAPPED STREAMS VERIFIED',d['count'],flush=True)
          PY
      - name: Commit newly verified streams to private preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-v99/
          if ! git diff --cached --quiet; then
            git commit -m "V99 OSM measured Brenner stream network"
            for retry in 1 2 3 4; do
              git fetch origin terrain-v99-verified-geography
              git rebase origin/terrain-v99-verified-geography
              if git push origin HEAD:terrain-v99-verified-geography; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
