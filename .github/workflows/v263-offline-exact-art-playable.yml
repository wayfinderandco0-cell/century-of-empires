name: V263 Offline Exact-Art Playable Candidate (PRODUCTION RED)
on:
  push:
    branches:
      - terrain-v263-offline-exact-art-playable-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-playable-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image and browser dependencies
        run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium webkit
      - name: Compile and verify source/hash/route regressions
        run: |
          set -euo pipefail
          python -m py_compile scripts/v263_offline_exact_art_playable.py scripts/test_v263_offline_exact_art_playable.py scripts/qa_v263_synthetic_browser.py
          python scripts/test_v263_offline_exact_art_playable.py -v
          node scripts/test_v249_pinned_source_art_review.js
          node scripts/test_v248_native_cartway_review.js
      - name: Check V94, V121, V123, army sprites and saves remain untouched
        run: |
          set -euo pipefail
          git cat-file -e b29bbf06^{commit}
          git diff --name-only b29bbf06 HEAD > /tmp/v263-changed
          if grep -E '^(index\.html|v94-|v121-octagon-1-painted-road\.html|terrain-grid/v12[13]-|campaign|saves|assets/sprites)' /tmp/v263-changed; then
            echo 'PROTECTED GAME FILE CHANGED'; exit 1
          fi
          python - <<'PY'
          import hashlib
          data=open('terrain-grid/v123-atlas.js','rb').read()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob=='09f04b4062e24fbacbb645307462cdddce2b2aa3',blob
          print('Original V123 road/bridge graph SHA verified')
          PY
      - name: Four-browser actual V249 gameplay on clearly marked SYNTHETIC fixtures
        run: python scripts/qa_v263_synthetic_browser.py
      - name: Preserve non-production browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v263-SYNTHETIC-four-browser-NOT-ART-APPROVAL
          path: |
            qa/v263-synthetic-browser/*-SYNTHETIC.png
            qa/v263-synthetic-browser/report.json
          retention-days: 14
  production-art-approval:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Preserve RED gate until exact WebKit, V203, bridge banks and user approval
        run: |
          echo 'Synthetic CI imagery does not prove original V258/V260 art.'
          echo 'Exact original images remain local-only and fictional.'
          echo 'No source-registered 1780 geography, bridge-bank approval, strict V203 pass or user visual acceptance.'
          exit 1
