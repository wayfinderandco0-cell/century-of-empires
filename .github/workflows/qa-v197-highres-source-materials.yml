name: V197 High Resolution Alpine Source Materials (NOT GAME ART)
on:
  push:
    branches: ['terrain-v197-highres-alpine-material-samples-20261025']
    paths:
      - 'scripts/v197_highres_material_samples.py'
      - 'scripts/test_v197_highres_material_samples.py'
      - '.github/workflows/qa-v197-highres-source-materials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v197-modern-source-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Fail-closed geographic/source/provenance tests
        run: python scripts/test_v197_highres_material_samples.py
      - name: Download 12 native zoom-18 source JPEGs and compose 3 distinct reference patches
        run: python scripts/v197_highres_material_samples.py --download
      - name: Verify exact native JPEG, 512px source pixels and all false approval flags
        run: python scripts/v197_highres_material_samples.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v197-highres-modern-source-patches-NOT-GAME-ART
          path: qa/v197-highres-source-materials/
          retention-days: 7
