name: V267 SOUTH terrain-aware original photo art and real iPhone review
on:
  push:
    branches: [terrain-v267-three-original-art-prototype-20261028]
    paths:
      - scripts/compose_v267_south_sloping_photo.py
      - .github/workflows/v267-south-sloping-photo.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v267-south-sloping-photo
  cancel-in-progress: false
jobs:
  artwork-and-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-photo compositor and mobile browsers
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Bake SOUTH original artwork from two independent photographic sources
        run: python scripts/compose_v267_south_sloping_photo.py
      - name: Capture actual iPhone-sized West Matrei South scenes and tap-to-march
        run: |
          python - <<'PY'
          from pathlib import Path
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          out=Path('art-reviews/v267-sloping-photo-phone')
          out.mkdir(parents=True,exist_ok=True)
          server=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler)
          Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}/v267-three-octagon-original-art-prototype.html'
          with sync_playwright() as pw:
            for engine in ('chromium','webkit'):
              browser=getattr(pw,engine).launch(headless=True)
              images={}
              for mode in ('default','slope'):
                ctx=browser.new_context(viewport={'width':390,'height':844},
                  device_scale_factor=2,is_mobile=True,has_touch=True)
                page=ctx.new_page();errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto(base+('?southArt=slope' if mode=='slope' else ''),wait_until='load')
                page.wait_for_function('window.COE && COE.originalMatreiLoaded && COE.sourceRegistered',timeout=90000)
                page.wait_for_timeout(900)
                assert page.evaluate('COE.nodes')==100
                assert page.evaluate('COE.westSouthConnected')
                assert all(s['pass'] and s['gap']==0 for s in page.evaluate('COE.roadSeams'))
                for join in ('west','south'):
                  page.evaluate(f'COE.focusJoin("{join}")')
                  page.wait_for_timeout(500)
                  path=out/f'{engine}-{mode}-{join}-actual-iphone.png'
                  page.screenshot(path=str(path))
                  images[(mode,join)]=Image.open(path).convert('RGB')
                page.evaluate('COE.focusJoin("south")')
                page.wait_for_timeout(250)
                path=out/f'{engine}-{mode}-canvas-actual-iphone.png'
                page.locator('canvas#map').screenshot(path=str(path))
                if mode=='slope':
                  page.evaluate('COE.focusJoin("west")')
                  page.touchscreen.tap(195,422)
                  assert page.evaluate('COE.moving')
                  page.evaluate('COE.halt()')
                  assert page.evaluate('COE.marchWestToSouth()')
                  route=page.evaluate('COE.route')
                  assert len(route)==53 and [1536,478] in route and [2002,1024] in route
                  assert page.evaluate('COE.stepToEnd()')==[2806,1629]
                assert not errors,errors
                ctx.close()
              for join in ('west','south'):
                sheet=Image.new('RGB',(1560,1740),'#19241c')
                sheet.paste(images[('default',join)],(0,55))
                sheet.paste(images[('slope',join)],(780,55))
                d=ImageDraw.Draw(sheet)
                d.text((15,17),'BEFORE: existing SOUTH',fill='white')
                d.text((795,17),'AFTER: diagonal photo composition - UNAPPROVED',fill='white')
                sheet.save(out/f'{engine}-{join}-actual-before-after.webp',
                  format='WEBP',quality=85,method=6)
              browser.close()
          server.shutdown()
          print('Actual Chromium/WebKit 390x844 screenshots and 53-node march verified; no visual approval')
          PY
      - name: Check only isolated art files changed
        run: |
          python - <<'PY'
          import subprocess
          changed={line[3:] for line in subprocess.check_output(
            ['git','status','--porcelain','-uall'],text=True).splitlines()}
          allowed={'v267-three-octagon-original-art-prototype.html',
            'art-reviews/v267-original-source/south-sloping-photo-join-unapproved.webp',
            'art-reviews/v267-sloping-photo-join-review.md',
            'art-reviews/v267-sloping-photo-source-comparison.webp'}
          assert all(p in allowed or p.startswith('art-reviews/v267-sloping-photo-phone/')
            for p in changed),changed
          assert 'art-reviews/v267-original-source/south-sloping-photo-join-unapproved.webp' in changed
          print('V121/V123/V94, sprites, saves and production unchanged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-sloping-photo-actual-mobile-review
          path: |
            art-reviews/v267-original-source/south-sloping-photo-join-unapproved.webp
            art-reviews/v267-sloping-photo-join-review.md
            art-reviews/v267-sloping-photo-source-comparison.webp
            art-reviews/v267-sloping-photo-phone/
          retention-days: 14
      - name: Commit substantive source art and actual browser evidence on same V267 branch
        run: |
          git config user.name "century-of-empires-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "Branch advanced: preserve artifact, do not push stale candidate."
            exit 0
          fi
          git add v267-three-octagon-original-art-prototype.html \
            art-reviews/v267-original-source/south-sloping-photo-join-unapproved.webp \
            art-reviews/v267-sloping-photo-join-review.md \
            art-reviews/v267-sloping-photo-source-comparison.webp \
            art-reviews/v267-sloping-photo-phone/
          if git diff --cached --quiet; then
            echo "No art change; no version bump."
          else
            git commit -m "Bake SOUTH sloping photographic seam and real mobile review"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
