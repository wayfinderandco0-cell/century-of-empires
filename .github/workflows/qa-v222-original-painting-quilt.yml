name: V222 Original Painting Material Quilt (ART ACCEPTANCE RED)
on:
  push:
    branches: ['terrain-v222-original-painting-material-quilt-20261026']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-original-painting-neighbors:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Preserve protected Matrei and V123 road graph, source georegistration still BLOCKED
        run: |
          git hash-object v121-octagon-1-painted-road.html | grep '^4c6aa5cda9e7c359b6d2a49d5b5fe8a597346382$'
          git hash-object terrain-grid/v123-atlas.js | grep '^09f04b4062e24fbacbb645307462cdddce2b2aa3$'
          python scripts/test_v209_landmark_tiepoint_intake.py
          python scripts/v209_landmark_tiepoint_intake.py --report qa/v222-registration/report.json
          python -c "import json; r=json.load(open('qa/v222-registration/report.json')); assert r['registrationStatus']=='BLOCKED_MISSING_REAL_TIEPOINTS'"
      - name: Generate two distinct full-native-size original-painting material studies
        run: |
          python -m py_compile scripts/v222_original_painting_quilt.py scripts/test_v222_original_painting_quilt.py
          python scripts/v222_original_painting_quilt.py
          python scripts/v222_original_painting_quilt.py --verify
          python scripts/test_v222_original_painting_quilt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v222-two-source-painted-cells-unregistered
          path: |
            terrain-v222/assets/
            qa/v222-registration/
          retention-days: 7
      - name: Pin generated artwork only on isolated V222 development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-v222/assets/
          if ! git diff --cached --quiet; then
            git commit -m "V222: pin two distinct original-painting material study cells [skip ci]"
            git push origin HEAD:refs/heads/terrain-v222-original-painting-material-quilt-20261026
          fi
  four-browser-painted-neighbors:
    needs: build-original-painting-neighbors
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: v222-two-source-painted-cells-unregistered
          path: .
      - name: Existing four-browser road, bridge, army, camera and tap gates
        run: |
          python scripts/qa_v137_coherent.py
          python scripts/qa_v202_road_segment_taps.py
      - name: Test actual V222 vs V192 game, original Matrei pixels and route alignment in all four phone layouts
        run: python scripts/qa_v222_painted_game_art.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v222-actual-phone-and-strict-art-review
          path: |
            qa/v222-original-painting-game-art/
            qa/v137-clean/
            qa/v202-road-segment-taps/
          retention-days: 7
      - name: Pin actual phone visual review evidence only on isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin terrain-v222-original-painting-material-quilt-20261026
          git checkout -B terrain-v222-original-painting-material-quilt-20261026 origin/terrain-v222-original-painting-material-quilt-20261026
          mkdir -p terrain-v222/review
          cp qa/v222-original-painting-game-art/webkit-portrait-review.jpg terrain-v222/review/
          cp qa/v222-original-painting-game-art/webkit-portrait-review-data.js terrain-v222/review/
          cp qa/v222-original-painting-game-art/report.json terrain-v222/review/phone-report.json
          git add terrain-v222/review/
          if ! git diff --cached --quiet; then
            git commit -m "V222: actual WebKit portrait three-cell screenshot and QA evidence [skip ci]"
            git push origin HEAD:refs/heads/terrain-v222-original-painting-material-quilt-20261026
          fi
      - name: Original strict V203 photographic-art acceptance threshold remains enforced RED
        run: |
          python scripts/qa_v203_canopy_structure.py --screenshots qa/v222-original-painting-game-art --output qa/v222-original-painting-game-art/strict-enforced --enforce
      - name: Human visual approval must remain fail-closed
        run: |
          python -c "import json; m=json.load(open('terrain-v222/assets/manifest.json')); assert m['gameArtApproved'] and m['physicalIPhoneApproved'], 'V222 ART NOT APPROVED: painterly quilting requires human review'"
