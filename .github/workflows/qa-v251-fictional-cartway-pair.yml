name: V251 Fictional Whole-Scene Cartway Study (ART RED)
on:
  push:
    branches:
      - terrain-v251-fictional-native-cartway-pair-study-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy opencv-python-headless
      - name: Compile and test new source-pixel warp
        run: |
          python -m py_compile scripts/v251_fictional_cartway_pair.py scripts/test_v251_fictional_cartway_pair.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_v251_fictional_cartway_pair.py
      - name: Pin V123 atlas unchanged
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from v251_fictional_cartway_pair import require_immutable_atlas
          require_immutable_atlas('terrain-grid/v123-atlas.js')
          print('Immutable V123 graph: PASS')
          PY
  production-art-approval:
    runs-on: ubuntu-latest
    needs: isolated-geometry
    steps:
      - name: ART RED — no verified geography, human approval or four-browser gameplay
        run: |
          echo 'WEST source warp exceeds 155px; SOUTH only geometry-pass.'
          echo 'Unverified fictional source traces and bridge banks; strict V203/four-browser game art untested.'
          echo 'Do not merge or deploy.'
          exit 1
