name: V304 Mobile Georeferenced Map Art QA
on:
  push:
    branches: [map-v304-georeferenced-relief-20261103]
  pull_request:
    paths:
      - 'index.html'
      - 'terrain-v94/map-lod.js'
      - 'scripts/qa_v304_geography.py'
      - '.github/workflows/qa-v304-geography.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geo-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mobile WebKit and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps webkit chromium
      - name: Check geographic registration, LOD and original campaign on iPhone
        run: python scripts/qa_v304_geography.py
      - name: Retain browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v304-map-art-mobile
          path: qa/v304/
