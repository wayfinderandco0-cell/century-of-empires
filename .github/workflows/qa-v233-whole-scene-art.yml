name: V233 Source-guided Whole-scene Art (PRODUCTION RED)
on:
  push:
    branches:
      - terrain-v233-source-guided-whole-scene-study-20261027
  workflow_dispatch:
jobs:
  source-guided-study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile and execute whole-scene tests
        run: |
          python -m py_compile scripts/v233_source_guided_art.py scripts/test_v233_source_guided_art.py
          python scripts/test_v233_source_guided_art.py
      - name: Fail closed - no real artwork acceptance
        run: |
          echo "ART RED: original source art, V203 and user visual approval missing."
          exit 1
