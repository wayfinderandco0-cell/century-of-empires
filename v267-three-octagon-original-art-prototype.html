function poly(){ctx.beginPath();ctx.moveTo(CUT,0);ctx.lineTo(W-CUT,0);ctx.lineTo(W,CUT);ctx.lineTo(W,H-CUT);ctx.lineTo(W-CUT,H);ctx.lineTo(CUT,H);ctx.lineTo(0,H-CUT);ctx.lineTo(0,CUT);ctx.closePath()}
function strokeTrack(pts,important=true){
 if(!pts||pts.length<2)return;
 ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
 function stroke(color,w,alpha){ctx.globalAlpha=alpha;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
 stroke("#1c231a",important?36:25,.30);stroke("#4b432e",important?27:18,.52);
 stroke("#b7a17a",important?19:11,.67);stroke("#d0b88d",important?10:6,.57);
 stroke("#726044",important?3.0:2,.68);
 ctx.restore();
}
function loadImage(src){return new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}
function rebuildGraph(){
 graph.clear();
 function node(p){const id=key(p);if(!graph.has(id))graph.set(id,{p,edges:[]});return id}
 for(const tile of atlas){for(const points of Object.values(tile.roads)){
  for(let i=1;i<points.length;i++){
   const p=worldPoint(tile,points[i-1]),q=worldPoint(tile,points[i]),a=node(p),b=node(q),d=dist(p,q);
   graph.get(a).edges.push({to:b,d});graph.get(b).edges.push({to:a,d})
  }
 }}
 return [graph.has(key([1536,478])),graph.has(key([2002,1024]))];
}
function route(from,to){
 const a=key(from),b=key(to),q=new Set(graph.keys()),cost=new Map([[a,0]]),prev=new Map();
 if(!q.has(a)||!q.has(b))return null;
 while(q.size){let u=null,best=Infinity;for(const n of q){let d=cost.get(n)??Infinity;if(d<best){best=d;u=n}}
 if(u===null||!Number.isFinite(best))break;q.delete(u);if(u===b)break;
 for(const e of graph.get(u).edges)if(q.has(e.to)&&best+e.d<(cost.get(e.to)??Infinity)){cost.set(e.to,best+e.d);prev.set(e.to,u)}
 }
 if(!cost.has(b))return null;const path=[b];while(path[0]!==a){const p=prev.get(path[0]);if(!p)return null;path.unshift(p)}
 return path.map(k=>graph.get(k).p);
}
function start(to){
 let source=army,bestKey=null,best=Infinity;
 for(const [k,n] of graph){let d=dist(n.p,source);if(d<best){best=d;bestKey=k}}
 const points=route(graph.get(bestKey).p,to);
 if(!points){document.getElementById("status").textContent="No connected road path to this location";return false}
 marchPath=dist(source,points[0])>1?[source,...points]:points;
 total=marchPath.slice(1).reduce((v,p,i)=>v+dist(p,marchPath[i]),0);
 traveled=0;moving=total>1;
 document.getElementById("status").textContent="Army marching on connected cartways • "+Math.round(total)+" map units";
 return true;
}
function sample(path,d){
 for(let i=1;i<path.length;i++){let seg=dist(path[i-1],path[i]);if(d<=seg){let f=d/seg;return [path[i-1][0]+(path[i][0]-path[i-1][0])*f,path[i-1][1]+(path[i][1]-path[i-1][1])*f]}d-=seg}
 return path.at(-1);
}
function roadTap(p){
 let nearest=null,best=Infinity;
 for(const n of graph.values()){let d=dist(p,n.p);if(d<best){nearest=n.p;best=d}}
 if(best<105)start(nearest);else document.getElementById("status").textContent="Tap closer to a visible cartway.";
}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle="#293e30";ctx.fillRect(0,0,cw,ch);
 ctx.save();ctx.translate(cw/2-cam[0]*scale,ch/2-cam[1]*scale);ctx.scale(scale,scale);
 // Paint behind the beveled octagons to avoid bare procedural-green wedges.
 for(const tile of atlas){
  ctx.save();ctx.translate(...tile.o);
  let tex=textures[tile.id];
  if(tex){ctx.globalAlpha=.45;ctx.drawImage(tex,0,0,W,H)}
  ctx.restore();
 }
 for(const tile of atlas){
  ctx.save();ctx.translate(...tile.o);
  poly();ctx.clip();
  let tex=textures[tile.id];if(tex){ctx.globalAlpha=1;ctx.drawImage(tex,0,0,W,H)}
  // WEST/SOUTH roads are physically registered to the fixed V123 coordinates.
  // They are blended into new landscape art; center already contains painted roads.
  if(tile.id==="west")strokeTrack(tile.roads.east);
  if(tile.id==="south")strokeTrack(tile.roads.north);
  if(tile.id==="matrei"){
   strokeTrack([[0,478],[99,478]]);strokeTrack([[466,958],[466,1024]]);
  }
  ctx.restore();
  ctx.save();ctx.translate(...tile.o);poly();ctx.strokeStyle="#e1cda087";ctx.lineWidth=7;ctx.stroke();ctx.restore();
 }
 if(showRoads){
  for(const tile of atlas){ctx.save();ctx.translate(...tile.o);
   for(const pts of Object.values(tile.roads)){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.lineWidth=5;ctx.strokeStyle="#f8e76c";ctx.stroke();}
   ctx.restore();
  }
 }
 ctx.save();ctx.font="bold 36px Georgia";ctx.textAlign="center";ctx.shadowColor="#09150e";ctx.shadowBlur=12;ctx.fillStyle="#fff0ca";ctx.fillText("WESTERN PASS",800,125);ctx.fillText("MATREI",2625,130);ctx.fillText("SOUTHERN VALLEY",2340,1960);ctx.restore();
 if(army){
  ctx.save();ctx.translate(...army);ctx.beginPath();ctx.arc(0,0,31,0,Math.PI*2);ctx.fillStyle="#152b25e9";ctx.fill();ctx.lineWidth=5;ctx.strokeStyle="#f0cf77";ctx.stroke();
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold 39px serif";ctx.fillStyle="#f9e4a2";ctx.fillText("⚔",0,2);
  ctx.font="bold 18px sans-serif";ctx.fillStyle="#fff0c4";ctx.fillText("720",0,-46);ctx.restore()
 }
 ctx.restore();
}
function resize(){cw=C.clientWidth;ch=C.clientHeight;dpr=Math.min(window.devicePixelRatio||1,2);C.width=cw*dpr;C.height=ch*dpr;base=Math.min(cw/3450,ch/2350);scale=base*zoom;render()}
function frame(time){
 let dt=Math.min(.12,(time-last)/1000);last=time;
 if(moving){traveled=Math.min(total,traveled+dt*320);army=sample(marchPath,traveled);if(traveled>=total-1){moving=false;document.getElementById("status").textContent="Army arrived • crossings verified"}}
 render();requestAnimationFrame(frame);
}
function pan(dx,dy){cam=[cam[0]-dx/scale,cam[1]-dy/scale]}
C.addEventListener("pointerdown",e=>{
 C.setPointerCapture(e.pointerId);pointerState.set(e.pointerId,[e.clientX,e.clientY]);
 if(pointerState.size===1)down=[e.clientX,e.clientY];
 else down=null;
 if(pointerState.size===2){let p=[...pointerState.values()];gesture={d:dist(p[0],p[1])}}
});
C.addEventListener("pointermove",e=>{
 if(!pointerState.has(e.pointerId))return;
 let prev=pointerState.get(e.pointerId);pointerState.set(e.pointerId,[e.clientX,e.clientY]);
 if(pointerState.size===2){let p=[...pointerState.values()],nd=dist(p[0],p[1]),mid=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2];
  if(gesture&&gesture.d>1){let old=worldAt(mid);zoom=Math.max(.75,Math.min(9,zoom*nd/gesture.d));scale=base*zoom;let fresh=worldAt(mid);cam[0]+=old[0]-fresh[0];cam[1]+=old[1]-fresh[1]}gesture={d:nd};down=null;return
 }
 if(down&&dist(down,[e.clientX,e.clientY])>8)down=null;
 pan(e.clientX-prev[0],e.clientY-prev[1]);
});
function finish(e){if(!pointerState.has(e.pointerId))return;if(pointerState.size===1&&down&&dist(down,[e.clientX,e.clientY])<10){roadTap(worldAt([e.clientX,e.clientY]))}
 pointerState.delete(e.pointerId);if(pointerState.size<2)gesture=null;down=null;
}
for(const ev of ["pointerup","pointercancel","lostpointercapture"])C.addEventListener(ev,finish);
window.addEventListener("resize",resize);
document.getElementById("whole").onclick=()=>{cam=[1590,1020];zoom=1;scale=base*zoom};
document.getElementById("center").onclick=()=>{cam=army.slice();zoom=3;scale=base*zoom};
document.getElementById("roads").onclick=()=>{showRoads=!showRoads;document.getElementById("roads").textContent=showRoads?"Hide road lines":"Show road lines"};
document.getElementById("march").onclick=()=>{army=[275,550];start([1536+1270,1024+605]);cam=[1550,975];zoom=1.22;scale=base*zoom};
window.COE=Object.freeze({
 get nodes(){return graph.size},get moving(){return moving},get originalMatreiLoaded(){return srcStatus==="original"},
 get army(){return army.slice()},get westSouthConnected(){return !!route([275,550],[2806,1629])},
 get roadSeams(){return {west:dist([1536,478],[1536,478]),south:dist([2002,1024],[2002,1024])}},
 marchWestToSouth:()=>{army=[275,550];return start([2806,1629])}
});
async function boot(){
 // New source tiles are embedded in this HTML, making them available offline.
 const [west,south]=await Promise.all([loadImage(ART_WEST),loadImage(ART_SOUTH)]);
 textures.west=west;textures.south=south;
 textures.matrei=await loadImage(ART_MATREI_FALLBACK);
 // Fallback is only used if the remote exact V121 photograph cannot load.
 
 rebuildGraph();resize();requestAnimationFrame(frame);
 document.getElementById("status").textContent="Playable prototype ready • 3 connected octagons";
 const el=document.getElementById("source");
 try {
  const u="https://raw.githubusercontent.com/wayfinderandco0-cell/century-of-empires/main/v121-octagon-1-painted-road.html";
  const controller=new AbortController();const abort=setTimeout(()=>controller.abort(),6500);
  const resp=await fetch(u,{cache:"force-cache",signal:controller.signal});clearTimeout(abort);
  if(!resp.ok)throw Error("HTTP "+resp.status);
  const doc=await resp.text();
  const match=doc.match(/source\.src='(data:image\/webp;base64,[^']+)'/);
  if(!match)throw Error("Original V121 art not present");
  const center=await loadImage(match[1]);
  textures.matrei=center;srcStatus="original";el.textContent="Matrei original V121 loaded • WEST/SOUTH original V267 prototype art";
  const m=doc.match(/const ROADS=(\{[^\r\n]+\});/);
  if(m){const original=JSON.parse(m[1]);atlas[1].roads={...original,west:[[0,478],...original.west],south:[...original.south,[466,1024]]};rebuildGraph()}
 }catch(e){
  srcStatus="unavailable";
  el.textContent="Matrei source temporarily unavailable online; WEST/SOUTH art and route graph still loaded";
 }
 document.getElementById("status").textContent="Ready • three connected octagons • choose March west → south";
}
boot().catch(e=>{document.getElementById("status").textContent="Load error: "+e.message});
</script></body></html>
