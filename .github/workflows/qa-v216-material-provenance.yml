name: V216 Native Alpine Material Provenance (game art remains RED)
on:
  push:
    branches: ['terrain-v216-source-provenance-native-scale-20261026']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Inherited geographic source and V216 negative controls
        run: |
          python scripts/test_v204_contiguous_matrei_sources.py
          python scripts/test_v205_adjacent_forest_materials.py
          python scripts/test_v206_audited_natural_cover.py
          python scripts/test_v207_conservative_modern_masks.py
          python scripts/test_v208_source_game_frame_audit.py
          python scripts/test_v209_landmark_tiepoint_intake.py
          node scripts/test_v213_source_geodesy.js
          python scripts/test_v214_source_native_material_bank.py
          python scripts/test_v215_native_source_seam_atlas.py
          python scripts/test_v216_material_provenance_review.py
      - name: Download original modern forest source and build native atlas
        run: |
          python scripts/v204_contiguous_matrei_sources.py --site forest --download --output qa/v216-native-source
          python scripts/v204_contiguous_matrei_sources.py --site forest --verify --output qa/v216-native-source
          python scripts/v215_native_source_seam_atlas.py --source qa/v216-native-source --output qa/v216-native-atlas
      - name: Build and verify original-pixel material comparison
        run: |
          python scripts/v216_material_provenance_review.py --atlas qa/v216-native-atlas --output qa/v216-provenance
          python scripts/v216_material_provenance_review.py --atlas qa/v216-native-atlas --output qa/v216-provenance --verify
          python scripts/v209_landmark_tiepoint_intake.py --report qa/v216-registration/report.json
          python -c "import json; r=json.load(open('qa/v216-registration/report.json')); assert r['registrationStatus']=='BLOCKED_MISSING_REAL_TIEPOINTS'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v216-native-source-comparison-NOT-game-art
          path: |
            qa/v216-provenance/
            qa/v216-registration/
          retention-days: 7
  original-phone-and-strict-art:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium webkit
      - name: Original road bridge army camera and four-phone regression
        run: |
          python scripts/qa_v194_cartway_pigment.py
          python scripts/qa_v192_cartways.py
          python scripts/qa_v193_camera_coverage.py
          python scripts/qa_v201_touch_camera_cache.py
          python scripts/qa_v202_road_segment_taps.py
          python scripts/qa_v192_terrain_parity.py --capture --enforce
      - name: Preserve strict V203 game photographic detail RED
        run: python scripts/qa_v203_canopy_structure.py --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v216-original-phone-art-RED
          path: |
            qa/v192-three-centers/
            qa/v203-canopy-structure/
            qa/v202-road-segment-taps/
          retention-days: 7
