name: Octagon 1 Independent Source-Art Review
on:
  push:
    branches:
      - octagon-1-raw-source-*
    paths:
      - "octagon-1-road-authoring.html"
      - "v115-town-pan-controls.html"
      - "v119-matrei-town-label.html"
      - "scripts/audit_octagon_1_source_art.py"
      - "scripts/audit_octagon_1_edge.py"
      - "tests/test_octagon_1_*.py"
      - ".github/workflows/qa-octagon-1-raw-art.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  raw-source-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pillow
      - name: Check source identity, raw image and east-edge audits
        run: python -m unittest discover -s tests -p 'test_octagon_1_*.py' -v
      - name: Extract unpainted JPEG evidence
        run: python scripts/audit_octagon_1_source_art.py
      - name: Inspect east image boundary without inventing neighboring terrain
        run: python scripts/audit_octagon_1_edge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octagon-1-unpainted-source-and-edge
          path: |
            qa/octagon-1-raw-art/
