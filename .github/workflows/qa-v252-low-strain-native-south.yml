name: V252 Low-Strain SOUTH Native Cartway Study (ART RED)
on:
  push:
    branches:
      - terrain-v252-low-strain-native-south-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-registration-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric and image dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy opencv-python-headless
      - name: Compile and test low-strain registration
        run: |
          python -m py_compile scripts/v252_low_strain_south_candidate.py scripts/test_v252_low_strain_south_candidate.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_v252_low_strain_south_candidate.py
      - name: Immutable V123 source graph pin
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from v251_fictional_cartway_pair import require_immutable_atlas
          require_immutable_atlas('terrain-grid/v123-atlas.js')
          print('Immutable V123 road/bridge graph: PASS')
          PY
  production-art-approval:
    runs-on: ubuntu-latest
    needs: source-registration-geometry
    steps:
      - name: ART RED — unsupported SOUTH continuation, WEST and real browser art unapproved
        run: |
          echo 'SOUTH near-native fictional road has ~150px unsupported visible continuation.'
          echo 'WEST remains rejected; historical tiepoints, bridge banks, license and human review absent.'
          echo 'Synthetic CI geometry is not four-browser gameplay or strict V203 artwork approval.'
          echo 'Do not merge, deploy, or change V123 routes.'
          exit 1
