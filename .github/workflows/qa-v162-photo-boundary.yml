name: V162 Matrei photo-island boundary audit — unapproved game art
on:
  push:
    branches: [terrain-v162-matrei-photo-boundary-audit-20261024]
    paths:
      - 'scripts/qa_v162_photo_boundary.py'
      - 'scripts/test_v162_photo_boundary.py'
      - '.github/workflows/qa-v162-photo-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v162-photo-boundary:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin immutable V121/V123 geometry and V97/V102 source images
        run: node scripts/test_v161_native_material.js
      - name: Install pinned QA dependencies
        run: python -m pip install playwright==1.64.1 pillow==12.0.0
      - name: Six synthetic boundary diagnostic tests
        run: python scripts/test_v162_photo_boundary.py
      - name: Capture four real mobile-engine/orientation game screenshots
        run: python scripts/qa_v161_native_material.py
      - name: Measure the unchanged V121 photo island boundary in each real screenshot
        run: python scripts/qa_v162_photo_boundary.py --screenshots qa/v161-native
      - name: Preserve strict V140 visual gate unit tests
        run: python scripts/test_v140_neighbor_detail.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v162-matrei-photo-island-boundary-UNAPPROVED
          path: qa/v161-native/
          retention-days: 7
      - name: FAIL CLOSED on existing West/South visual detail gate
        run: python scripts/qa_v140_neighbor_detail.py --screenshots qa/v161-native --enforce
