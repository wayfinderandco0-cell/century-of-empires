name: V157 residual modern-source exclusion audit (NOT historical art)
on:
  push:
    branches: [terrain-v157-residual-modern-source-audit-20261024]
    paths:
      - 'scripts/v157_residual_modern_audit.py'
      - 'scripts/test_v157_residual_modern_audit.py'
      - '.github/workflows/qa-v157-residual-modern.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  residual-modern-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image dependency
        run: python -m pip install Pillow==12.0.0
      - name: Run synthetic fail-closed tests (NOT genuine-source verification)
        run: python scripts/test_v157_residual_modern_audit.py
      - name: Download 27 authentic geographic source JPEGs
        run: python scripts/v153_geographic_strip.py --download
      - name: Verify original geographic source and exact sector pixels
        run: python scripts/v153_geographic_strip.py --verify
      - name: Rebuild and verify prior V156 modern exclusions
        run: |
          python scripts/v156_modern_exclusion.py
          python scripts/v156_modern_exclusion.py --verify
      - name: Generate V157 remaining observed modern roofs/date exclusions
        run: python scripts/v157_residual_modern_audit.py
      - name: Independently recheck V157 hashes, alpha pixels and unapproved status
        run: python scripts/v157_residual_modern_audit.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v157-modern-source-residual-audit-NOT-game-art
          path: |
            qa/v157-residual-modern/
            qa/v156-modern-exclusion/manifest.json
            qa/v153-geographic-strip/manifest.json
          retention-days: 7
