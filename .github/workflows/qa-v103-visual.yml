name: V103 Brenner conifer and water refinement
on:
  push:
    branches: [terrain-v103-visual-repair]
    paths: ['v103-brenner-visual-pilot.html', 'terrain-v103/pilot.js', 'terrain-v103/pilot.css', 'terrain-v103/pilot.css', 'scripts/qa_v103_mobile.py', '.github/workflows/qa-v103-visual.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v103-visual-repair
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare original assets and test browsers
        run: |
          pip install numpy scipy pillow playwright
          python -m playwright install --with-deps chromium webkit
          python terrain-v103/pilot.css
          node --check terrain-v103/pilot.js
      - name: Render and test both phone orientations
        run: python scripts/qa_v103_mobile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v103-visual-evidence-${{ github.run_id }}
          path: terrain-v103/
      - name: Save assets and evidence only to V102
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin terrain-v103-visual-repair
          if [ "$(git rev-parse origin/terrain-v103-visual-repair)" != "$SOURCE_SHA" ]; then
            echo 'Source advanced; evidence retained in uniquely named artifact. Do not overwrite newer source.'
            exit 1
          fi
          git add terrain-v103/
          if ! git diff --cached --quiet; then
            git commit -m 'V103: persist mobile browser screenshots and QA evidence'
            git push origin HEAD:terrain-v103-visual-repair
          fi
