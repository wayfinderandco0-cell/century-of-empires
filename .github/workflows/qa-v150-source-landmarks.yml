name: V150 source landmark provenance (no game registration)
on:
  push:
    branches: [terrain-v150-source-landmark-evidence-20261023]
    paths:
      - 'terrain-grid/v150-landmark-evidence.js'
      - 'scripts/test_v150_landmark_evidence.js'
      - 'qa/v150-source-observations.json'
      - '.github/workflows/qa-v150-source-landmarks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modern-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned image dependency
        run: python -m pip install Pillow==12.0.0
      - name: Reacquire official modern orthophoto and image hashes
        run: python scripts/v147_orthophoto_mosaic.py --download --output qa/v150-source
      - name: Verify exact source pixels and reject invented game controls
        run: node scripts/test_v150_landmark_evidence.js qa/v150-source/manifest.json qa/v150-source-observations.json qa/v150-source/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v150-modern-landmark-evidence-not-game-art
          path: |
            qa/v150-source/manifest.json
            qa/v150-source/evidence.json
          retention-days: 7
